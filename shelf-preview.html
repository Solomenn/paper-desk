<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9e7e1">
  <title>图书馆书架 A · 暖白材质预览</title>
  <style>
    :root { color-scheme: light; --ink:#343630; --muted:#77786f; --paper:rgba(248,247,242,.88); --line:rgba(70,72,64,.14); }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#e9e7e1; color:var(--ink); font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif; }
    #stage { position:fixed; inset:0; }
    canvas { display:block; width:100%; height:100%; outline:none; }
    .topbar { position:fixed; top:22px; left:24px; z-index:3; display:flex; align-items:flex-start; gap:14px; pointer-events:none; }
    .mark { width:34px; height:34px; border:1px solid rgba(60,62,55,.25); border-radius:9px; display:grid; place-items:center; background:rgba(248,247,242,.72); font-size:15px; }
    .heading { padding-top:1px; }
    h1 { font-size:16px; line-height:1.3; font-weight:600; margin:0 0 4px; letter-spacing:.02em; }
    .sub { color:var(--muted); font-size:11px; letter-spacing:.02em; }
    .source { position:fixed; top:24px; right:24px; z-index:3; color:#5d655d; text-decoration:none; font-size:11px; border-bottom:1px solid rgba(70,72,64,.28); padding-bottom:3px; }
    .panel { position:fixed; left:24px; bottom:22px; z-index:3; width:min(390px,calc(100vw - 48px)); padding:14px; border:1px solid var(--line); border-radius:13px; background:var(--paper); box-shadow:0 12px 36px rgba(45,45,38,.08); backdrop-filter:blur(18px); }
    .row { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
    button { border:1px solid rgba(65,68,60,.18); border-radius:8px; background:rgba(255,255,255,.62); color:var(--ink); padding:8px 11px; font:inherit; font-size:11px; cursor:pointer; transition:background .16s,border-color .16s; }
    button:hover { background:#fff; border-color:rgba(65,68,60,.34); }
    button[aria-pressed="true"] { background:#e4e7df; border-color:#aeb7a7; }
    button:disabled { opacity:.4; cursor:not-allowed; }
    .divider { height:1px; background:var(--line); margin:11px 0; }
    .mat-title { font-size:11px; color:var(--muted); margin-bottom:7px; }
    #materials { display:flex; flex-wrap:wrap; gap:6px; max-height:82px; overflow:auto; }
    .mat { display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:7px; padding:5px 7px; background:rgba(255,255,255,.42); font-size:10px; color:#55574f; max-width:100%; }
    .mat input { width:12px; height:12px; margin:0; accent-color:#a9b3a1; }
    .swatch { width:12px; height:12px; flex:0 0 12px; border-radius:3px; border:1px solid rgba(0,0,0,.12); }
    .mat-name { max-width:112px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #status { position:fixed; z-index:3; left:50%; top:50%; transform:translate(-50%,-50%); padding:10px 14px; border-radius:8px; background:rgba(248,247,242,.88); color:#64665d; font-size:12px; pointer-events:none; }
    #hint { position:fixed; z-index:2; right:24px; bottom:24px; color:#77786f; font-size:10px; text-align:right; pointer-events:none; }
    @media(max-width:600px) {
      .topbar { top:14px; left:14px; }
      .source { top:17px; right:14px; }
      .panel { left:12px; bottom:12px; width:calc(100vw - 24px); padding:11px; }
      #hint { display:none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div class="topbar">
    <div class="mark">A</div>
    <div class="heading">
      <h1>Public Library · Stack A</h1>
      <div class="sub">双面四层书架 / 暖白材质试色</div>
    </div>
  </div>
  <a class="source" href="https://3dassets.dev/assets/public-library-and-reading-garden-public-library-and-r-9af56b98" target="_blank" rel="noopener">模型来源 ↗</a>
  <div id="status">正在加载真实 GLB 模型…</div>
  <div class="panel">
    <div class="row">
      <button id="straight" aria-pressed="true">直线书架</button>
      <button id="end" aria-pressed="false">端部组件</button>
      <button id="corner" aria-pressed="false">转角组件</button>
    </div>
    <div class="divider"></div>
    <div class="row">
      <button id="single" aria-pressed="false">单体</button>
      <button id="rows" aria-pressed="true">多排书库</button>
      <button id="original">原始材质</button>
      <button id="white" aria-pressed="true">暖白结构</button>
      <button id="reset">重置视角</button>
    </div>
    <div class="divider"></div>
    <div class="mat-title">材质微调 · 勾选要改为暖白色的材质</div>
    <div id="materials"></div>
  </div>
  <div id="hint">拖动旋转 · 滚轮缩放 · 右键平移</div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const MODEL_URLS = {
      straight: 'https://cdn.3dassets.dev/assets/30913/v1/model.glb',
      end: 'https://cdn.3dassets.dev/assets/30914/v1/model.glb',
      corner: 'https://cdn.3dassets.dev/assets/30915/v1/model.glb'
    };
    const WARM_WHITE = '#f0eee7';
    const stage = document.querySelector('#stage');
    const status = document.querySelector('#status');
    const materialPanel = document.querySelector('#materials');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#e9e7e1');

    const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.05, 100);
    camera.position.set(5.2, 3.7, 6.2);

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.8));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    stage.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.target.set(0, 1.05, 0);
    controls.minDistance = 2.2;
    controls.maxDistance = 16;
    controls.maxPolarAngle = Math.PI * 0.49;

    scene.add(new THREE.HemisphereLight('#fffdf6', '#b7b3a8', 2.0));
    const key = new THREE.DirectionalLight('#fff9ec', 3.1);
    key.position.set(-3.8, 7.5, 4.5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -7;
    key.shadow.camera.right = 7;
    key.shadow.camera.top = 8;
    key.shadow.camera.bottom = -7;
    key.shadow.bias = -0.00018;
    scene.add(key);
    const fill = new THREE.DirectionalLight('#e5ecf2', 0.75);
    fill.position.set(5, 4, -5);
    scene.add(fill);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({ color:'#e2dfd7', roughness:1, metalness:0 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.015;
    floor.receiveShadow = true;
    scene.add(floor);

    let sourceRoot = null;
    let arrangement = null;
    let materials = [];
    let selected = new Set();
    let viewMode = 'rows';
    let currentModule = 'straight';
    const modelCache = new Map();
    const loader = new GLTFLoader();

    function materialColorHex(mat) {
      return mat.color ? '#' + mat.color.getHexString() : '#ffffff';
    }

    function collectMaterials(root) {
      const found = new Map();
      root.traverse((obj) => {
        if (!obj.isMesh) return;
        obj.castShadow = true;
        obj.receiveShadow = true;
        const list = Array.isArray(obj.material) ? obj.material : [obj.material];
        list.forEach((mat) => {
          if (!mat || found.has(mat.uuid)) return;
          found.set(mat.uuid, {
            mat,
            name: mat.name || ('Material ' + (found.size + 1)),
            original: {
              color: mat.color ? mat.color.clone() : new THREE.Color('#ffffff'),
              map: mat.map || null,
              roughness: mat.roughness,
              metalness: mat.metalness
            },
            meshes: 0
          });
        });
        list.forEach((mat) => {
          const item = found.get(mat.uuid);
          if (item) item.meshes += 1;
        });
      });
      materials = [...found.values()];
      selected = new Set(materials.filter((item) => /oak|wood|timber|shelf|panel|plinth|frame|structure|end|paint/i.test(item.name) && !/book|cover|spine|paper|page/i.test(item.name)));
      renderMaterialControls();
    }

    function renderMaterialControls() {
      materialPanel.innerHTML = '';
      materials.forEach((item) => {
        const label = document.createElement('label');
        label.className = 'mat';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = selected.has(item);
        input.addEventListener('change', () => {
          if (input.checked) selected.add(item); else selected.delete(item);
          applyWarmWhite();
        });
        const swatch = document.createElement('span');
        swatch.className = 'swatch';
        swatch.style.background = materialColorHex(item.mat);
        const name = document.createElement('span');
        name.className = 'mat-name';
        name.textContent = item.name + ' · ' + item.meshes;
        label.append(input, swatch, name);
        materialPanel.appendChild(label);
      });
    }

    function restoreOriginal() {
      materials.forEach((item) => {
        item.mat.color.copy(item.original.color);
        item.mat.map = item.original.map;
        if (item.original.roughness !== undefined) item.mat.roughness = item.original.roughness;
        if (item.original.metalness !== undefined) item.mat.metalness = item.original.metalness;
        item.mat.needsUpdate = true;
      });
      renderMaterialControls();
      document.querySelector('#original').setAttribute('aria-pressed', 'true');
      document.querySelector('#white').setAttribute('aria-pressed', 'false');
    }

    function applyWarmWhite() {
      materials.forEach((item) => {
        if (selected.has(item)) {
          item.mat.color.set(WARM_WHITE);
          item.mat.map = null;
          if ('roughness' in item.mat) item.mat.roughness = 0.78;
          if ('metalness' in item.mat) item.mat.metalness = 0.035;
        } else {
          item.mat.color.copy(item.original.color);
          item.mat.map = item.original.map;
          if (item.original.roughness !== undefined) item.mat.roughness = item.original.roughness;
          if (item.original.metalness !== undefined) item.mat.metalness = item.original.metalness;
        }
        item.mat.needsUpdate = true;
      });
      document.querySelector('#original').setAttribute('aria-pressed', 'false');
      document.querySelector('#white').setAttribute('aria-pressed', 'true');
      renderMaterialControls();
    }

    function normalizedClone() {
      const clone = sourceRoot.clone(true);
      const box = new THREE.Box3().setFromObject(clone);
      const center = box.getCenter(new THREE.Vector3());
      clone.position.x -= center.x;
      clone.position.y -= box.min.y;
      clone.position.z -= center.z;
      return clone;
    }

    function clearArrangement() {
      if (!arrangement) return;
      scene.remove(arrangement);
      arrangement = null;
    }

    function fitCamera(mode) {
      if (mode === 'single') {
        camera.position.set(3.25, 2.65, 3.8);
        controls.target.set(0, 1.04, 0);
      } else {
        camera.position.set(5.7, 4.4, 6.7);
        controls.target.set(0, 1.02, 0);
      }
      controls.update();
    }

    function buildArrangement(mode) {
      if (currentModule !== 'straight') mode = 'single';
      viewMode = mode;
      clearArrangement();
      arrangement = new THREE.Group();
      if (mode === 'single') {
        arrangement.add(normalizedClone());
      } else {
        const cols = 2;
        const rows = 3;
        const xStep = 1.43;
        const zStep = 1.62;
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const model = normalizedClone();
            model.position.x += (col - (cols - 1) / 2) * xStep;
            model.position.z += (row - (rows - 1) / 2) * zStep;
            arrangement.add(model);
          }
        }
      }
      scene.add(arrangement);
      document.querySelector('#single').setAttribute('aria-pressed', String(mode === 'single'));
      document.querySelector('#rows').setAttribute('aria-pressed', String(mode === 'rows'));
      document.querySelector('#rows').disabled = currentModule !== 'straight';
      fitCamera(mode);
    }

    async function selectModule(key) {
      currentModule = key;
      status.textContent = '正在加载模型组件…';
      status.style.display = 'block';
      try {
        if (!modelCache.has(key)) {
          const gltf = await loader.loadAsync(MODEL_URLS[key]);
          modelCache.set(key, gltf.scene);
        }
        sourceRoot = modelCache.get(key);
        collectMaterials(sourceRoot);
        buildArrangement(key === 'straight' ? 'rows' : 'single');
        if (selected.size) {
          applyWarmWhite();
          status.style.display = 'none';
        } else {
          document.querySelector('#white').setAttribute('aria-pressed', 'false');
          status.textContent = '模型已加载 · 请在材质列表勾选结构材质';
          status.style.display = 'block';
          setTimeout(() => { status.style.display = 'none'; }, 4200);
        }
        ['straight','end','corner'].forEach((name) => {
          document.querySelector('#' + name).setAttribute('aria-pressed', String(name === key));
        });
      } catch (error) {
        console.error(error);
        status.textContent = '模型加载失败：请检查网络是否能访问 3DAssets CDN';
      }
    }

    document.querySelector('#straight').addEventListener('click', () => selectModule('straight'));
    document.querySelector('#end').addEventListener('click', () => selectModule('end'));
    document.querySelector('#corner').addEventListener('click', () => selectModule('corner'));
    document.querySelector('#single').addEventListener('click', () => buildArrangement('single'));
    document.querySelector('#rows').addEventListener('click', () => buildArrangement('rows'));
    document.querySelector('#original').addEventListener('click', restoreOriginal);
    document.querySelector('#white').addEventListener('click', applyWarmWhite);
    document.querySelector('#reset').addEventListener('click', () => fitCamera(viewMode));

    selectModule('straight');

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f8f2c9" />
<title>手账 · 纸桌</title>
<style id="app-css">
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:#f4f1e8;color:#2b2925;font-family:"Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
#app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.rail{background:#faf8f1;border-right:1px solid #e9e3d4;padding:20px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600;letter-spacing:.6px;margin-bottom:10px}
.logo{display:inline-flex;width:26px;height:26px}
.cat-list{display:flex;flex-direction:column;gap:1px}
.cat{display:flex;align-items:center;gap:8px;padding:7px 28px 7px 8px;border-radius:8px;font-size:13px;background:none;border:0;text-align:left;width:100%;position:relative}
.cat:hover{background:#f2eee2}
.cat.active{background:#ece6d5;font-weight:600}
.cat .dot{width:8px;height:8px;border-radius:50%;flex:none}
.cat .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text}
.cat .nm.editing{background:#fff;outline:1px solid #d8d1bc;border-radius:4px;padding:0 4px;margin:0 -4px}
.cat .n{margin-left:auto;font-size:11px;color:#aaa393;font-variant-numeric:tabular-nums}
.cat .x{opacity:0;font-size:12px;color:#b9b2a1;padding:0 2px;border:0;background:none}
.cat:hover .x{opacity:1}
.cat input{border:0;background:#fff;border-radius:5px;padding:2px 5px;width:100%;font:inherit}
.add-cat{border:1px dashed #d8d1be;background:none;border-radius:8px;padding:6px;color:#9d9686;font-size:12px}
.add-cat:hover{border-color:#c3bba4;color:#6f6a5d}
.stats{display:flex;flex-direction:column;gap:5px;font-size:11px;color:#9a9384;margin-top:18px;letter-spacing:.3px}
.stats b{color:#3c3930;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;margin-left:2px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:14px;align-items:flex-end}
.gear{width:30px;height:30px;border-radius:50%;border:1px solid #e6ddc9;background:#fffdf7;color:#8b8474;
  font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding-bottom:7px;letter-spacing:1px}
.gear:hover{background:#f6efdf;color:#4a4438}
#set{position:fixed;inset:0;z-index:82;display:flex;align-items:center;justify-content:center;background:rgba(40,36,28,.28);backdrop-filter:blur(2px)}
#set[hidden]{display:none}
.set-box{width:290px;background:#fffdf7;border-radius:16px;padding:20px;box-shadow:0 24px 60px -18px rgba(50,38,16,.45);border:1px solid #eae2d0}
.set-t{font-family:"YouYuan","幼圆",sans-serif;font-size:14px;color:#2f2b24;letter-spacing:1px;margin-bottom:14px}
.set-box button{width:100%;font:inherit;font-size:12.5px;padding:10px 12px;border-radius:10px;cursor:pointer;
  border:1px solid #e3dac6;background:#fff;color:#3a352c;margin-bottom:8px}
.set-box button:hover{background:#f7f1e4}
.set-box button.cancel{border-color:transparent;background:transparent;color:#a49b89;margin:2px 0 0}
.ghost{border:1px solid #ddd6c5;background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;color:#5b5750}
.ghost:hover{background:#f7f3e8}
main{min-width:0;padding-bottom:80px}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 22px;background:#f8f2c9;position:sticky;top:0;z-index:6}
.filters{display:flex;gap:6px;overflow:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{border:1px solid #e6dfc0;background:#fffbeb;border-radius:999px;padding:5px 12px;font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:6px;position:relative;transition:background .15s,border-color .15s,color .15s}
.cat-pick{display:none}
.fchip.active{background:#2b2925;border-color:#2b2925;color:#fdfaf0}
.fchip.sub{padding-right:28px;cursor:grab}
.fchip.sub:active{cursor:grabbing}
.fchip .dot{width:7px;height:7px;border-radius:50%}
.fchip .nm{white-space:nowrap}
.fchip .pen{position:absolute;right:7px;top:50%;width:16px;height:18px;margin-top:-9px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:0;line-height:1;opacity:0;transform:translateX(-2px);pointer-events:none;cursor:pointer;transition:opacity .15s,transform .15s,background .15s}
.fchip.sub:hover .pen,.fchip.sub:focus-visible .pen{opacity:.48;transform:none;pointer-events:auto}
.fchip .pen:hover{opacity:1;color:#8a7b52;background:rgba(80,70,45,.08)}
.fchip.active .pen:hover{color:#fff3b9;background:rgba(255,255,255,.10)}
.cat .pen{position:absolute;right:6px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:8px;display:flex;align-items:center;justify-content:center;opacity:0;font-style:normal;font-size:0;line-height:1;cursor:pointer;transform:translateX(-2px);pointer-events:none;transition:opacity .15s,transform .15s,background .15s}
.cat:hover .pen,.cat:focus-visible .pen{opacity:.45;transform:none;pointer-events:auto}
.cat .pen:hover{opacity:1;color:#8a7b52;background:rgba(80,70,45,.08)}
.pen:before{content:"";width:3px;height:3px;border-radius:50%;background:currentColor;box-shadow:-5px 0 currentColor,5px 0 currentColor}
.fchip.dragging{opacity:.42}
.fchip.over-left{box-shadow:-2px 0 0 #9b8955}
.fchip.over-right{box-shadow:2px 0 0 #9b8955}
.fchip .nm.editing{outline:none;border-bottom:1px dashed currentColor}
.fchip.add{padding:5px 9px;color:#a49c86;border-style:dashed;flex:none}
.top-right{margin-left:auto;font-size:12px;color:#7a7460;white-space:nowrap}
.workspace{display:block;padding:26px 22px 6px}
.compose{max-width:600px;margin:0 auto}
.compose .card-host{width:600px;max-width:100%;display:flex;justify-content:center;margin:0 auto}
.compose .card{width:100%;flex:0 0 auto;min-height:400px!important}
.compose .card .txt{min-height:200px}
.compose .card .txt{cursor:text}
.compose .card .txt:focus{outline:none}
.ctools{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px;flex-wrap:wrap}
.im-box{background:#fffdf6;border-radius:16px;padding:18px 18px 12px;width:260px;box-shadow:0 18px 50px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:8px}
.im-title{font-size:13px;color:#8d8676;margin-bottom:2px}
.im-opt{border:1px solid #e6e0cf;background:#fff;border-radius:10px;padding:10px 12px;font-size:14px;color:#3c3930;cursor:pointer;text-align:left;font-family:inherit}
.im-opt:hover{background:#fdfaf0;border-color:#d8cfb6}
.im-opt.danger{color:#b5543f}
.im-cancel{border:0;background:none;color:#9a9384;font-size:13px;padding:8px;cursor:pointer;font-family:inherit}
#itemMenu{position:fixed;inset:0;background:rgba(60,50,30,.18);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:120}
#itemMenu[hidden]{display:none}
#ask{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(40,36,28,.28);backdrop-filter:blur(2px)}
#ask[hidden]{display:none}
.ask-box{width:340px;background:#fffdf7;border-radius:16px;padding:22px 22px 16px;box-shadow:0 24px 60px -18px rgba(50,38,16,.45);border:1px solid #eae2d0}
.ask-t{font-family:"YouYuan","幼圆",sans-serif;font-size:15px;color:#2f2b24;letter-spacing:.5px}
.ask-d{font-size:12px;color:#8d8677;margin-top:8px;line-height:1.7}
.ask-b{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.ask-b button{font:inherit;font-size:12.5px;letter-spacing:.5px;padding:9px 12px;border-radius:10px;cursor:pointer;border:1px solid #e3dac6;background:#fff;color:#3a352c}
.ask-b button:hover{background:#f7f1e4}
.ask-b button.danger{border-color:#e7c9c2;color:#a4453a}
.ask-b button.danger:hover{background:#fbeeec}
.ask-b button.cancel{border-color:transparent;background:transparent;color:#a49b89;padding:5px}
.bnav.off{opacity:.12;pointer-events:none}
.cat.dragging{opacity:.42}
.cat.over-top{box-shadow:inset 0 2px 0 #b7a06a}
.cat.over-bot{box-shadow:inset 0 -2px 0 #b7a06a}
.cat{cursor:grab}
.cat:active{cursor:grabbing}
.cacts{display:flex;gap:10px;justify-content:center;margin-top:12px;align-items:center}
.cacts .done{background:#2b2925;color:#fdfaf0;border:1px solid #2b2925;border-radius:999px;padding:9px 22px;font:inherit;font-size:13px;letter-spacing:1px;cursor:pointer}
.cacts .done:hover{background:#3b3831}
.editor{background:#fffdf7;border:1px solid #eae3d2;border-radius:16px;padding:16px 16px 14px;box-shadow:0 1px 2px rgba(60,50,30,.04)}
.opt{display:flex;align-items:center;gap:10px;margin-top:8px;min-height:24px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #e5decd;background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;color:#5b5750}
.chip.on{background:#eee9d9;border-color:#d9d1bb;color:#2b2925;font-weight:600}
.chip .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
.tagwrap{position:relative}
.tagwrap .hash{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#b6ae9c;font-size:12px;pointer-events:none}
.tags-input{flex:1;border:1px solid #e5decd;border-radius:8px;padding:5px 9px 5px 22px;font:inherit;font-size:12px;background:#fff;outline:0}
.tags-input:focus{border-color:#cfc6ad}
.swatches{display:flex;gap:8px}
.swatch{border:1px solid #e5decd;background:#fff;border-radius:10px;padding:5px;display:block;width:66px;line-height:0}
.swatch.on{border-color:#2b2925;box-shadow:0 0 0 1px #2b2925 inset}
.sw{width:54px;height:36px;border-radius:6px;display:block;position:relative;overflow:hidden}
.sw.memo{background:#fff;box-shadow:inset 0 0 0 1px #ececea;background-image:radial-gradient(circle at 50% 50%,#e2e2de 1px,transparent 1.1px);background-size:6px 6px}
.sw.letter{background:#f7edd9;box-shadow:inset 0 0 0 1px #e3d3b5}
.sw.tape{background:#fff;box-shadow:inset 0 0 0 1px #ecebe4}
.sw.tape:before{content:"";position:absolute;left:-2px;right:-2px;top:4px;height:9px;background:#a9c49b;transform:rotate(-2deg)}
.sw.note{background:#fff;box-shadow:inset 0 0 0 1px #ecebe4;background-image:repeating-linear-gradient(to bottom,transparent 0 5px,#efeadf 5px 6px)}
.actions{display:flex;align-items:center;gap:10px;margin-top:14px}
.primary{border:1px solid #2b2925;background:#2b2925;color:#fdfaf0;border-radius:9px;padding:8px 18px;font-size:13px;letter-spacing:.4px}
.primary:hover{background:#3b382f}
.stage{position:sticky;top:74px;display:flex;flex-direction:column;align-items:center;gap:12px}
.card-host{width:420px;filter:drop-shadow(0 10px 26px rgba(70,58,36,.10))}
.stage-actions{display:flex;gap:8px}
.timeline{max-width:600px;margin:24px auto 44px;padding:10px 0 0;border-top:1px solid #eae4d5}
.day-head{display:flex;align-items:center;gap:10px;margin:26px 0 12px;color:#8d8778;font-size:12px;letter-spacing:1px}
.day-head:before{content:"";width:6px;height:6px;border-radius:50%;background:#cfc8b5}
.day-head:after{content:"";flex:1;height:1px;background:#e7e1d2}
.titem{position:relative;margin-bottom:14px}
.ttime{position:absolute;left:-62px;top:4px;width:48px;text-align:right;font-size:11px;color:#b3ac9b;font-variant-numeric:tabular-nums;letter-spacing:.4px}
.tcard{position:relative;width:100%;max-width:420px}
.tcard .card{cursor:pointer}
.tcard .card{width:100%}
.tcard .card.tape{margin-top:12px}
.card-host .card.tape{margin-top:12px}
.tacts{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .15s;z-index:3}
.tcard:hover .tacts{opacity:1}
.mini{border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.92);border-radius:6px;font-size:11px;padding:3px 7px;color:#4a463d}
.mini:hover{background:#fff}
.empty{color:#b3ac9b;text-align:center;padding:60px 0;font-size:13px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#2b2925;color:#fdfaf0;padding:8px 16px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* —— 月历 —— */
.views{display:flex;align-items:center;gap:6px}
.view-btn{width:29px;height:29px;border-radius:9px;border:1px solid #e7e0c6;background:#fffdf3;color:#8d8672;display:grid;place-items:center;cursor:pointer;padding:0;transition:background .15s,color .15s,border-color .15s}
.view-btn:hover{color:#2b2925;border-color:#d9d1b6}
.view-btn.on{background:#2b2925;border-color:#2b2925;color:#fdfaf0}
.view-btn:hover{color:#2b2925;border-color:#d9d1b6}
.view-btn.on{background:#2b2925;border-color:#2b2925;color:#fdfaf0}
.top-right{display:flex;align-items:center;gap:10px}
.month{max-width:760px;margin:18px auto 44px;padding:0 22px;display:flex;flex-direction:column;gap:26px}
.sheet{position:relative;background:#fffef9;border:1px solid #e7e0cd;border-radius:8px;padding:28px 32px 22px 44px;box-shadow:0 24px 44px -40px rgba(70,55,25,.55)}
.sheet:before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;border-radius:8px 0 0 8px;background:linear-gradient(90deg,#f2ecdb,#fdfaf0);border-right:1px solid #ece5d2}
.sheet-head{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
.sheet-head h2{margin:0;font-family:"Bahnschrift",sans-serif;font-weight:400;font-size:20px;letter-spacing:4px;color:#33302a}
.mp-meta{margin-left:auto;font-family:"Bahnschrift",sans-serif;font-size:10px;letter-spacing:2px;color:#aaa392}
.mp-nav{width:22px;height:22px;border:0;background:none;color:#c3bca8;font-size:16px;line-height:1;cursor:pointer;padding:0}
.mp-nav:hover{color:#3c3930}
.mp-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid #eae4d4;border-left:1px solid #eae4d4}
.mp-grid>.wh,.mp-grid>.mp-cell{border-right:1px solid #eae4d4;border-bottom:1px solid #eae4d4}
.mp-grid>.wh{text-align:center;padding:6px 0;font-family:"Bahnschrift",sans-serif;font-size:10px;letter-spacing:.5px;color:#a9a291;background:#fbf7ec}
.mp-grid>.wh b{font-weight:400;color:#8b8474}
.mp-cell{position:relative;display:block;height:84px;padding:5px 6px;text-align:left;background:none;border-top:0;border-left:0;cursor:default;font:inherit}
.mp-cell.has{cursor:pointer}
.mp-cell.has:hover{background:#fdf9ec}
.mp-cell .dn{font-family:"Bahnschrift",sans-serif;font-size:9px;letter-spacing:.5px;color:#b6af9d}
.mp-cell.today .dn{color:#6f9a7d}
.mp-cell .ani{position:absolute;left:0;right:0;top:20px;line-height:0;text-align:center}
.mp-cell .ani svg{width:54px;height:54px;stroke-width:2}
.mp-cell.dim{background:#fcfaf2}
.sheet-sum{display:flex;align-items:center;gap:24px;margin-top:22px;padding-top:16px;border-top:1px solid #eae4d4}
.sum-badge{flex:none;width:54px;padding:5px 0 6px;text-align:center;background:#dceaf3;border:1px solid #cbdeeb;border-radius:3px;color:#5d8099}
.sum-badge b{display:block;font-family:"Bahnschrift",sans-serif;font-size:9.5px;letter-spacing:1px;font-weight:400;opacity:.8}
.sum-badge span{display:block;font-family:"Bahnschrift",sans-serif;font-size:15px;letter-spacing:.5px}
.sum-body{flex:1}
.sum-cap{font-size:11.5px;color:#8d8778;letter-spacing:.4px}
.sum-nums{display:flex;gap:34px;margin-top:2px;align-items:baseline}
.sum-nums i{font-style:normal;font-family:"Bahnschrift",sans-serif;font-size:24px;color:#33302a;margin-right:5px}
.sum-nums span{font-size:11.5px;color:#8d8778}
.sheet-foot{margin-top:14px;text-align:right;font-family:"Bahnschrift",sans-serif;font-size:9px;letter-spacing:2.4px;color:#cbc4b1}
.notes{background-color:#fffef9;background-image:radial-gradient(#f0e9d7 1.1px,transparent 1.1px);background-size:17px 17px;padding:32px 38px 20px 46px;min-height:460px;display:flex;flex-direction:column}
.notes .sheet-head h2{letter-spacing:.4px;font-size:26px;font-weight:400;color:#3a372f}
.notes-list{flex:1}
.note-row{margin:0 0 17px;padding-left:2px}
.note-row .nd{font-family:"Bahnschrift",sans-serif;font-size:9.5px;letter-spacing:1.2px;color:#b8b0a0;margin-bottom:1px}
.note-row .nt{font-family:"YouYuan","幼圆","Noto Sans SC",sans-serif;font-size:15.5px;line-height:2;color:#403c33;white-space:pre-wrap;word-break:break-word}
.notes-foot{display:flex;align-items:flex-end;justify-content:space-between;text-align:left}
.notes-foot .foot-ani{line-height:0;color:#c3bba6;display:block}
.notes-foot .foot-ani svg{width:26px;height:26px}

/* —— 翻书手账 —— */
.bookwrap{max-width:1060px;margin:14px 0 44px 22px;padding:0 46px}
.book{position:relative;display:flex;perspective:3600px}
.book .cover{position:absolute;inset:-12px -15px -16px;border-radius:16px;background:linear-gradient(160deg,#8d6c4b,#6d5034 62%,#5b422e);box-shadow:0 30px 50px -38px rgba(70,50,20,.75);z-index:0;transition:opacity .22s ease}
.pg{position:relative;width:50%;min-height:620px;background:#fffdf6;padding:24px 26px 18px 34px;box-sizing:border-box;z-index:1}
.pg.left{border-radius:10px 0 0 10px;box-shadow:inset -18px 0 28px -22px rgba(90,70,30,.55)}
.pg.right{border-radius:0 10px 10px 0;padding:24px 34px 18px 34px;display:flex;flex-direction:column;box-shadow:inset 18px 0 28px -22px rgba(90,70,30,.55)}
.pg-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.pg-head h2{margin:0;font-family:"Bahnschrift",sans-serif;font-weight:400;font-size:17px;letter-spacing:3px;color:#33302a}
.pg-meta{margin-left:auto;font-family:"Bahnschrift",sans-serif;font-size:9px;letter-spacing:2px;color:#aaa392}
.book .mp-grid>.wh{font-size:9px;padding:5px 0;letter-spacing:0}
.book .mp-grid>.wh b{font-size:8px}
.book .mp-cell{height:64px;padding:4px 3px}
.book .mp-cell .dn{font-size:8px;letter-spacing:0}
.book .mp-cell .ani{top:15px}
.book .mp-cell .ani svg{width:42px;height:42px;stroke-width:2.4}
.book .note-row{margin-bottom:11px}
.book .note-row .nd{font-size:8.5px;letter-spacing:1px}
.book .note-row .nt{font-size:13px;line-height:1.8}
.book .notes-list{flex:1;overflow:hidden}
.pg-sum{margin-top:12px;padding-top:10px;border-top:1px solid #eee7d4;display:flex;align-items:center;gap:12px;font-size:10px;color:#8d8778;letter-spacing:.3px}
.pg-badge{display:flex;flex-direction:column;align-items:center;width:42px;padding:3px 0 4px;background:#dceaf3;border:1px solid #cbdeeb;border-radius:3px;color:#5d8099;font-family:"Bahnschrift",sans-serif;font-size:8px;line-height:1.25}
.pg-badge i{font-style:normal;font-size:12px}
.pg-nums b{font-family:"Bahnschrift",sans-serif;font-size:15px;font-weight:400;color:#33302a;margin:0 3px 0 5px}
.pg-foot{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:flex-end;font-family:"Bahnschrift",sans-serif;font-size:8px;letter-spacing:2px;color:#c9c2af}
.pg-foot svg{width:22px;height:22px;color:#c3bba6}
.leaf{position:absolute;top:0;height:100%;width:50%;transform-style:preserve-3d;z-index:6;pointer-events:none;will-change:transform;filter:drop-shadow(-10px 6px 18px rgba(70,50,20,.18))}
.leaf[hidden]{display:none}
.leaf{display:none!important}
.leaf.right{right:0;transform-origin:left center}
.leaf.left{left:0;transform-origin:right center}
.leaf-face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;background:#fffdf6;padding:24px 26px 18px 34px;box-sizing:border-box;display:flex;flex-direction:column;box-shadow:0 14px 30px -18px rgba(80,60,25,.45)}
.leaf-face.b{transform:rotateY(180deg)}
.leaf.right .leaf-face.f{border-radius:0 10px 10px 0;box-shadow:inset 18px 0 28px -22px rgba(90,70,30,.35);background-image:linear-gradient(90deg,rgba(120,95,50,.13),rgba(255,253,246,0) 20%)}
.leaf.right .leaf-face.b{border-radius:10px 0 0 10px;box-shadow:inset -18px 0 28px -22px rgba(90,70,30,.35);background:#fffcf2}
.leaf.left .leaf-face.f{border-radius:10px 0 0 10px;box-shadow:inset -18px 0 28px -22px rgba(90,70,30,.35)}
.leaf.left .leaf-face.b{border-radius:0 10px 10px 0;box-shadow:inset 18px 0 28px -22px rgba(90,70,30,.35);background:#fffcf2;background-image:linear-gradient(90deg,rgba(120,95,50,.13),rgba(255,253,246,0) 20%)}
.pg .verso-lines{position:absolute;left:26px;right:26px;top:26px;bottom:26px;display:flex;flex-direction:column;gap:26px;opacity:.5}
.pg .verso-lines i{display:block;height:1px;background:linear-gradient(90deg,rgba(190,178,150,.45),rgba(190,178,150,0))}


/* —— 本子 · 手账汇总 —— */
.shelf{max-width:940px;margin:6px auto 60px;padding:18px 22px 0}
.shelf-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 20px}
.shelf-title{font-size:13px;color:#9b937f;letter-spacing:.6px}
.shelf-modes{display:flex;gap:4px;background:rgba(255,255,255,.6);border:1px solid #eee6d2;border-radius:10px;padding:3px}
.mode-btn{width:28px;height:26px;border:0;background:none;border-radius:7px;color:#a79f8b;display:grid;place-items:center;cursor:pointer;padding:0}
.mode-btn.on{background:#2b2925;color:#fdfaf0}
.shelf-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:46px 26px;justify-items:center}
.shelf-body.list{display:block;max-width:640px;margin:0 auto}
.nb{position:relative;width:196px;cursor:pointer;user-select:none;transition:transform .25s}
.nb:hover{transform:translateY(-4px)}
.nb-cover{position:relative;width:196px;height:266px;border-radius:5px 9px 9px 5px;overflow:hidden;box-shadow:0 16px 26px -18px rgba(80,60,25,.6),0 2px 0 rgba(255,255,255,.6) inset}
.nb-spine{position:absolute;left:0;top:0;bottom:0;width:22px;background:linear-gradient(90deg,#4b3524,#6b4b31 60%,#3f2c1d);border-radius:5px 0 0 5px;box-shadow:1px 0 0 rgba(0,0,0,.25)}
.nb-spine:after{content:'';position:absolute;left:50%;top:12px;bottom:12px;width:1px;background:repeating-linear-gradient(#e9c98a 0 5px,transparent 5px 10px);opacity:.55}
.nb-face{position:absolute;left:22px;right:0;top:0;bottom:0;background-color:hsl(var(--h) 82% 82%);
  background-image:
    repeating-linear-gradient(90deg,rgba(255,255,255,.62) 0 2px,transparent 2px 26px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.62) 0 2px,transparent 2px 26px),
    repeating-linear-gradient(90deg,rgba(214,140,60,.22) 0 1px,transparent 1px 13px),
    repeating-linear-gradient(0deg,rgba(214,140,60,.22) 0 1px,transparent 1px 13px)}
.nb-face:after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.35),transparent 45%,rgba(120,80,20,.10))}
.nb-label{position:absolute;left:calc(50% + 11px);top:34px;transform:translateX(-50%);width:118px;height:56px;border-radius:50%/48%;
  background:#fffdf4;box-shadow:0 1px 2px rgba(80,60,20,.18),0 0 0 1px rgba(120,96,40,.25) inset;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.nb-label b{font:italic 600 13px/1 Georgia,"Times New Roman",serif;color:#3f4a52;letter-spacing:.4px}
.nb-label i{display:block;width:64px;height:1px;background:rgba(90,110,120,.45)}
.nb-label i:last-child{width:42px}
.nb-band{position:absolute;right:0;top:104px;width:34px;height:44px;border-radius:0 8px 8px 0;background:hsl(var(--h) 78% 86%);box-shadow:-1px 1px 3px rgba(80,60,20,.22),0 0 0 1px rgba(255,255,255,.5) inset}
.nb-band b{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff,#e6ddca 65%,#cdc2ab);box-shadow:0 1px 2px rgba(80,60,20,.35)}
.nb-brand{position:absolute;left:0;right:0;bottom:42px;text-align:center;font-size:10px;letter-spacing:3px;color:rgba(90,66,30,.55)}
.nb-pages{position:absolute;left:22px;right:6px;bottom:0;height:12px;background:repeating-linear-gradient(#fffdf6 0 2px,#e7dfcc 2px 3px);border-radius:0 0 9px 0}
.nb-ribbon{position:absolute;left:56px;bottom:0;width:16px;height:22px;background:hsl(var(--h) 62% 62%);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.nb-cap{margin-top:12px;text-align:center;font-size:12.5px;color:#5d5749;letter-spacing:.5px}
.nb-cap span{display:block;margin-top:3px;font-size:11px;color:#a8a08c;letter-spacing:.3px}
.shelf-body.list .nb{display:flex;align-items:center;gap:16px;width:100%;padding:9px 6px;border-bottom:1px solid #ece5d4}
.shelf-body.list .nb-cover{width:54px;height:74px;border-radius:4px 6px 6px 4px;flex:none}
.shelf-body.list .nb-spine{width:8px}
.shelf-body.list .nb-face{left:8px}
.shelf-body.list .nb-label,.shelf-body.list .nb-band,.shelf-body.list .nb-pages,.shelf-body.list .nb-ribbon,.shelf-body.list .nb-brand{display:none}
.shelf-body.list .nb-cap{margin:0;text-align:left;font-size:13px}
.shelf-body.list .nb-cap span{margin-top:2px;font-size:11px}
.shelf-empty{padding:60px 0;text-align:center;color:#b3ab98;font-size:13px}
/* 每月内页（扉页） */
.pg.right{overflow-y:auto;overflow-x:hidden}
.pg.right::-webkit-scrollbar{width:0}
.pg-title{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:10px 0}
.pt-corner{position:absolute;left:2px;top:0;font-family:"Bahnschrift",sans-serif;font-size:8.5px;letter-spacing:3px;color:#bcb4a0}
.pt-num{font-family:Georgia,"Times New Roman",serif;font-size:112px;line-height:.92;font-weight:400;color:#3a352d;letter-spacing:-3px}
.pt-name{font-family:"Bahnschrift",sans-serif;font-size:13px;letter-spacing:7px;color:#6e6757;margin-top:12px;text-transform:uppercase}
.pt-line{width:168px;height:1px;background:rgba(120,100,60,.32);margin:20px 0 14px}
.pt-meta{font-family:"Bahnschrift",sans-serif;font-size:10px;letter-spacing:2.4px;color:#a9a08b}
.pt-scope{margin-top:15px;display:flex;align-items:center;justify-content:center;gap:14px;max-width:300px;color:#766e5d;font-size:13px;letter-spacing:.6px}
.pt-scope span{display:flex;align-items:center;gap:7px;min-width:0}
.pt-scope span em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt-scope i{width:8px;height:8px;border-radius:50%;flex:none}
.pt-toc{margin-top:20px;display:flex;flex-direction:column;gap:7px;min-width:196px;text-align:left}
.toc-r{display:flex;align-items:center;gap:8px;font-size:12px;color:#6f6a5c;letter-spacing:.5px}
.toc-r i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.toc-r b{margin-left:auto;font-weight:400;font-size:11px;color:#b3ab97}
.toc-s{display:flex;align-items:center;gap:8px;padding-left:16px;font-size:11px;color:#9c948320}
.toc-s{color:#9c9483}
.toc-s i{width:6px;height:6px;border-radius:50%;flex:0 0 auto;opacity:.85}
.toc-s b{margin-left:auto;font-weight:400;font-size:10.5px;color:#c0b8a4}
.toc-more{font-size:11px;color:#c0b8a4;padding-left:2px}
.pt-year{position:absolute;left:2px;bottom:0;font-family:"Bahnschrift",sans-serif;font-size:9px;letter-spacing:2.4px;color:#b8b0a0}
.pt-stamp{position:absolute;right:0;bottom:0;width:56px;height:56px;color:rgba(124,92,46,.32)}
.pt-sticker{position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:50%;border:1px dashed rgba(124,92,46,.35);
  display:flex;align-items:center;justify-content:center;font-family:"Bahnschrift",sans-serif;font-size:9px;letter-spacing:1px;color:rgba(124,92,46,.55);transform:rotate(8deg)}

/* 翻开动画：合上的书只有一页宽，封面绕书脊掀开，内页同时翻开 */
.book-open{position:absolute;inset:-12px -15px -16px;z-index:9;perspective:1900px;perspective-origin:50% 46%;pointer-events:none;overflow:visible;border-radius:16px}
.bcover{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;
  transform:rotateY(0deg);will-change:transform}
/* 掀封面：先抬起、快速掠过 90°，末端略过冲再落定 */
.book-open.play .bcover{animation:coverOpen .62s cubic-bezier(.36,.02,.24,1) forwards}
@keyframes coverOpen{
  0%   {transform:rotateY(0deg)     translateZ(0)}
  9%   {transform:rotateY(-11deg)   translateZ(12px)}
  30%  {transform:rotateY(-58deg)   translateZ(18px)}
  46%  {transform:rotateY(-104deg)  translateZ(16px)}
  70%  {transform:rotateY(-158deg)  translateZ(7px)}
  88%  {transform:rotateY(-184deg)  translateZ(0)}
  100% {transform:rotateY(-180deg)  translateZ(0)}
}
/* 合上的书：整本向左挪半页，让封面居中；掀开时滑回双页的位置 */
.book.opening{animation:bookShift .62s cubic-bezier(.36,.02,.24,1) both}
@keyframes bookShift{from{transform:translateX(-25%)}to{transform:translateX(0)}}
/* 左页一开始是合上的（翻到右页上面），随封面一起向左翻开 */
.book.opening #pgL{
  transform-origin:right center;backface-visibility:hidden;will-change:transform;
  box-shadow:-16px 12px 34px rgba(70,50,20,.18),inset -18px 0 28px -22px rgba(90,70,30,.5);
  animation:pageOpen .62s cubic-bezier(.36,.02,.24,1) both}
@keyframes pageOpen{from{transform:rotateY(180deg)}to{transform:rotateY(0deg)}}
/* 封面翻过去后，左半露出封二（米色内衬），左页从它上面翻下来 */
.binside{position:absolute;left:0;top:0;width:50%;height:100%;z-index:0;border-radius:10px 0 0 10px;
  background:linear-gradient(105deg,#f8f0da,#efe3c7 70%,#e6d7b8);opacity:0;pointer-events:none}
.book.opening .binside{animation:binsideIn .62s ease-out both}
@keyframes binsideIn{0%,32%{opacity:0}58%{opacity:.9}100%{opacity:1}}
.binside:before,.binsideb:before{content:"";position:absolute;left:18px;right:18px;bottom:26px;height:42%;border-radius:6px 6px 0 0;
  background:rgba(255,255,255,.24);box-shadow:0 -1px 0 rgba(140,110,70,.14)}
.binside:after,.binsideb:after{content:"碎碎念";position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);
  font:12px/1 "Bahnschrift",sans-serif;letter-spacing:4px;color:rgba(140,110,70,.3)}
/* 合背封：右页（连同背封）绕书脊向左翻，最后落在左半、露出牛皮背封 */
.binsideb{position:absolute;left:50%;top:0;width:50%;height:100%;z-index:0;border-radius:0 10px 10px 0;
  background:linear-gradient(105deg,#f8f0da,#efe3c7 70%,#e6d7b8);opacity:0;pointer-events:none}
.book.closing-back .binsideb{opacity:1}
.bcloseback{position:absolute;left:50%;top:0;width:50%;height:100%;z-index:10;
  transform-origin:left center;transform-style:preserve-3d;pointer-events:none;will-change:transform}
.bcf,.bcb{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;overflow:hidden}
.bcf{background:#fffdf6}
.bcf .pg{position:absolute;inset:0;width:100%;height:100%;min-height:0;padding:24px 26px 18px 34px;background:#fffdf6}
.bcb{transform:rotateY(180deg);background:linear-gradient(150deg,#8a674a,#6f5036 56%,#563d29);
  box-shadow:0 30px 50px -38px rgba(70,50,20,.75)}
.bcb:before{content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:6px 6px}
.bcb .bback-label,.bcb .bback-seal{position:absolute;z-index:1}
.book-open.closing-back .bcloseback{animation:closeBack .62s cubic-bezier(.36,.02,.24,1) both}
@keyframes closeBack{from{transform:rotateY(0deg)}to{transform:rotateY(-180deg)}}
.book.closing-back #pgL{animation:none!important;transform:none!important}
.book.closing-back #pgR{opacity:0!important;transition:none}
.book.closing-back .cover{opacity:0;transition:none}
.book.closing-back .bnav{opacity:0}
/* 翻月：像真的翻一页纸，正面是当前页，背面是目标月 */
.fleaf{position:absolute;top:0;width:50%;height:100%;z-index:7;transform-style:preserve-3d;pointer-events:none;will-change:transform}
.fleaf.next{left:50%;transform-origin:left center}
.fleaf.prev{left:0;transform-origin:right center}
.fleaf .fface{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;border-radius:10px;background:#fffdf6;
  box-shadow:-8px 8px 22px rgba(70,50,20,.16)}
.fleaf .fface.b{transform:rotateY(180deg)}
.fleaf .pg{width:100%;height:100%;min-height:0;box-sizing:border-box}
.fleaf.play.next{animation:leafNext .62s cubic-bezier(.36,.02,.24,1) forwards}
.fleaf.play.prev{animation:leafPrev .62s cubic-bezier(.36,.02,.24,1) forwards}
@keyframes leafNext{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
@keyframes leafPrev{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.book.flipping .bnav{opacity:0}
/* 封面上的明暗：转过 90° 前后被光照差最多 */
.bcover .shade{position:absolute;inset:0;border-radius:0 12px 12px 0;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(74,52,22,.05),rgba(74,52,22,.32) 62%,rgba(74,52,22,.55))}
.book-open.play .bcover .shade{animation:coverShade .62s ease-out forwards}
@keyframes coverShade{0%{opacity:0}18%{opacity:.35}46%{opacity:.75}72%{opacity:.4}100%{opacity:0}}
/* 右页被封面压出的阴影：封面掀开时，页面从右侧露出来 */
.book-open.done{opacity:0;transition:opacity .24s ease}
.bf{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden}
.bf{border-radius:12px;box-shadow:-10px 10px 22px rgba(64,46,18,.28),0 18px 38px -20px rgba(70,50,20,.5);
  background-color:hsl(var(--h) 82% 82%);
  background-image:
    repeating-linear-gradient(90deg,rgba(255,255,255,.66) 0 3px,transparent 3px 34px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.66) 0 3px,transparent 3px 34px),
    repeating-linear-gradient(90deg,rgba(206,132,54,.24) 0 1px,transparent 1px 17px),
    repeating-linear-gradient(0deg,rgba(206,132,54,.24) 0 1px,transparent 1px 17px)}
/* 合上的书右侧露出的书口（内页纸边） */
.bblock{position:absolute;right:-6px;top:14px;bottom:14px;width:8px;border-radius:0 3px 3px 0;
  background:linear-gradient(90deg,#e9dfc9,#fffdf6 38%,#eee4d0);
  background-image:repeating-linear-gradient(0deg,rgba(170,150,112,.28) 0 1px,transparent 1px 4px),
    linear-gradient(90deg,#e9dfc9,#fffdf6 38%,#eee4d0);
  box-shadow:1px 1px 5px rgba(60,42,16,.18);backface-visibility:hidden}
.bcover-spine{position:absolute;left:0;top:0;bottom:0;width:34px;background:linear-gradient(90deg,#4b3524,#6b4b31 62%,#3f2c1d);box-shadow:2px 0 6px -2px rgba(40,26,12,.5)}
.bcover-spine:after{content:'';position:absolute;left:50%;top:22px;bottom:22px;width:1px;background:repeating-linear-gradient(#e9c98a 0 7px,transparent 7px 14px);opacity:.5}
.bcover-label{position:absolute;left:50%;top:58px;transform:translateX(-50%);width:214px;height:96px;border-radius:50%/48%;
  background:#fffdf4;box-shadow:0 2px 6px rgba(80,60,20,.15),0 0 0 1.5px rgba(120,96,40,.22) inset;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.bcover-label b{font:italic 600 24px/1 Georgia,"Times New Roman",serif;color:#3f4a52;letter-spacing:1px}
.bcover-label i{display:block;width:110px;height:1px;background:rgba(90,110,120,.4)}
.bcover-label i:last-child{width:70px}
.bcover-band{position:absolute;right:0;top:42%;width:56px;height:78px;border-radius:0 12px 12px 0;background:hsl(var(--h) 78% 87%);box-shadow:-2px 2px 6px rgba(80,60,20,.22),0 0 0 1.5px rgba(255,255,255,.55) inset}
.bcover-band b{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff,#e8dfcd 62%,#cbbfa6);box-shadow:0 2px 4px rgba(80,60,20,.35)}
.bcover-pages{position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(#fffdf6 0 3px,#e7dfcc 3px 4px)}
/* 封面的背面（封二）：合书时先看到这一面，转到 90° 后才换成正面封面 */
.bb{position:absolute;inset:0;transform:rotateY(180deg);backface-visibility:hidden;overflow:hidden;border-radius:12px;
  background:linear-gradient(115deg,#f8f0da,#efe3c7 68%,#e5d6b7);
  box-shadow:inset 0 0 0 1px rgba(150,122,76,.14)}
.bb .pg{position:absolute;inset:0;width:100%;height:100%;min-height:0;padding:28px 22px 22px;border-radius:12px;background:#fffdf6}
/* 背封内侧 */
.bbi{position:absolute;inset:0;transform:rotateY(180deg);backface-visibility:hidden;overflow:hidden;border-radius:12px;
  background:linear-gradient(115deg,#f3e9d2,#e9dcc0 70%,#dfd0b0);
  box-shadow:inset 0 0 0 1px rgba(130,100,60,.16)}
.bbi .pg{position:absolute;inset:0;width:100%;height:100%;min-height:0;padding:28px 22px 22px;border-radius:12px;background:#fffdf6}
.book .pg.left,.book .pg.right{transition:none}
/* 合上时左页折在右页上面，棕色封板必须让位，不能露出来 */
.book.opening .cover{opacity:0;transition:none}
.book.opening .bnav{opacity:0}

/* —— 封面 / 背封：翻页序列两端的合书停靠点 —— */
.edge-lyr{position:absolute;left:50%;top:0;width:50%;height:100%;z-index:4;display:none;pointer-events:none;transform-origin:left center}
.book.edge .edge-lyr{display:block}
.book.edge .pg,.book.edge .cover{opacity:0}
.book.edge .book-open{display:none}
.book.edge{transform:translateX(-25%)}
.book.edge .bnav.prev{left:calc(50% - 44px)}
/* 背封是「右页向左翻过去」后落在左半，所以合上时整本书向右挪半页，封面才居中 */
.book.edge-back{transform:translateX(25%)}
.book.edge-back .edge-lyr{left:0}
.book.edge-back .bnav.prev{left:-34px}
.book.edge-back .bnav.next{display:none}
.edge-lyr .bcover,.edge-lyr .bback{left:0;width:100%;height:100%;transform:none}
.book-open.closing .bcover,.book-open.closing .bback{animation:coverOpen .62s cubic-bezier(.36,.02,.24,1) reverse both}
.book-open.closing .bcover .shade{animation:none;opacity:0}
.book.closing{animation:bookShift .62s cubic-bezier(.36,.02,.24,1) reverse both}
.book.closing #pgL{transform-origin:right center;backface-visibility:hidden;will-change:transform;
  animation:pageOpen .62s cubic-bezier(.36,.02,.24,1) reverse both;
  box-shadow:-16px 12px 34px rgba(70,50,20,.18),inset -18px 0 28px -22px rgba(90,70,30,.5)}
.book.closing .cover{opacity:0;transition:none}
.book.closing .bnav{opacity:0}
.book.closing-back{animation:bookShiftBack .62s cubic-bezier(.36,.02,.24,1) both}
.book.opening-back{animation:bookShiftBack .62s cubic-bezier(.36,.02,.24,1) reverse both}
@keyframes bookShiftBack{from{transform:translateX(0)}to{transform:translateX(25%)}}
.book-open.play-back .bback{left:0;transform-origin:right center;
  animation:backCoverOpen .62s cubic-bezier(.36,.02,.24,1) both}
.book-open.play-back .bbi{display:none}
@keyframes backCoverOpen{0%{transform:rotateY(0deg)}30%{transform:rotateY(58deg)}70%{transform:rotateY(158deg)}100%{transform:rotateY(180deg)}}

/* 背封：安静的牛皮硬封，左侧露书口，中间一张小标签 */
.bback{position:absolute;left:50%;top:0;width:50%;height:100%;
  transform-origin:left center;transform-style:preserve-3d;transform:rotateY(0deg);will-change:transform}
.bback .bbf{position:absolute;inset:0;overflow:hidden;border-radius:12px;backface-visibility:hidden;
  background:linear-gradient(150deg,#8a674a,#6f5036 56%,#563d29);

<script>
/* The back of today's calendar on the desk (paper-desk.todaymemo.v1, one text per day) and this journal
   (suisuinian.v1) are kept in step: each day's text is a card in the 台历 section. Whichever side changed
   since the last sync wins; a card deleted here is not brought back unless the desk text changes again. */
(function(){
  var MK = 'paper-desk.todaymemo.v1', JK = 'suisuinian.v1', SK = 'paper-desk.memosync.v1';
  var get = function(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } };
  var put = function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
  var memos = get(MK) || {}, sync = get(SK) || {}, j = get(JK);
  if(!j || !Array.isArray(j.cards)) j = { cats: [], cards: [], ui: {}, draft: null };
  if(!Array.isArray(j.cats)) j.cats = [];
  if(!j.cats.some(function(c){ return c.id === 'desk'; })) j.cats.unshift({ id: 'desk', name: '台历', color: '#8aa7c9' });
  if(!j.ui) j.ui = {};
  if(!j.ui.filter || j.ui.filter === 'all') j.ui.filter = 'desk';
  var dayTs = function(k){ var p = k.split('-').map(Number); var t = new Date(p[0], p[1]-1, p[2], 21, 0).getTime(); return Math.min(t, Date.now()); };
  var keys = {};
  Object.keys(memos).forEach(function(k){ keys[k] = 1; });
  j.cards.forEach(function(c){ if(c.desk) keys[c.desk] = 1; });
  Object.keys(keys).forEach(function(k){
    var text = memos[k] || '', last = sync[k], card = null;
    for(var i=0;i<j.cards.length;i++) if(j.cards[i].desk === k){ card = j.cards[i]; break; }
    if(card){
      if(text !== (last||'') ){                       // written on the desk since
        if(text.trim()) card.text = text; else j.cards.splice(j.cards.indexOf(card), 1);
      } else if(card.text !== text){ memos[k] = card.text; }   // written here since
    } else if(text.trim() && last !== text){
      j.cards.push({ id: 'desk-' + k, ts: dayTs(k), cat: 'desk', style: 'letter', tags: ['台历'], text: text, desk: k });
    }
    sync[k] = memos[k] || '';
  });
  put(JK, j); put(MK, memos); put(SK, sync);
  // while this page is open, what is written here goes back to the desk
  function back(){
    var jj = get(JK), mm = get(MK) || {}, ss = get(SK) || {}, changed = false;
    if(!jj || !jj.cards) return;
    jj.cards.forEach(function(c){
      if(!c.desk) return;
      // only what was changed here since the last sync goes back; a newer line from the desk is left alone
      if(c.text !== (ss[c.desk]||'') && (mm[c.desk]||'') !== c.text){ mm[c.desk] = c.text; ss[c.desk] = c.text; changed = true; }
    });
    if(changed){ put(MK, mm); put(SK, ss); }
  }
  setInterval(back, 1200);
  addEventListener('pagehide', back);
  document.addEventListener('visibilitychange', function(){ if(document.hidden) back(); });
})();
</script>
<script>
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };
var KEY = 'suisuinian.v1';
var CAT_COLORS = ['#8fb89a','#e0b26b','#c98f8f','#8aa7c9','#a99ac4','#c4b06b','#7fb3a4','#c99a7f'];
var STYLES = [['memo','点阵纸'],['letter','信纸'],['tape','胶带'],['note','笔记页']];
var WEEK = ['周日','周一','周二','周三','周四','周五','周六'];

/* ---------- 小动物 ---------- */
var ANIMALS = [
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 19 L12.5 9 L21 13"/><path d="M34 19 L35.5 9 L27 13"/><path d="M12 21c0-6 5.2-9.5 12-9.5S36 15 36 21c0 7.2-5.2 12.5-12 12.5S12 28.2 12 21z"/><path d="M18.5 21c1.2 1.5 3 1.5 4.2 0"/><path d="M25.3 21c1.2 1.5 3 1.5 4.2 0"/><path d="M23 26.5h2"/><path d="M24 26.5v2"/></svg>',
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 14c-4.5 1.5-6 9-2.5 14"/><path d="M33.5 14c4.5 1.5 6 9 2.5 14"/><circle cx="24" cy="22" r="10"/><circle cx="20" cy="21" r="1.1" fill="currentColor" stroke="none"/><circle cx="28" cy="21" r="1.1" fill="currentColor" stroke="none"/><ellipse cx="24" cy="27" rx="3.6" ry="2.8"/><path d="M24 29.8v1.8"/></svg>',
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 24c-2.4-1-3.4-3-2.6-5 .7-1.7 2.4-2.2 3.6-1.6"/><path d="M34 24c2.4-1 3.4-3 2.6-5-.7-1.7-2.4-2.2-3.6-1.6"/><path d="M13.5 21c0-4.4 4.6-7 10.5-7s10.5 2.6 10.5 7c0 5.6-4.7 9.5-10.5 9.5S13.5 26.6 13.5 21z"/><path d="M19 21c1 1.3 2.6 1.3 3.6 0"/><path d="M25.4 21c1 1.3 2.6 1.3 3.6 0"/><path d="M23 26h2"/></svg>',
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 40V20"/><path d="M19 20c0-3.8 3-6 7-6 3.4 0 6 1.6 7.4 4"/><path d="M21.5 12.5 22 8"/><path d="M28 11.5 28.6 7"/><circle cx="23" cy="17.5" r="1" fill="currentColor" stroke="none"/><path d="M17 30h-4"/><path d="M17 35h-5"/></svg>'
];
function animalFor(card){
  var h = 0, s = (card.id||'') + (card.text||'');
  for (var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) & 0xffff;
  return ANIMALS[h % ANIMALS.length];
}
var DUCK = '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 26c0-6 4-10 9-10 4 0 7 3 7 7 0 4-3 6-6 6h-4"/><path d="M23 16c0-3 2-5 5-5s5 2 5 5"/><path d="M30 12c2.4 0 4 1 4 2.6 0 1.6-1.6 2.6-4 2.6"/><circle cx="31" cy="10.6" r=".9" fill="currentColor" stroke="none"/><path d="M12 34c4-2 9-2 13 0"/><path d="M16 30c0 3-1 4-3 5"/><path d="M27 30c0 3 1 4 3 5"/></svg>';
var STAMP = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="62" height="62" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="32" cy="32" r="29" stroke-width="1.1" stroke-dasharray="2 3"/><circle cx="32" cy="32" r="23" stroke-width="1.1"/><text x="32" y="17.5" text-anchor="middle" font-size="5.2" letter-spacing="0.4" fill="currentColor" stroke="none" font-family="Bahnschrift, sans-serif">SUISUI</text><g stroke-width="1.2"><path d="M25 34 L24 29.5 L28.6 32"/><path d="M39 34 L40 29.5 L35.4 32"/><path d="M24.5 36c0-3 3-4.8 7.5-4.8s7.5 1.8 7.5 4.8c0 3.6-3.4 6-7.5 6s-7.5-2.4-7.5-6z"/><circle cx="29.5" cy="36" r=".7" fill="currentColor" stroke="none"/><circle cx="34.5" cy="36" r=".7" fill="currentColor" stroke="none"/><path d="M31.2 39.4c.6.6 1.4.6 2 0"/></g><text x="32" y="50.4" text-anchor="middle" font-size="4.6" letter-spacing="0.9" fill="currentColor" stroke="none" font-family="Bahnschrift, sans-serif">POSTAGE</text></svg>';

/* ---------- 数据 ---------- */
function uid(){ return Math.random().toString(36).slice(2,9); }
function seed(){
  var now = Date.now(), H = 3600000, D = 86400000;
  var cats = [
    {id:'c1', name:'灵感', color:'#8fb89a'},
    {id:'c2', name:'项目', color:'#e0b26b'},
    {id:'c3', name:'心情', color:'#c98f8f'},
    {id:'c4', name:'日常', color:'#8aa7c9'}
  ];
  var cards = [
    {id:uid(), ts:now-3*H,      cat:'c1', style:'note',       tags:['示例'],        text:'记录一条想法，之后可以按标签或日期找回来。'},
    {id:uid(), ts:now-26*H,     cat:'c3', style:'letter', tags:[],            text:'今天完成了一件小事，也值得记下来。'},
    {id:uid(), ts:now-1.2*D,    cat:'c4', style:'tape',   tags:['示例'],      text:'先分类，再打标签，让每一条碎碎念都有自己的位置。'},
    {id:uid(), ts:now-2.1*D,    cat:'c2', style:'memo',   tags:['排版'], text:'分类、标签、纸张样式都可以按自己的习惯调整。'}
  ];
  return {cats:cats, cards:cards, ui:{filter:'c1', view:'timeline'}, draft:{cat:'c1', style:'memo', tags:''}};
}
function normalizeSectionFilter(s){
  if(!s.ui) s.ui = {filter:'all'};
  var cats = s.cats || [];
  var valid = false;
  for(var i=0;i<cats.length;i++) if(cats[i].id === s.ui.filter){ valid = true; break; }
  if(s.ui.filter !== 'all' && valid) return false;
  for(var j=0;j<cats.length;j++){
    if(!cats[j].parent){ s.ui.filter = cats[j].id; return true; }
  }
  return false;
}
function repairState(s){
  var changed = false;
  if(!Array.isArray(s.cats)){ s.cats = []; changed = true; }
  if(!Array.isArray(s.cards)){ s.cards = []; changed = true; }
  var ids = {};
  s.cats.forEach(function(c){ if(c && c.id) ids[c.id] = 1; });
  s.cats.forEach(function(c){
    if(c.parent && !ids[c.parent]){ delete c.parent; changed = true; }
    if(c.parent && /^新小节(?:✎|·|…|\.)+$/.test(c.name||'')){
      c.name = '新小节'; changed = true;
    }
  });
  if(normalizeSectionFilter(s)) changed = true;
  if(!s.ui.view){ s.ui.view = 'timeline'; changed = true; }
  if(!s.draft){ s.draft = {cat:s.ui.filter, style:'memo', tags:''}; changed = true; }
  if(!ids[s.draft.cat]){ s.draft.cat = s.ui.filter; changed = true; }
  s.cards.forEach(function(card){
    if(!ids[card.cat]){ card.cat = s.ui.filter; changed = true; }
  });
  return changed;
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var d = JSON.parse(raw);
      if(d && d.cards){
        var repaired = repairState(d);
        if(repaired) localStorage.setItem(KEY, JSON.stringify(d));
        return d;
      }
    }
  }catch(e){}
  return seed();
}
var state = load();
var normalizedFilter = repairState(state);
var persistTimer = null;
function persist(){
  clearTimeout(persistTimer);
  persistTimer = setTimeout(function(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }, 120);
}
if(normalizedFilter) persist();

function esc(s){
  return String(s||'').replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function pad(n){ return n<10 ? '0'+n : ''+n; }
function fmtTime(ts){ var d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDay(ts){ var d=new Date(ts); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function dayKey(ts){ var d=new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function groups(){ return state.cats.filter(function(c){ return !c.parent; }); }
function subsOf(gid){ return state.cats.filter(function(c){ return c.parent === gid; }); }
function catById(id){ for(var i=0;i<state.cats.length;i++) if(state.cats[i].id===id) return state.cats[i]; return null; }
/* 选中的是主分类时，把它的所有小节也算进去 */
function inFilter(catId){
  var f = state.ui.filter;
  if(f === 'all') return true;
  if(catId === f) return true;
  var c = catById(catId);
  return !!(c && c.parent === f);
}
function inGroup(catId, gid){
  if(catId === gid) return true;
  var c = catById(catId);
  return !!(c && c.parent === gid);
}
function activeGroup(){
  var f = state.ui.filter;
  if(f === 'all') return groups()[0] || null;
  var c = catById(f);
  if(!c) return groups()[0] || null;
  return c.parent ? catById(c.parent) : c;
}
function selectCategory(id){
  if(!catById(id)) return;
  if(state.ui.filter === id) return;   /* 已经在这一类里：不重渲染，双击改名才接得住 */
  state.ui.filter = id;
  /* 浏览筛选不能悄悄改变正在编辑的旧卡片分类 */
  if(!state.editId) state.draft.cat = id;
  persist();
  renderAll();
}
function catOf(id){
  for(var i=0;i<state.cats.length;i++) if(state.cats[i].id===id) return state.cats[i];
  return null;
}

/* ---------- 侧栏 / 筛选 ---------- */
function askDeleteCategory(c){
  var doomed = c.parent ? [c.id] : [c.id].concat(subsOf(c.id).map(function(o){ return o.id; }));
  var rest = state.cats.filter(function(o){ return doomed.indexOf(o.id) < 0; });
  var daily = (c.parent ? catById(c.parent) : null) || rest.filter(function(o){ return o.name === '日常'; })[0] || rest[0];
  var n = state.cards.filter(function(k){ return doomed.indexOf(k.cat) >= 0; }).length;
  if(!daily){ toast('至少留一个分类'); return; }
  $('#askTitle').textContent = (c.parent ? '删除小节「' : '删除分类「') + c.name + '」';
  $('#askDesc').textContent = n ? '这个分类下有 '+n+' 张卡片，你要怎么处理？' : '这个分类下没有卡片。';
  $('#askDel').textContent = n ? '连卡片一起删除（'+n+' 张）' : '删除分类';
  $('#askMove').textContent = '卡片移到「'+daily.name+'」';
  $('#askMove').hidden = !n;
  var close = function(){ $('#ask').hidden = true; };
  var finish = function(move){
    var editingDoomed = false;
    if(state.editId){
      state.cards.forEach(function(k){
        if(k.id === state.editId && doomed.indexOf(k.cat) >= 0) editingDoomed = true;
      });
    }
    if(!move){
      state.cards = state.cards.filter(function(k){ return doomed.indexOf(k.cat) < 0; });
    }else{
      state.cards.forEach(function(k){ if(doomed.indexOf(k.cat) >= 0) k.cat = daily.id; });
    }
    state.cats = rest;
    if(doomed.indexOf(state.ui.filter) >= 0) state.ui.filter = daily.parent ? daily.parent : daily.id;
    if(doomed.indexOf(state.draft.cat) >= 0) state.draft.cat = daily.id;
    if(editingDoomed && !move){
      state.editId = null; state.editTs = null;
      state.draft = {cat:daily.id, style:state.draft.style||'memo', tags:'', text:'', img:null};
    }else if(editingDoomed){
      state.draft.cat = daily.id;
    }
    persist(); renderAll(); close();
  };
  $('#askDel').onclick = function(){ finish(false); };
  $('#askMove').onclick = function(){ finish(true); };
  $('#askCancel').onclick = close;
  $('#ask').onclick = function(ev){ if(ev.target === $('#ask')) close(); };
  $('#ask').hidden = false;
}

function startRename(nmEl, cat){
  if(!nmEl || nmEl.getAttribute('contenteditable') === 'true') return;
  nmEl.setAttribute('contenteditable','true');
  nmEl.classList.add('editing');
  nmEl.focus();
  var r = document.createRange(); r.selectNodeContents(nmEl);
  var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  var done = false;
  function commit(){
    if(done) return; done = true;
    var t = (nmEl.textContent || '').trim();
    nmEl.removeAttribute('contenteditable');
    nmEl.classList.remove('editing');
    if(t && t !== cat.name){ cat.name = t; }
    persist(); renderAll();
  }
  nmEl.onblur = commit;
  nmEl.onkeydown = function(ev){
    if(ev.key === 'Enter'){ ev.preventDefault(); commit(); }
    else if(ev.key === 'Escape'){ ev.preventDefault(); done = true; renderAll(); }
  };
}

var dragId = null;
function moveCat(fromId, toId, after){
  var from = -1, to = -1;
  state.cats.forEach(function(o,i){ if(o.id===fromId) from=i; if(o.id===toId) to=i; });
  if(from < 0 || to < 0 || from === to) return;
  var item = state.cats.splice(from,1)[0];
  to = -1;
  state.cats.forEach(function(o,i){ if(o.id===toId) to=i; });
  state.cats.splice(to + (after?1:0), 0, item);
  persist(); renderAll();
}

function renderRail(){
  var list = $('#catList');
  list.innerHTML = '';
  groups().forEach(function(c){
    var n = state.cards.filter(function(k){ return inGroup(k.cat, c.id); }).length;
    var currentGroup = activeGroup();
    var on = !!(currentGroup && currentGroup.id === c.id);
    var row = document.createElement('button');
    row.className = 'cat' + (on?' active':'');
    row.innerHTML = '<i class="dot" style="background:'+c.color+'"></i><span class="nm" data-cid="'+c.id+'">'+esc(c.name)+'</span>'
      + '<span class="n">'+n+'</span><span class="pen" title="管理"></span>';
    row.onclick = function(){ selectCategory(c.id); };
    var pen = row.querySelector('.pen');
    pen.draggable = false;
    pen.onmousedown = function(ev){ ev.stopPropagation(); };
    pen.onclick = function(ev){ ev.stopPropagation(); openItemMenu(c); };
    row.oncontextmenu = function(ev){ ev.preventDefault(); ev.stopPropagation(); openItemMenu(c); };
    var nm = row.querySelector('.nm');
    nm.ondblclick = function(ev){ ev.preventDefault(); ev.stopPropagation(); startRename(nm, c); };
    row.draggable = true;
    row.addEventListener('dragstart', function(ev){
      dragId = c.id;
      row.classList.add('dragging');
      ev.dataTransfer.effectAllowed = 'move';
      try{ ev.dataTransfer.setData('text/plain', c.id); }catch(e){}
    });
    row.addEventListener('dragend', function(){
      dragId = null;
      [].forEach.call(list.children, function(el){ el.classList.remove('dragging','over-top','over-bot'); });
    });
    row.addEventListener('dragover', function(ev){
      var moving = catById(dragId);
      if(!moving || moving.parent || moving.id === c.id) return;
      ev.preventDefault();
      ev.dataTransfer.dropEffect = 'move';
      var r = row.getBoundingClientRect();
      var after = ev.clientY > r.top + r.height/2;
      row.classList.toggle('over-top', !after);
      row.classList.toggle('over-bot', after);
    });
    row.addEventListener('dragleave', function(){ row.classList.remove('over-top','over-bot'); });
    row.addEventListener('drop', function(ev){
      var moving = catById(dragId);
      if(!moving || moving.parent || moving.id === c.id) return;
      ev.preventDefault();
      var r = row.getBoundingClientRect();
      var after = ev.clientY > r.top + r.height/2;
      moveCat(moving.id, c.id, after);
    });
    list.appendChild(row);
  });

}

/* ---------- 写作（卡片即编辑器） ---------- */
var draftTimer = null;
function renderCompose(){
  var host = $('#composeCard');
  host.innerHTML = '';
  var node = cardNode(draftCard());
  host.appendChild(node);
  var txt = node.querySelector('.txt');
  if(txt){
    txt.setAttribute('contenteditable','true');
    txt.setAttribute('spellcheck','false');
    txt.addEventListener('input', onType);
    txt.addEventListener('blur', function(){ commitDraft(false); });
    txt.addEventListener('keydown', function(e){
      if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); donePage(); }
      else if(e.key === 'Escape'){ e.preventDefault(); txt.blur(); }
    });
  }
  if(txt){
    txt.style.outline='none';
    txt.style.cursor='text';
    host.onclick = function(e){
      if(e.target && e.target.closest && e.target.closest('button')) return;
      /* 点在文字上时保持浏览器自己算出的光标位置，只有点卡片空白处才落到末尾 */
      if(txt.contains(e.target)) return;
      txt.focus();
      var sel = window.getSelection();
      if(sel && !String(sel).length){
        var r = document.createRange(); r.selectNodeContents(txt); r.collapse(false);
        sel.removeAllRanges(); sel.addRange(r);
      }
    };
  }
  var sp = $('#stylePick'); sp.innerHTML = '';
  STYLES.forEach(function(st){
    var b = document.createElement('button');
    b.className = 'swatch' + ((state.draft.style||'memo')===st[0]?' on':'');
    b.title = st[1];
    b.innerHTML = '<span class="sw '+st[0]+'"></span>';
    b.onclick = function(){ state.draft.style = st[0]; persist(); renderCompose(); };
    sp.appendChild(b);
  });
}
function onType(){
  state.draft.text = (this.innerText || '').replace(/\u00a0/g, ' ');
  persist();
  clearTimeout(draftTimer);
  draftTimer = setTimeout(function(){ commitDraft(false); }, 700);
}
function draftCard(){
  return {
    id: state.editId || 'draft',
    ts: state.editTs || Date.now(),
    cat: state.draft.cat,
    style: state.draft.style || 'memo',
    tags: (state.draft.tags||'').split(/[,，\s]+/).filter(Boolean),
    text: state.draft.text || '',
    img: state.draft.img || null
  };
}
/* ---------- 时间线 ---------- */
function renderTimeline(){
  var box = $('#timeline');
  box.innerHTML = '';
  var cards = state.cards.slice().sort(function(a,b){ return b.ts - a.ts; });
  if(state.ui.filter !== 'all') cards = cards.filter(function(c){ return inFilter(c.cat); });

  if(!cards.length){
    box.innerHTML = '';
    return;
  }
  var curDay = '';
  cards.forEach(function(card){
    var k = dayKey(card.ts);
    if(k !== curDay){
      curDay = k;
      var h = document.createElement('div');
      h.className = 'day-head';
      h.setAttribute('data-day', k);
      h.textContent = fmtDay(card.ts) + ' · ' + WEEK[new Date(card.ts).getDay()];
      box.appendChild(h);
    }
    var row = document.createElement('div');
    row.className = 'titem';
    row.innerHTML = '<div class="ttime">'+fmtTime(card.ts)+'</div><div class="tcard"></div>';
    var host = row.querySelector('.tcard');
    var cn = cardNode(card, true);
    cn.title = '点开编辑';
    cn.onclick = (function(c){ return function(){ openCard(c); }; })(card);
    host.appendChild(cn);
    var acts = document.createElement('div');
    acts.className = 'tacts';
    acts.innerHTML = '<button class="mini" data-a="edit">编辑</button><button class="mini" data-a="del">删除</button>';
    host.appendChild(acts);
    acts.querySelector('[data-a=edit]').onclick = function(){ editCard(card); };
    acts.querySelector('[data-a=del]').onclick = function(){
      state.cards = state.cards.filter(function(o){ return o.id!==card.id; });
      /* 删掉的正是手上正在写的那张：一起清空编辑态，避免 0.7s 后把字写回一张不存在的卡 */
      if(state.editId === card.id){
        state.editId = null; state.editTs = null;
        state.draft = {cat: card.cat, style: state.draft.style, tags:'', text:'', img:null};
      }
      persist(); renderAll(); toast('已删除');
    };
    box.appendChild(row);
  });
}

function editCard(card){
  state.editId = card.id;
  state.editTs = card.ts;
  state.draft = {cat:card.cat, style:card.style, tags:(card.tags||[]).join(', '), text:card.text, img:card.img||null};
  renderCompose();
  window.scrollTo({top:0, behavior:'smooth'});
}

function commitDraft(publish){
  clearTimeout(draftTimer);
  var text = (state.draft.text||'').trim();
  if(!text) return;
  var now = Date.now();
  if(state.editId){
    var hit = null;
    state.cards.forEach(function(o){ if(o.id===state.editId) hit = o; });
    if(hit){
      hit.text = text; hit.cat = state.draft.cat; hit.style = state.draft.style;
      hit.tags = (state.draft.tags||'').split(/[,，\s]+/).filter(Boolean);
      hit.updatedAt = now;
    }
  }else if(publish){
    var nc = draftCard();
    nc.id = uid(); nc.ts = now; nc.text = text;
    state.cards.push(nc);
    state.editId = nc.id; state.editTs = nc.ts;
  }else{
    persist(); return;
  }
  persist(); renderRail(); renderTimeline(); renderMonth(); renderBook();
}

function openCard(card){
  editCard(card);
  setView('timeline');
  persist();
  window.scrollTo({top:0, behavior:'smooth'});
  setTimeout(function(){
    var t = document.querySelector('#composeCard .txt');
    if(t) t.focus();
  }, 260);
}

function donePage(){
  commitDraft(true);
  state.editId = null; state.editTs = null;
  state.draft = {cat: state.draft.cat, style: state.draft.style, tags:'', text:'', img:null};
  persist();
  setView('timeline');
  renderAll();
  window.scrollTo({top: 0, behavior:'smooth'});
}

function newPage(){
  state.editId = null; state.editTs = null;
  state.draft = {cat: state.draft.cat, style: state.draft.style, tags:'', text:'', img:null};
  persist(); renderCompose();
  var t = document.querySelector('#composeCard .txt');
  if(t) t.focus();
}

/* ---------- 导出图片 ---------- */
function loadImg(src){
  return new Promise(function(res, rej){
    var i = new Image();
    i.onload = function(){ res(i); };
    i.onerror = rej;
    i.src = src;
  });
}
function nodeToCanvas(node, scale){
  scale = scale || 2;
  var m = 14;
  var w = node.offsetWidth, h = node.offsetHeight;
  var W = w + m*2, H = h + m*2;
  var css = document.getElementById('card-css').textContent;
  var clone = node.cloneNode(true);
  clone.style.margin = '0';
  clone.style.flex = 'none';
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'">'
    + '<foreignObject x="0" y="0" width="'+W+'" height="'+H+'">'
    + '<div xmlns="http://www.w3.org/1999/xhtml" style="width:'+W+'px;height:'+H+'px;padding:'+m+'px;box-sizing:border-box;background:transparent">'
    + '<style>'+css+'</style>'+clone.outerHTML+'</div>'
    + '</foreignObject></svg>';
  var url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  return loadImg(url).then(function(img){
    var c = document.createElement('canvas');
    c.width = Math.round(W*scale); c.height = Math.round(H*scale);
    var ctx = c.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, W, H);
    return c;
  });
}
function canvasBlob(canvas){
  return new Promise(function(res){ canvas.toBlob(res, 'image/png'); });
}
function fileName(){
  var d = new Date(), c = draftCard();
  return '碎碎念-' + d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+'.png';
}
function exportPNG(){
  var node = $('#composeCard .card');
  if(!node) return;
  nodeToCanvas(node, 2).then(canvasBlob).then(function(blob){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName();
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    toast('已导出 840px 图片');
  }).catch(function(e){ toast('导出失败：'+e.message); });
}
function copyPNG(){
  var node = $('#composeCard .card');
  if(!node) return;
  nodeToCanvas(node, 2).then(canvasBlob).then(function(blob){
    if(!navigator.clipboard || !window.ClipboardItem) throw new Error('浏览器不支持');
    return navigator.clipboard.write([new ClipboardItem({'image/png': blob})]).then(function(){ toast('已复制到剪贴板'); });
  }).catch(function(e){
    toast('复制不了，改用「导出图片」');
  });
}

function bookMonths(){
  /* 月份是最外层容器，不因章节/小节筛选而消失 */

}
/* a library bookcase filling the wall: every month you wrote in is a book on it, this year's on the
   middle shelf; the rest of the wall is lined with other books, a few leaning, a few lying flat */
var CLOTH = ['#3e5468','#7a5a52','#5f7768','#8a7a58','#62607a','#4f6c70','#8b6d68','#5b6b55','#6e5c50','#48606f','#857254','#6a6278'];
var FILL = ['#c9c2b4','#b9c2c9','#a8b3ab','#cdbfa8','#9aa6ae','#b7aa9a','#d6cfc2','#8f9aa3','#c2b6a6','#aab4a2'];
var CN_M = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];
function rnd(seed){ var t = seed + 0x6D2B79F5; return function(){ t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); t = ((t ^ t >>> 14) >>> 0); t = Math.imul(t ^ t >>> 16, 2246822507) >>> 0; return t / 4294967296; }; }
function fillerRun(r, w){
  var h = '', used = 0;
  while(used < w - 18){
    var k = r();
    if(k < .07 && w - used > 120){          // a few books lying flat
      var n = 2 + Math.floor(r()*3), sw = 0, st = '';
      for(var i=0;i<n;i++){ var bw = 84 + Math.floor(r()*30); sw = Math.max(sw, bw);
        st = '<i class="lay" style="width:'+bw+'px;height:'+(12+Math.floor(r()*6))+'px;background:'+FILL[Math.floor(r()*FILL.length)]+';margin-left:'+Math.floor(r()*8)+'px"></i>' + st; }
      h += '<span class="stack">'+st+'</span>'; used += sw + 10; continue;
    }
    if(k < .11){ h += '<span class="bend"></span>'; used += 16; continue; }
    var bw2 = 14 + Math.floor(r()*16), bh = 62 + Math.floor(r()*30), lean = r() < .06 ? (r() < .5 ? -7 : 7) : 0;
    h += '<i class="fb'+(r()<.3?' banded':'')+'" style="width:'+bw2+'px;height:'+bh+'%;background:'+FILL[Math.floor(r()*FILL.length)]+(lean?';transform:rotate('+lean+'deg);margin:0 '+(Math.abs(lean)*2)+'px':'')+'"></i>';
    used += bw2 + 2 + (lean ? Math.abs(lean)*4 : 0);
  }
  return h;
}
function monthBook(key, now){
  var y = key.slice(0,4), m = parseInt(key.slice(5,7),10), n = allMonthNotes(key).length;
  var w = 30 + Math.min(18, n * 1.6), hh = 78 + (m * 37 % 13);
  return '<button class="mb'+(n?'':' quiet')+(now?' now':'')+'" data-key="'+key+'" title="'+y+' 年 '+m+' 月 · '+n+' 条" style="--c:'+CLOTH[(m-1)%12]+';width:'+w+'px;height:'+hh+'%">'
    + '<i class="hb"></i><span class="lb">'+CN_M[m-1].split('').map(function(c){ return '<b>'+c+'</b>'; }).join('')+'<b>月</b></span><em>'+y+'</em><i class="hb lo"></i></button>';
}
function renderShelf(){
  var body = $('#shelfBody');
  if(!body) return;
  var mode = state.ui.shelf || 'grid';
  var months = bookMonths();
  var mb = document.querySelectorAll('.shelf-modes .mode-btn');
  for(var j=0;j<mb.length;j++){
    mb[j].classList.toggle('on', mb[j].getAttribute('data-mode') === mode);
    mb[j].innerHTML = mb[j].getAttribute('data-mode') === 'grid' ? ICON_GRID : ICON_ROWS;
  }
  if(mode === 'list'){
    body.className = 'shelf-body list';
    body.innerHTML = months.map(function(k){ return nbHTML(k, true); }).join('');
  } else {
    body.className = 'shelf-body case';
    var thisY = String(new Date().getFullYear()), nowKey = monthKeyOf(new Date());
    var years = {};
    months.forEach(function(k){ (years[k.slice(0,4)] = years[k.slice(0,4)] || []).push(k); });
    var ys = Object.keys(years).sort().reverse();       // this year first
    var rows = Math.max(5, ys.length + 3), mid = Math.floor((rows - 1) / 2);
    // this year on the middle shelf, earlier years on the shelves below it, then above
    var place = {}; place[mid] = ys[0];
    var below = mid + 1, above = mid - 1;
    for(var i=1;i<ys.length;i++){ if(below < rows) place[below++] = ys[i]; else place[above--] = ys[i]; }
    var W = Math.min(980, Math.max(560, body.clientWidth || 900)) - 40, h = '';
    for(var r=0;r<rows;r++){
      var R = rnd(r * 977 + 13), mine = place[r] ? years[place[r]].slice().sort() : [];
      var books = mine.map(function(k){ return monthBook(k, k === nowKey); }).join('');
      var mineW = mine.reduce(function(s,k){ return s + 32 + Math.min(18, allMonthNotes(k).length * 1.6); }, 0);
      var left = mine.length ? Math.floor((W - mineW) * (.18 + R() * .3)) : W;
      h += '<div class="shelfrow'+(mine.length?' has':'')+'">'
        + (mine.length ? '<span class="yr">'+place[r]+'</span>' : '')
        + fillerRun(R, left) + (mine.length ? '<span class="bend"></span>' + books + '<span class="bend"></span>' + fillerRun(R, W - left - mineW - 40) : '')
        + '</div>';
    }
    body.innerHTML = h;
  }
  var bs = body.querySelectorAll('.mb, .nb');
  for(var i2=0;i2<bs.length;i2++){
    bs[i2].onclick = (function(key){ return function(){ openBookMonth(key); }; })(bs[i2].getAttribute('data-key'));
  }
}

function playOpenBook(key, side){
  var ov = $('#bookOpen'), bk = document.querySelector('.book');
  if(!ov || !bk || openingBook) return;
  openingBook = true;
  var back = side === 'back';
  ov.innerHTML = back ? bookBackHTML(key) : bookCoverHTML(key);
  ov.hidden = false;
  ov.className = 'book-open';
  bk.classList.add(back ? 'opening-back' : 'opening');
  /* 先换成目标月双页；封面在同一帧盖住，掀开时下面已经是目标页 */
  state.ui.bookEdge = null;
  state.ui.month = key;
  renderBook(); renderMonth(); renderShelf();
  persist();
  void ov.offsetWidth;
  ov.classList.add(back ? 'play-back' : 'play');
  /* 封面和左页一起翻 0.62s；640ms 直接收起覆盖层，让下面的完整双页出现，棕色封板再淡回来。
     不要在 640ms 后还留着封二/内衬遮住左页，否则会看到「翻页过程中左页是空白米色」。 */
  setTimeout(function(){
    bk.classList.remove('opening','opening-back');
    ov.hidden = true; ov.className = 'book-open'; ov.innerHTML = '';
    openingBook = false;
  }, 640);
}
function closeBook(side){
  if(flipping || openingBook) return;

  if(!list.length) return;
  var key = side === 'back' ? list[list.length-1] : list[0];
  if(window.matchMedia('(max-width:760px)').matches){
    state.ui.bookEdge = side; state.ui.month = key; persist();
    renderBook(); renderMonth(); renderShelf();
    return;
  }
  var ov = $('#bookOpen'), bk = document.querySelector('.book');
  if(!ov || !bk) return;
  flipping = true;
  if(side === 'back'){
    /* 背封：右页连同背封绕书脊向左翻过去，最后落在左半，露出牛皮背封 */
    ov.innerHTML = backCloseHTML(key);
    ov.hidden = false;
    ov.className = 'book-open closing closing-back';
    bk.classList.add('closing','closing-back');
    void ov.offsetWidth;

    ov.innerHTML = bookCoverHTML(key);
    ov.hidden = false;
    ov.className = 'book-open';
    bk.classList.add('closing');
    void ov.offsetWidth;
    ov.classList.add('closing');
  }
  setTimeout(function(){
    bk.classList.remove('closing','closing-back');
    state.ui.bookEdge = side;
    state.ui.month = key;
    persist();
    renderBook(); renderMonth(); renderShelf();
    ov.hidden = true; ov.className = 'book-open'; ov.innerHTML = '';
    flipping = false;
  }, 640);
}

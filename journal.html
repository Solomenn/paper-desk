}

function titlePageHTML(key){
  var m = parseInt(key.slice(5,7),10), y = key.slice(0,4);
  var list = monthNotes(key);
  var days = {};
  list.forEach(function(c){ var d = new Date(c.ts); days[new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()] = 1; });
  var nd = Object.keys(days).length;
  return '<div class="pg-title">'
    + '<div class="pt-corner">'+MONTH_EN[m-1]+' '+y+'</div>'
    + '<div class="pt-sticker">'+m+'</div>'
    + '<div class="pt-num">'+pad(m)+'</div>'
    + '<div class="pt-name">My '+MONTH_EN[m-1]+'</div>'
    + '<div class="pt-line"></div>'
    + '<div class="pt-meta">'+list.length+' 条记录 · '+nd+' 天</div>'
    + scopeHTML()
    + '<div class="pt-year">'+y+'</div>'
    + '<div class="pt-stamp">'+STAMP+'</div>'
    + '</div>';
}

function blankPageHTML(){
  return '<div class="verso-lines"><i></i><i></i><i></i></div>';
}
function renderBook(){
  if(!state.ui.month) state.ui.month = monthKeyOf(new Date());
  var key = state.ui.month, list = bookKeys();
  var edge = state.ui.bookEdge || null;
  var bk = document.querySelector('.book'), lyr = $('#edgeLyr');
  var _prev = $('#bkPrev'), _next = $('#bkNext');
  if(bk){ bk.classList.toggle('edge', !!edge); bk.classList.toggle('edge-back', edge === 'back'); }
  if(edge){
    if(edge === 'cover'){
      key = list[0] || key;
      state.ui.month = key;
      if(lyr) lyr.innerHTML = bookCoverHTML(key);
    }else{
      key = list[list.length-1] || key;
      state.ui.month = key;
      if(lyr) lyr.innerHTML = bookBackHTML(key);
    }
    if(_prev){ _prev.classList.toggle('off', edge === 'cover'); _prev.title = edge === 'back' ? '打开上一月' : '合上的封面'; }
    if(_next){ _next.classList.toggle('off', edge === 'back'); _next.title = edge === 'cover' ? '打开下一月' : '合上的背封'; }
    return;
  }
  if(lyr) lyr.innerHTML = '';
  var _i = list.indexOf(key);
  /* 首月左箭头、末月右箭头不再置灰：再翻一次就是合上封面/背封 */
  if(_prev){ _prev.classList.remove('off'); _prev.title = _i <= 0 ? '合上封面' : '上个月'; }
  if(_next){ _next.classList.remove('off'); _next.title = _i >= list.length - 1 ? '合上背封' : '下个月'; }
  $('#pgL').innerHTML = titlePageHTML(key);
  $('#pgR').innerHTML = notesPageHTML(key, 'all');
}

var flipping = false;
var openingBook = false;
function bookKeys(){
  var set = {};
  state.cards.forEach(function(c){ set[monthKeyOf(new Date(c.ts))] = 1; });
  set[monthKeyOf(new Date())] = 1;
  if(state.ui.month) set[state.ui.month] = 1;
  return Object.keys(set).sort();
}

function flipBook(dir){
  if(flipping || openingBook) return;
  var edge = state.ui.bookEdge;
  if(edge){
    if(edge === 'cover' && dir > 0) return openFromEdge('cover');
    if(edge === 'back' && dir < 0) return openFromEdge('back');
    return;
  }
  var list = bookKeys();
  var i = list.indexOf(state.ui.month);
  if(i < 0) return;
  if(dir < 0 && i === 0) return closeBook('cover');
  if(dir > 0 && i === list.length - 1) return closeBook('back');
  var target = list[i + dir];
  if(!target) return;
  if(window.matchMedia('(max-width:760px)').matches){
    state.ui.month = target;
    renderBook(); renderMonth(); renderShelf(); persist();
    return;
  }
  flipping = true;
  var bk = document.querySelector('.book');
  var leaf = document.createElement('div');
  leaf.className = 'fleaf ' + (dir > 0 ? 'next' : 'prev');
  function wrap(cls, html){ return '<div class="pg '+cls+'">'+html+'</div>'; }
  if(dir > 0){
    /* 向右翻：当前右页（当月笔记）向左翻过去，背面是目标月扉页 */
    leaf.innerHTML = '<div class="fface f">'+wrap('right', $('#pgR').innerHTML)+'</div>'
      + '<div class="fface b">'+wrap('left', titlePageHTML(target))+'</div>';
    $('#pgR').innerHTML = notesPageHTML(target, 'all');
  }else{
    /* 向左翻：当前左页（当月扉页）向右翻过去，背面是目标月笔记 */
    leaf.innerHTML = '<div class="fface f">'+wrap('left', $('#pgL').innerHTML)+'</div>'
      + '<div class="fface b">'+wrap('right', notesPageHTML(target, 'all'))+'</div>';
    $('#pgL').innerHTML = titlePageHTML(target);
  }
  bk.appendChild(leaf);
  bk.classList.add('flipping');
  void leaf.offsetWidth;
  leaf.classList.add('play');
  setTimeout(function(){
    state.ui.month = target;
    renderBook(); renderMonth(); renderShelf(); persist();
    leaf.remove();
    bk.classList.remove('flipping');
    flipping = false;
  }, 640);
}

function setView(v){
  state.ui.view = v;
  $('#timelineWrap').hidden = (v !== 'timeline');
  $('#monthWrap').hidden = (v !== 'month');
  $('#bookWrap').hidden = (v !== 'book');
  $('#shelfWrap').hidden = (v !== 'shelf');
  var wp = document.querySelector('.workspace');
  if(wp) wp.hidden = (v !== 'timeline');
  var tabs = document.querySelectorAll('.views .view-btn');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('on', tabs[i].getAttribute('data-view') === v);
  if(v === 'book') renderBook();
}

function openDay(key){
  setView('timeline');
  var head = document.querySelector('.day-head[data-day="'+key+'"]');
  if(head) head.scrollIntoView({block:'center', behavior:'smooth'});
}

function shiftMonth(n){
  var now = new Date();
  if(!state.ui.month) state.ui.month = monthKeyOf(now);
  var y = parseInt(state.ui.month.slice(0,4),10), m = parseInt(state.ui.month.slice(5,7),10)-1;
  state.ui.month = monthKeyOf(new Date(y, m+n, 1));
  renderMonth();
}

function renderAll(){ renderRail(); renderFilters(); renderCompose(); renderTimeline(); renderMonth(); renderBook(); renderShelf(); setView(state.ui.view || 'timeline'); }

var ICONS = {timeline: ICON_PEN, month: ICON_CAL, book: ICON_BOOK, shelf: ICON_SHELF};
(function(){ var bs = document.querySelectorAll('.views .view-btn');
  for(var i=0;i<bs.length;i++) bs[i].innerHTML = ICONS[bs[i].getAttribute('data-view')] || '';
})();
var vtabs = document.querySelectorAll('.views .view-btn');
for(var vi=0; vi<vtabs.length; vi++){
  vtabs[vi].onclick = function(){
    var to = this.getAttribute('data-view');
    if(state.ui.view === to) return;
    setView(to);
    persist();
    if(to === 'timeline'){ window.scrollTo({top:0, behavior:'smooth'}); return; }
    var el = (to === 'month') ? $('#monthWrap') : (to === 'shelf' ? $('#shelfWrap') : $('#bookWrap'));
    if(to === 'book'){
      var edge = state.ui.bookEdge;
      renderBook(); renderMonth();
      if(edge) playOpenBook(state.ui.month, edge);
      else playOpenBook(state.ui.month);
    }
    if(to === 'month'){
      renderMonth();
    }
    var y = el.getBoundingClientRect().top + window.pageYOffset - 64;
    window.scrollTo({top: Math.max(0,y), behavior:'auto'});
  };
}
(function(){
  var mb = document.querySelectorAll('.shelf-modes .mode-btn');
  for(var i=0;i<mb.length;i++){
    mb[i].onclick = function(){
      state.ui.shelf = this.getAttribute('data-mode');
      persist(); renderShelf();
    };
  }
})();
if(location.hash === '#shelf') state.ui.view = 'shelf';
window.addEventListener('resize', function(){ if(state.ui.view === 'shelf') renderShelf(); });
$('#mpPrev').onclick = function(){ shiftMonth(-1); persist(); };
$('#mpNext').onclick = function(){ shiftMonth(1); persist(); };

$('#bkPrev').onclick = function(){ flipBook(-1); };
$('#bkNext').onclick = function(){ flipBook(1); };
document.addEventListener('keydown', function(e){
  if(state.ui.view !== 'book' || flipping) return;
  var tg = e.target;
  if(tg && /^(INPUT|TEXTAREA)$/.test(tg.tagName)) return;
  if(e.key === 'ArrowLeft'){ e.preventDefault(); flipBook(-1); }
  if(e.key === 'ArrowRight'){ e.preventDefault(); flipBook(1); }
});

/* ---------- 事件 ---------- */
$('#doneBtn').onclick = donePage;

function addCategory(){
  var color = CAT_COLORS[groups().length % CAT_COLORS.length];
  var c = {id: uid(), name: '新分类', color: color};
  state.cats.push(c);
  state.ui.filter = c.id;
  state.draft.cat = c.id;
  persist(); renderAll();
  var nm = document.querySelector('#catList .cat:last-child .nm');
  if(nm) setTimeout(function(){ startRename(nm, c); }, 0);
}

function shadeColor(hex, i){
  var r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  var mx = Math.max(r,g,b), mn = Math.min(r,g,b), h, s, l = (mx+mn)/2;
  if(mx === mn){ h = 0; s = 0; }
  else{
    var d = mx-mn;
    s = l > .5 ? d/(2-mx-mn) : d/(mx+mn);
    if(mx === r) h = (g-b)/d + (g<b?6:0);
    else if(mx === g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60;
  }
  h = (h + (i+1) * 16) % 360;
  l = Math.max(.42, Math.min(.72, l - .04 + (i%3)*.05));
  var c = (1-Math.abs(2*l-1))*s, x = c*(1-Math.abs((h/60)%2-1)), m = l-c/2, rr, gg, bb;
  if(h<60){ rr=c; gg=x; bb=0; } else if(h<120){ rr=x; gg=c; bb=0; }
  else if(h<180){ rr=0; gg=c; bb=x; } else if(h<240){ rr=0; gg=x; bb=c; }
  else if(h<300){ rr=x; gg=0; bb=c; } else { rr=c; gg=0; bb=x; }
  var to = function(v){ var n = Math.round((v+m)*255); return ('0'+n.toString(16)).slice(-2); };
  return '#' + to(rr) + to(gg) + to(bb);
}

function addSubCategory(g){
  var n = subsOf(g.id).length;
  var c = {id: uid(), name: '新小节', color: shadeColor(g.color, n), parent: g.id};
  state.cats.push(c);
  state.ui.filter = c.id;
  state.draft.cat = c.id;
  persist(); renderAll();
  var chips = document.querySelectorAll('#filters .fchip');
  var last = chips[chips.length-2];
  var nm = last && last.querySelector('.nm');
  if(nm) setTimeout(function(){ startRename(nm, c); }, 0);
}
$('#addCat').onclick = addCategory;
var menuCat = null;
function openItemMenu(c){
  menuCat = c;
  $('#imTitle').textContent = (c.parent ? '小节「' : '章节「') + c.name + '」';
  $('#itemMenu').hidden = false;
}
$('#imRename').onclick = function(){
  $('#itemMenu').hidden = true;
  var c = menuCat; if(!c) return;
  var nm = document.querySelector('[data-cid="'+c.id+'"]');
  if(nm) startRename(nm, c);
};
$('#imDelete').onclick = function(){
  $('#itemMenu').hidden = true;
  if(menuCat) askDeleteCategory(menuCat);
};
$('#imCancel').onclick = function(){ $('#itemMenu').hidden = true; };
$('#itemMenu').onclick = function(ev){ if(ev.target === this) this.hidden = true; };
$('#setBtn').onclick = function(){ $('#set').hidden = false; };
$('#setClose').onclick = function(){ $('#set').hidden = true; };
$('#set').onclick = function(ev){ if(ev.target === $('#set')) $('#set').hidden = true; };
$('#setExport').onclick = function(){ $('#exportJson').click(); };
$('#setImport').onclick = function(){ $('#importJson').click(); };
$('#exportJson').onclick = function(){
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '碎碎念备份-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('备份已下载');
};
$('#importJson').onclick = function(){ $('#fileInput').click(); };
$('#fileInput').onchange = function(e){
  var f = e.target.files[0];
  e.target.value = '';   /* 允许同一个备份文件再次导入 */
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(!d.cards || !d.cats) throw new Error('格式不对');
      state = d; repairState(state);
      persist(); renderAll(); toast('已导入 ' + d.cards.length + ' 张卡片');
    }catch(err){ toast('导入失败：' + err.message); }
  };
  r.readAsText(f);
};
document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); donePage(); }
  else if(e.key === 'Escape'){
    ['#ask','#itemMenu','#set'].forEach(function(s){ var n = $(s); if(n && !n.hidden) n.hidden = true; });
  }
});

/* ---------- 启动 ---------- */
$('#logo').innerHTML = ANIMALS[0];
(function(){
  var q = new URLSearchParams(location.search);
  if(q.get('demo')){
    state.draft.text = q.get('t') || '这是示例卡片，点开卡片就能继续编辑。';
    state.draft.style = q.get('s') || 'memo';
    state.draft.tags = '桌面, 修好了';
  }
})();
if(location.hash === '#month') state.ui.view = 'month';
if(location.hash === '#book') state.ui.view = 'book';
/* 每次启动都从本月开始：手账/月历不会停在上次翻到的月份 */
state.ui.month = monthKeyOf(new Date());
renderAll();

if(location.hash === '#smoke'){
  setTimeout(function(){
    var log = [];
    try{
      $('#addCat').click();
      var newCat = state.cats[state.cats.length-1];
      var nmEl = $('#catList').lastElementChild.querySelector('.nm');
      startRename(nmEl, newCat);
      log.push('edit=' + nmEl.getAttribute('contenteditable'));
      nmEl.textContent = '桌宠';
      nmEl.dispatchEvent(new KeyboardEvent('keydown', {key:'Enter', bubbles:true}));
      log.push('cat=' + newCat.name);
      var txt = document.querySelector('#composeCard .txt');
      txt.innerText = '冒烟测试卡片 SMOKE';
      txt.dispatchEvent(new Event('input', {bubbles:true}));
      var before = state.cards.length;
      commitDraft(true);
      log.push('cards=' + before + '>' + state.cards.length);
      log.push('text=' + (state.cards.some(function(c){ return c.text.indexOf('SMOKE') >= 0; })));
      setTimeout(function(){
        var raw = localStorage.getItem(KEY) || '';
        var ok = raw.indexOf('SMOKE') >= 0 && raw.indexOf('桌宠') >= 0 && newCat.name === '桌宠';
        document.title = 'SMOKE-' + (ok ? 'OK' : 'FAIL') + ' ' + log.join(' ');
      }, 400);
    }catch(e){
      document.title = 'SMOKE-FAIL ' + e.message + ' ' + log.join(' ');
    }
  }, 200);
}

if(location.hash === '#selftest'){
  setTimeout(function(){
    var node = $('#composeCard .card');
    nodeToCanvas(node, 2).then(function(c){
      document.title = 'SELFTEST-OK ' + c.width + 'x' + c.height;
      document.documentElement.style.background = '#fdfbf5';
      document.body.style.margin = '0';
      document.body.innerHTML = '';
      var img = new Image();
      img.src = c.toDataURL('image/png');
      img.style.display = 'block';
      document.body.appendChild(img);
    }).catch(function(e){
      document.title = 'SELFTEST-FAIL ' + e.message;
    });
  }, 250);
}
})();

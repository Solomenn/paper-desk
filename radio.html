<!DOCTYPE html>
<html lang="zh-CN" data-hashira="收音机">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>收音机 · 纸桌</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root {
    --paper:#f3f1eb; --paper2:#e9e6de; --ink:#272a2b; --muted:#777b78;
    --line:rgba(39,42,43,.13); --warm:#c6b89f; --wood:#b89a73;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; }
  body {
    color:var(--ink); background:
      radial-gradient(100% 80% at 50% 18%, rgba(255,255,255,.95), rgba(255,255,255,.25) 58%, transparent 78%),
      linear-gradient(180deg, #f7f6f2, var(--paper));
    font-family:"Noto Sans SC", system-ui, sans-serif; user-select:none;
  }
  body::after {
    content:""; position:fixed; left:8vw; right:8vw; bottom:8vh; height:13vh; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(57,52,44,.12), transparent 68%); filter:blur(18px);
  }
  .top { position:fixed; z-index:20; left:22px; right:22px; top:18px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
  .top > * { pointer-events:auto; }
  .back,.close {
    width:38px; height:38px; border:0; border-radius:50%; background:rgba(255,255,255,.62);
    box-shadow:0 0 0 .5px rgba(39,42,43,.15),0 8px 24px -14px rgba(39,42,43,.4);
    backdrop-filter:blur(10px); color:#5d625f; display:grid; place-items:center; text-decoration:none; cursor:pointer;
  }
  .title { position:absolute; left:50%; transform:translateX(-50%); font:500 12px/1 "Noto Serif SC",serif; letter-spacing:.32em; color:#777b78; }
  #stage { position:fixed; inset:0; }
  #stage canvas { display:block; width:100%; height:100%; touch-action:none; }
  .panel {
    position:fixed; z-index:10; left:50%; bottom:max(24px,env(safe-area-inset-bottom)); transform:translateX(-50%);
    display:flex; align-items:center; gap:16px; padding:10px 14px;
    border-radius:18px; background:rgba(250,249,246,.76);
    box-shadow:0 0 0 .5px rgba(39,42,43,.14),0 18px 40px -24px rgba(39,42,43,.5);
    backdrop-filter:blur(18px) saturate(1.15);
  }
  .power {
    flex:none; width:38px; height:38px; border:0; border-radius:50%; cursor:pointer; color:#686c68;
    background:rgba(255,255,255,.55); box-shadow:inset 0 0 0 1px rgba(39,42,43,.09);
    display:grid; place-items:center;
  }
  .power.on { color:#2f5b46; background:#edf2ec; }
  .station { min-width:170px; }
  .station b { display:block; font:500 14px/1.2 "Noto Serif SC",serif; letter-spacing:.12em; }
  .station small { display:block; margin-top:5px; color:var(--muted); font-size:11px; letter-spacing:.08em; }
  .range { width:126px; accent-color:#646964; }
  .ticks {
    position:fixed; z-index:9; left:50%; bottom:88px; transform:translateX(-50%);
    display:flex; gap:4px; padding:4px;
  }
  .ticks button {
    width:8px; height:8px; padding:0; border:0; border-radius:50%; background:rgba(58,62,59,.2); cursor:pointer;
  }
  .ticks button.on { background:#4f554f; transform:scale(1.15); }
  .hint {
    position:fixed; z-index:8; left:50%; top:calc(50% + min(29vw,280px)); transform:translateX(-50%);
    color:rgba(55,59,56,.45); font-size:11px; letter-spacing:.12em; pointer-events:none; transition:opacity .6s;
  }
  .hint.hide { opacity:0; }
  .credit { position:fixed; z-index:8; right:18px; bottom:18px; font-size:10px; color:rgba(55,59,56,.42); display:none; }
  .credit a { color:inherit; text-decoration:none; } .credit a:hover { text-decoration:underline; }
  body.model-loaded .credit { display:block; }
  body.embed .back { display:none; }
  body:not(.embed) .close { display:none; }
  @media(max-width:640px) {
    .panel { width:calc(100% - 28px); gap:11px; }
    .station { flex:1; min-width:0; }
    .range { width:92px; }
    .hint { top:auto; bottom:138px; white-space:nowrap; }
  }
  @media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="top">
  <a class="back" href="./" title="回到桌子" aria-label="回到桌子">←</a>
  <button class="close" id="close" title="关闭" aria-label="关闭">×</button>
  <div class="title">RADIO</div>
</div>
<main id="stage" aria-label="可旋转的收音机"></main>
<div class="ticks" id="ticks" aria-label="频道"></div>
<div class="panel">
  <button class="power" id="power" title="播放 / 暂停" aria-label="播放 / 暂停">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 3v9"/><path d="M7.4 5.7a8 8 0 1 0 9.2 0"/></svg>
  </button>
  <div class="station"><b id="stationName">雪声</b><small id="stationFreq">88.1 FM</small></div>
  <input class="range" id="volume" type="range" min="0" max="100" value="48" aria-label="音量">
</div>
<div class="hint" id="hint">拖动机身查看 · 拖动右侧圆盘调台</div>
<span class="credit">T3 · <a href="https://sketchfab.com/3d-models/radio-t3-aad3d54384904cfc9b3df8791d254c5c" target="_blank" rel="noreferrer">ludwigangulodi</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noreferrer">CC BY 4.0</a> · Vlak adaptation</span>
<script type="module" src="radio.js?v=3"></script>
</body>
</html>

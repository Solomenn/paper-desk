<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>窗光 · 纸桌实验</title>
<style>
  html, body { margin: 0; height: 100%; background: #e6e9eb; overflow: hidden; }
  canvas { display: block; }
  .tone { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; padding: 6px; border-radius: 999px; background: rgba(255,255,255,.55); backdrop-filter: blur(8px); }
  .tone a { width: 16px; height: 16px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .tone a.on { box-shadow: inset 0 0 0 1px rgba(0,0,0,.12), 0 0 0 2px rgba(40,50,60,.55); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="tone"><a href="#cool" id="tc" style="background:#e3ecef"></a><a href="#warm" id="tw" style="background:#efe8dc"></a></div>
<pre id="err" style="position:fixed;left:16px;top:16px;right:16px;margin:0;font:12px/1.5 ui-monospace,monospace;color:#c0392b;white-space:pre-wrap;display:none;z-index:9"></pre>
<script>
  /* 出错时把原因写在页面上，不静默黑屏 */
  const showErr = m => { const e = document.getElementById("err"); e.style.display = "block"; e.textContent += m + "\n"; };
  addEventListener("error", e => showErr(e.message)); addEventListener("unhandledrejection", e => showErr(String(e.reason)));
</script>
<script type="module">
/* 窗光（无噪点版）
   阳光：窗洞由 LINTEX 原图的光斑沿阳光方向反推（assets/objects/lintex-light-windows.json）；太阳有大小，在太阳圆盘里取 N 个方向，
         每个方向渲染一遍真实阴影，在线性空间里平均，最后统一做色调映射。软边、形状、玻璃板离墙的投影都是投出来的，没有噪点。
   反射光：亮斑把光反射进暗部，离亮斑越远越暗。用亮斑轮廓的模糊分布来表示，强度和范围按原图测得的衰减曲线拟合。 */
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { mergeVertices, toCreasedNormals } from "three/addons/utils/BufferGeometryUtils.js";

const P = Object.fromEntries(new URLSearchParams(location.search));
const num = (k, d) => (P[k] !== undefined ? +P[k] : d);
const deg = Math.PI / 180;
const GOBO = P.gobo_inline ? JSON.parse(P.gobo_inline) : await (await fetch(P.g || "../assets/objects/lintex-light-gobo.json")).json();
const AZ = GOBO.az, EL = GOBO.el, W = GOBO.W;

const SUN = num("sun", 8.97), SKY = num("sky", 2.26), EXP = num("exp", 1.0);
const ANG = num("ang", 0.5), NDIR = num("n", 48);
const BOUNCE = num("bounce", 4.2), BSIG = num("bsig", 0.5);     // 反射光强度、扩散范围（米）
const BOARD = P.board || "#b6d0d2", WALL = P.wall || "#f0f0ee";
const GAP = num("gap", 8) / 1000, AO = num("ao", 0.5);
const WARM = location.hash === "#warm" || P.tone === "warm";
document.getElementById(WARM ? "tw" : "tc").classList.add("on"); addEventListener("hashchange", () => location.reload());
const T = WARM ? { sun: 0xfff0dc, sky: 0xf2efea, ground: 0xe2ddd6 } : { sun: 0xffffff, sky: 0xe8eff3, ground: 0xdfe2e3 };

/* ── 渲染器 ── */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = EXP;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);

/* 镜头：按宽度取景（画面宽度永远是原图的 2.6 m），宽屏裁上下 */
const ASP = innerWidth / innerHeight;
const camera = new THREE.PerspectiveCamera(ASP >= 1 ? 2 * Math.atan(Math.tan(15 * deg) / ASP) / deg : 30, ASP, 0.05, 60);
const YC = 1.5 - 3 * 2.536 / 1140;            // 原图：画面宽 2.536 m（2 m 的板子占 899/1140），板子中心在画面中心上方 3 px
camera.position.set(0, YC, 1.268 / Math.tan(15 * deg)); camera.lookAt(0, YC, 0);

const scene = new THREE.Scene();

/* ── 反射光贴图：亮斑轮廓（墙面坐标）模糊后的分布 ── */
// 后墙上被阳光直射的区域：由窗洞沿阳光方向投到墙上（与阴影同一套几何），在画布里画出来再模糊
const WX0 = -2.2, WX1 = 2.2, WY0 = -0.2, WY1 = 3.6, RES = 200;           // 贴图覆盖的墙面范围（米），每米 200 像素
function bounceTexture() {
  const cw = Math.round((WX1 - WX0) * RES / 4), ch = Math.round((WY1 - WY0) * RES / 4);
  const c = document.createElement("canvas"); c.width = cw; c.height = ch; const g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, cw, ch);
  const ce = Math.cos(EL * deg), se = Math.sin(EL * deg), ca = Math.cos(AZ * deg), sa = Math.sin(AZ * deg);
  const toPx = (x, y) => [(x - WX0) / (WX1 - WX0) * cw, (1 - (y - WY0) / (WY1 - WY0)) * ch];
  g.fillStyle = "#fff";
  for (const h of [...GOBO.holes, ...(GOBO.islands || []).map(i => ({ island: i }))]) {
    if (h.island) { g.fillStyle = "#000"; }                 // 窗洞 (z, y) → 沿阳光落到后墙 (x, y)
    g.beginPath();
    (h.island || h).forEach(([z, y], i) => { const t = z / (ce * sa), X = -W + t * ce * ca, Y = y - t * se; const [px, py] = toPx(X, Y); i ? g.lineTo(px, py) : g.moveTo(px, py); });
    g.closePath(); g.fill();
  }
  g.filter = `blur(${BSIG * RES / 4}px)`; g.drawImage(c, 0, 0); g.filter = "none";
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.NoColorSpace; return tex;
}
const bounce = bounceTexture();

/* ── 墙：细微的拉毛涂料 ── */
function stucco() {
  const c = document.createElement("canvas"); c.width = c.height = 512; const g = c.getContext("2d"), img = g.createImageData(512, 512);
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647; const a = new Float32Array(512 * 512).map(rnd);
  for (let p = 0; p < 2; p++) { const t = a.slice(); for (let y = 0; y < 512; y++) for (let x = 0; x < 512; x++) { let v = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) v += t[((y + dy + 512) % 512) * 512 + ((x + dx + 512) % 512)]; a[y * 512 + x] = v / 9; } }
  for (let i = 0; i < a.length; i++) { const v = Math.max(0, Math.min(255, (a[i] - .5) * 900 + 128)); img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255; }
  g.putImageData(img, 0, 0); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(10, 8); return t;
}
const wallMat = new THREE.MeshStandardMaterial({ color: WALL, roughness: 0.95, bumpMap: stucco(), bumpScale: num("bump", 0.35), lightMap: bounce, lightMapIntensity: BOUNCE });
const wall = new THREE.Mesh(new THREE.PlaneGeometry(WX1 - WX0, WY1 - WY0), wallMat);
wall.position.set((WX0 + WX1) / 2, (WY0 + WY1) / 2, 0); wall.receiveShadow = true; scene.add(wall);

/* ── 左墙：只投影（镜头看不到），窗洞来自反推；按 2 m 间距往远处再复制两组 ── */
{
  const s = new THREE.Shape(); s.moveTo(-3, -5); s.lineTo(GOBO.Z1, -5); s.lineTo(GOBO.Z1, GOBO.Y1); s.lineTo(-3, GOBO.Y1); s.lineTo(-3, -5);   // 墙面比窗洞大一圈，窗洞不能越界
  for (let k = 0; k <= num("rep", 0); k++) for (const h of GOBO.holes) {
    if (Math.max(...h.map(q => q[0])) + k * 2 > GOBO.Z1 - 0.05) continue;
    const p = new THREE.Path(); p.moveTo(h[0][0] + k * 2, h[0][1]); for (const q of h.slice(1)) p.lineTo(q[0] + k * 2, q[1]); p.closePath(); s.holes.push(p);
  }
  const m = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: 0.03, bevelEnabled: false }), new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false }));
  m.rotation.y = -Math.PI / 2; m.position.set(-W, 0, 0); m.castShadow = true; scene.add(m);
  for (const h of GOBO.islands || []) {          // 窗洞里的实心部分（窗棂、横档）
    const q = new THREE.Shape(); q.moveTo(h[0][0], h[0][1]); for (const t of h.slice(1)) q.lineTo(t[0], t[1]); q.closePath();
    const n = new THREE.Mesh(new THREE.ExtrudeGeometry(q, { depth: 0.03, bevelEnabled: false }), m.material);
    n.rotation.y = -Math.PI / 2; n.position.set(-W, 0, 0); n.castShadow = true; scene.add(n);
  }
}

/* ── 光 ── */
const tint = WARM ? new THREE.Color(1, 1, 1) : new THREE.Color(...(P.tint || "0.95,0.99,1.03").split(",").map(Number));   // 天光偏冷：原图暗部带一点青
scene.add(new THREE.HemisphereLight(new THREE.Color(T.sky).multiply(tint), new THREE.Color(T.ground).multiply(tint), SKY));
const sun = new THREE.DirectionalLight(T.sun, SUN);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -2.6, right: 2.6, top: 2.6, bottom: -2.6, near: 1, far: 40 });   // 只罩住画面那块墙：1.3 mm 一格，板子 16 mm 的离墙投影才投得出来
sun.shadow.bias = -0.0001; sun.shadow.normalBias = num("nb", 0.0015);
sun.target.position.set(0, 1.5, 0); scene.add(sun, sun.target);
const sunAt = (az, el) => sun.position.set(-Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az)).multiplyScalar(14).add(sun.target.position);

/* ── 玻璃板：LINTEX Silk Wall 2000×1000，4 mm 哑光玻璃，离墙 12 mm ── */
const glass = new THREE.MeshPhysicalMaterial({ color: BOARD, roughness: num("rough", 0.8), metalness: 0, clearcoat: num("cc", 1), clearcoatRoughness: num("ccr", 0.75), ior: 1.5, lightMap: bounce, lightMapIntensity: BOUNCE });
{
  const gltf = await new GLTFLoader().loadAsync("../assets/objects/silk-wall-2000x1000.glb");
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    let geo = mergeVertices(o.geometry.clone().deleteAttribute("normal"), 1e-5); geo = toCreasedNormals(geo, 35 * deg);
    // 反射光贴图在板子上用墙面坐标取样：uv = 墙面坐标归一化
    const pos = geo.attributes.position, uv = new Float32Array(pos.count * 2);
    for (let i = 0; i < pos.count; i++) { uv[i * 2] = (pos.getX(i) - WX0) / (WX1 - WX0); uv[i * 2 + 1] = (pos.getY(i) + 1.5 - WY0) / (WY1 - WY0); }
    geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
    o.geometry = geo; o.material = glass; o.castShadow = o.receiveShadow = true;
  });
  gltf.scene.position.set(0, 1.5, GAP + 0.004); scene.add(gltf.scene);
}
/* 板子四周的接触阴影：板子贴得近，边缘挡掉一部分天光。强度和宽度按原图板边外侧的亮度剖面量出来：
   右边最重（还能看到玻璃侧边那一道暗线），下边中等，上边很淡，左边没有。贴图 1 px = 1 mm */
{
  const PX = 1000, MW = 30, bw = 2000, bh = 1000, c = document.createElement("canvas"); c.width = bw + MW * 2; c.height = bh + MW * 2;
  const g = c.getContext("2d"), img = g.createImageData(c.width, c.height);
  const side = { r: [0.9, 9], b: [0.6, 5], t: [0.13, 4], l: [0, 1] };
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
    const dx = x - MW, dy = y - MW; let a = 0;
    if (dx >= bw && dy >= -4 && dy < bh + 4) { const d = dx - bw; a = Math.max(a, side.r[0] * Math.exp(-d / side.r[1]), d < 5 ? 0.92 * Math.exp(-(((d - 2) / 2) ** 2)) : 0); }
    if (dy >= bh && dx >= -2 && dx < bw + 4) a = Math.max(a, side.b[0] * Math.exp(-(dy - bh) / side.b[1]));
    if (dy < 0 && dx >= -2 && dx < bw + 2) a = Math.max(a, side.t[0] * Math.exp(-(-dy) / side.t[1]));
    if (dx < 0 && dy >= 0 && dy < bh) a = Math.max(a, side.l[0] * Math.exp(-(-dx) / side.l[1]));
    const i = (y * c.width + x) * 4; img.data[i] = img.data[i + 1] = img.data[i + 2] = Math.round(Math.min(1, a * AO / 0.5) * 255); img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.NoColorSpace; tex.anisotropy = 8;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(c.width / PX, c.height / PX), new THREE.MeshBasicMaterial({ color: 0x0e1418, alphaMap: tex, transparent: true, depthWrite: false, toneMapped: false }));
  m.position.set(0, 1.5, 0.0008); scene.add(m);
}
// 墙面的 UV：PlaneGeometry 自带 0..1，正好对应贴图覆盖的范围

/* ── 累积：每个太阳方向渲染一遍（线性、不做色调映射），平均后再统一做色调映射输出 ── */
const size = renderer.getDrawingBufferSize(new THREE.Vector2());
const rtPass = new THREE.WebGLRenderTarget(size.x, size.y, { type: THREE.HalfFloatType, samples: 4 });
const rtAcc = new THREE.WebGLRenderTarget(size.x, size.y, { type: THREE.HalfFloatType });
const quad = (mat) => { const s = new THREE.Scene(); s.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat)); return s; };
const cam2 = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const addMat = new THREE.ShaderMaterial({ uniforms: { t: { value: rtPass.texture }, w: { value: 1 } }, transparent: true, blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, toneMapped: false,
  vertexShader: "varying vec2 v; void main(){ v = uv; gl_Position = vec4(position.xy, 0., 1.); }",
  fragmentShader: "uniform sampler2D t; uniform float w; varying vec2 v; void main(){ gl_FragColor = vec4(texture2D(t, v).rgb * w, 1.); }" });
const RAW = !!P.raw;   // 调参用：输出线性值 ×0.25（sRGB 编码），不做色调映射
const outMat = new THREE.ShaderMaterial({ uniforms: { t: { value: rtAcc.texture } }, depthTest: false, depthWrite: false, toneMapped: !RAW,
  vertexShader: "varying vec2 v; void main(){ v = uv; gl_Position = vec4(position.xy, 0., 1.); }",
  fragmentShader: `uniform sampler2D t; varying vec2 v; void main(){ gl_FragColor = vec4(texture2D(t, v).rgb * ${RAW ? "0.25" : "1."}, 1.);\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n}` });
const addScene = quad(addMat), outScene = quad(outMat);

renderer.setRenderTarget(rtAcc); renderer.setClearColor(0x000000, 1); renderer.clear(); renderer.setRenderTarget(null);
renderer.setClearColor(WARM ? 0xebe8e3 : 0xe6e9eb, 1);
let i = 0;
function step() {
  const per = 4;                                  // 每帧画几个方向（别让页面卡住）
  for (let k = 0; k < per && i < NDIR; k++, i++) {
    const a = i * 2.39996, r = ANG * deg * Math.sqrt((i + 0.5) / NDIR);
    sunAt(AZ * deg + Math.cos(a) * r, EL * deg + Math.sin(a) * r); sun.shadow.needsUpdate = true;
    renderer.setRenderTarget(rtPass); renderer.render(scene, camera);
    addMat.uniforms.w.value = 1 / NDIR; renderer.autoClear = false; renderer.setRenderTarget(rtAcc); renderer.render(addScene, cam2); renderer.autoClear = true;
  }
  renderer.setRenderTarget(null); renderer.render(outScene, cam2);
  if (i < NDIR) requestAnimationFrame(step); else document.body.dataset.ready = "1";
}
step();
</script>
</body>
</html>

<script type="module">
/* 路径追踪实验：不画影子，让光自己走。
   一个封闭的房间：后墙挂 LINTEX Silk Wall，左墙开拱窗（25 cm 厚），太阳是远处一个有大小的光源，天空从窗户透进来。
   暗部的漫反射、影子的软边、板子离墙的影子，全部由光线追踪算出来。 */
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { mergeVertices, toCreasedNormals } from "three/addons/utils/BufferGeometryUtils.js";
import { WebGLPathTracer, PhysicalSpotLight, GradientEquirectTexture } from "three-gpu-pathtracer";

/* 这一版的参数都已按 LINTEX 原图校准：明度、饱和度、色相、冷暖逐项对齐；窗由原图光斑反推。#warm 切暖调 */
const WARM = location.hash === "#warm";
const P = Object.assign({ gobo: "1", sky: "5.4", sun: "9", ang: "1.2", wall: "#f0f0ee", floor: "#c9c8c4", spp: "3000", tiles: "1" },
  WARM ? { sunc: "#fff0dc", skyTop: "#dde0e2", skyBot: "#efe9e1", wall: "#f1efeb" } : {});
addEventListener("hashchange", () => location.reload());
document.getElementById(WARM ? "tw" : "tc").classList.add("on");
/* ?gobo=1：左墙上的窗洞不靠猜，而是由原图的光斑沿阳光方向反推出来（assets/objects/lintex-light-windows.json） */
const GOBO = {"az":45.0,"el":37.0,"W":1.226,"Z1":9.0,"Y1":4.6,"holes":[[[0.245,1.25],[0.235,1.24],[0.135,1.24],[0.125,1.25],[0.115,1.24],[0.105,1.25],[0.085,1.24],[0.075,1.25],[0.02,1.245],[0.025,0.02],[0.065,0.02],[0.61,0.595],[0.61,1.225],[0.425,1.23],[0.415,1.24],[0.405,1.23],[0.395,1.24],[0.375,1.23],[0.365,1.24],[0.255,1.24],[0.245,1.25]],[[1.445,2.62],[1.345,2.62],[1.265,2.58],[1.13,2.435],[1.09,2.375],[1.06,2.305],[1.06,2.115],[1.04,2.095],[1.045,1.06],[1.54,1.595],[1.54,1.905],[1.53,1.915],[1.53,2.535],[1.52,2.545],[1.52,2.605],[1.455,2.61],[1.445,2.62]],[[0.175,2.62],[0.065,2.62],[0.02,2.585],[0.02,1.445],[0.365,1.44],[0.375,1.43],[0.385,1.44],[0.405,1.43],[0.415,1.44],[0.425,1.43],[0.535,1.43],[0.545,1.42],[0.565,1.43],[0.575,1.42],[0.605,1.42],[0.61,1.635],[0.63,1.655],[0.63,2.155],[0.62,2.165],[0.62,2.185],[0.59,2.235],[0.58,2.275],[0.52,2.365],[0.45,2.435],[0.445,2.45],[0.425,2.44],[0.355,2.51],[0.245,2.57],[0.175,2.62]],[[1.845,2.8],[1.785,2.8],[1.745,2.78],[1.68,2.705],[1.64,2.635],[1.645,1.7],[2.17,2.265],[2.17,2.535],[2.15,2.585],[2.11,2.645],[2.085,2.66],[2.055,2.7],[1.905,2.79],[1.855,2.79],[1.845,2.8]]]};   // 由原图光斑沿阳光方向反推出的窗洞
const num = (k, d) => (P[k] !== undefined ? +P[k] : d);
const deg = Math.PI / 180;

/* ── 从原图量出来的几何（米、度） ── */
const AZ = GOBO ? GOBO.az : num("az", 45), EL = GOBO ? GOBO.el : num("el", 37);      // 太阳：从左前方来；tan(el)/cos(az) ≈ 1.08 是原图的斜拉程度
const W = GOBO ? GOBO.W : num("wx", 2.2);                          // 左墙离板子中心的距离
const WW = num("ww", 1.16), WG = num("wg", 0.45);   // 窗宽、窗间墙垛（投影宽 1.16 m、0.45 m，az=45° 时与实际相等）
const WZ = num("wz", 0.39);                         // 第一扇窗离后墙的距离
const SILL = num("ws", 0.6), TOP = num("wt", 3.8);  // 窗台、拱顶高度
const MUL = num("mul", 0.06), TRANSOM = num("tr", 2.2);
const SUN = num("sun", 9), SKY = num("sky", 1.0), EXP = num("exp", 1.0);
const SUN_ANG = num("ang", 0.7);                    // 太阳的角半径（度），决定影子软边
const SPP = num("spp", 64);
const GAP = num("gap", 12) / 1000;
const BOARD = P.board || "#bfd7db";

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.debug.onShaderError = (gl, program, vs, fs) => showErr("shader compile failed:\n" + (gl.getProgramInfoLog(program) || "") + "\n" + (gl.getShaderInfoLog(fs) || "").slice(0, 1500) + "\nGPU: " + window.__gpu);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = { agx: THREE.AgXToneMapping, neutral: THREE.NeutralToneMapping }[P.tm] ?? THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = EXP;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 60);
camera.position.set(0, 1.5, 1.2985 / Math.tan(15 * deg));
camera.lookAt(0, 1.5, 0);

/* 天空：从窗户看出去的那一片，蓝白渐变 */
const sky = new GradientEquirectTexture();
sky.topColor.set(P.skyTop || 0xbfd3ea); sky.bottomColor.set(P.skyBot || 0xe8ecef); sky.update();
scene.environment = sky; scene.background = new THREE.Color(0x000000);
scene.environmentIntensity = SKY;

/* ── 房间 ── */
const wallMat = new THREE.MeshStandardMaterial({ color: P.wall || 0xe9e9e7, roughness: 0.95 });
const floorMat = new THREE.MeshStandardMaterial({ color: P.floor || 0x9c9b98, roughness: 0.9 });
const X1 = 4.5, Z1 = 9, Y1 = 4.6;
function box(w, h, d, x, y, z, m) { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); scene.add(b); return b; }
box(W + X1 + 0.6, Y1, 0.2, (X1 - W) / 2, Y1 / 2, -0.1, wallMat);                 // 后墙（板子挂在这面）
box(W + X1 + 0.6, 0.2, Z1, (X1 - W) / 2, -0.1, Z1 / 2, floorMat);                 // 地板
box(W + X1 + 0.6, 0.2, Z1, (X1 - W) / 2, Y1 + 0.1, Z1 / 2, wallMat);              // 天花
box(0.2, Y1, Z1, X1 + 0.1, Y1 / 2, Z1 / 2, wallMat);                              // 右墙
box(W + X1 + 0.6, Y1, 0.2, (X1 - W) / 2, Y1 / 2, Z1 + 0.1, wallMat);             // 身后的墙

/* 左墙：25 cm 厚，开四扇拱窗，每扇带中间竖棂和一道横档 */
function windowWall() {
  const s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(Z1, 0); s.lineTo(Z1, Y1); s.lineTo(0, Y1); s.lineTo(0, 0);
  if (GOBO) {
    // 画面里能看到影子的那几扇窗；再按 2.6 m 间距往远处复制成一排（它们的光斑落在画面右边以外，只给屋子添天光和反射光）
    const REP = num("rep", 2), PER = num("per", 2.6);
    for (let k = 0; k <= REP; k++) for (const h of GOBO.holes) {
      if (Math.max(...h.map(q => q[0])) + k * PER > Z1 - 0.05) continue;
      const p = new THREE.Path(); p.moveTo(h[0][0] + k * PER, h[0][1]); for (const q of h.slice(1)) p.lineTo(q[0] + k * PER, q[1]); p.closePath(); s.holes.push(p);
    }
    const g = new THREE.ExtrudeGeometry(s, { depth: 0.03, bevelEnabled: false });   // 薄墙：窗洞形状已经是光斑的形状
    const m = new THREE.Mesh(g, wallMat); m.rotation.y = -Math.PI / 2; m.position.set(-W, 0, 0); scene.add(m);
    return;
  }
  const r = WW / 2, spring = TOP - r;
  for (let k = 0; k < 5; k++) {
    const z0 = WZ + k * (WW + WG); if (z0 + WW > Z1 - 0.2) break;
    const cx = z0 + r, cy = spring;
    const arcY = x => cy + Math.sqrt(Math.max(0, r * r - (x - cx) ** 2));
    // 竖棂左右两半；每半分成横档下面一格、横档上面连着拱的一格（一条完整轮廓，不和别的洞重叠）
    for (const [a, b, left] of [[z0, cx - MUL / 2, true], [cx + MUL / 2, z0 + WW, false]]) {
      const lo = new THREE.Path(); lo.moveTo(a, SILL); lo.lineTo(b, SILL); lo.lineTo(b, TRANSOM - MUL / 2); lo.lineTo(a, TRANSOM - MUL / 2); lo.lineTo(a, SILL); s.holes.push(lo);
      const up = new THREE.Path(), y0 = TRANSOM + MUL / 2;
      if (left) {   // 左半：右边是竖棂，弧从竖棂顶端往左下回到起拱点
        const tb = Math.acos((b - cx) / r);
        up.moveTo(a, y0); up.lineTo(b, y0); up.lineTo(b, arcY(b)); up.absarc(cx, cy, r, tb, Math.PI, false); up.lineTo(a, y0);
      } else {      // 右半：左边是竖棂
        const ta = Math.acos((a - cx) / r);
        up.moveTo(a, y0); up.lineTo(b, y0); up.lineTo(b, cy); up.absarc(cx, cy, r, 0, ta, false); up.lineTo(a, y0);
      }
      s.holes.push(up);
    }
  }
  const g = new THREE.ExtrudeGeometry(s, { depth: num("depth", 0.12), bevelEnabled: false, curveSegments: 32 });   // 墙厚：太厚会把斜射的光挡掉一截
  const m = new THREE.Mesh(g, wallMat);
  m.rotation.y = -Math.PI / 2;            // 形状的 x 轴 → 世界 z 轴（离后墙的距离）
  m.position.set(-W, 0, 0);
  scene.add(m);
}
windowWall();

/* ── 太阳：远处一个有大小的光源 ── */
const dir = new THREE.Vector3(-Math.cos(EL * deg) * Math.cos(AZ * deg), Math.sin(EL * deg), Math.cos(EL * deg) * Math.sin(AZ * deg));
const D = 40;
const sun = new PhysicalSpotLight(P.sunc || 0xffffff, SUN * D * D);
sun.position.copy(dir.clone().multiplyScalar(D)).add(new THREE.Vector3(-W, 2, 2));
sun.target.position.set(-W, 2, 2); scene.add(sun.target);
sun.angle = Math.atan(6 / D); sun.penumbra = 0; sun.decay = 2; sun.distance = 0;
sun.radius = D * Math.tan(SUN_ANG * deg);
scene.add(sun);

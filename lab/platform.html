<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>站台 · 草图 · 纸桌实验</title>
<link rel="stylesheet" href="../fonts.css">
<style>
  /* 雪国线站台草图（2026-11-03，用户："你做出来草图给我看看"）：
     和入口页同一间房、同一束百叶窗光（../room3d.js，真 3D），墙上三样东西都是 3D 物件、都被这束光照着、都往墙上投影：
     · 站名牌（照日本车站的駅名標：中间大字本站名，下面一条蓝莓色的线，左右箭头指着上一站、下一站）——不发光的一块板；
     · 站钟（照瑞士铁路站钟：没有数字，只有刻度线；时针、分针黑色，秒针蓝莓色、头上一个圆片，走 58.5 秒一圈，到 12 停 1.5 秒再走）；
     · 下面一段小站台：一块搁板、两根钢轨、枕木，上面停着入口页那个火车头（yanix「Locomotive」），侧面朝外。
     只是草图：站名、时刻都是写死的，点哪里都不动；秒针真的在走（照现在的时间）。 */
  html, body { margin: 0; height: 100%; background: #e6e9eb; overflow: hidden; user-select: none; -webkit-user-select: none; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #dust { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #film { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  #film::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(20,22,24,.28) 100%); opacity: var(--vig, 0); }
  #film::after { content: ""; position: absolute; inset: -50%; background-image: var(--grain); background-size: 256px 256px; mix-blend-mode: overlay; opacity: var(--gr, 0); transform: translate(var(--gx, 0), var(--gy, 0)); }
  .back { position: fixed; left: 24px; top: 22px; z-index: 8; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; text-decoration: none; color: #8a8a8a;
    background: rgba(248, 249, 247, .9); box-shadow: 0 4px 12px rgba(21, 35, 58, .18); font: 16px sans-serif; }
  .credit { position: fixed; z-index: 8; right: 18px; bottom: 18px; font-size: 10px; color: rgba(55,59,56,.42); font-family: sans-serif; }
  .credit a { color: inherit; text-decoration: none; } .credit a:hover { text-decoration: underline; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"
} }
</script>
</head>
<body>
<a class="back" href="entry.html?at=2" title="回到入口">←</a>
<span class="credit"><a href="https://sketchfab.com/3d-models/locomotive-d89f7d5a37ef43119e7b6c37b41c69cb" target="_blank" rel="noreferrer">Locomotive</a> · yanix ·
  <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noreferrer">CC BY 4.0</a></span>
<canvas id="gl"></canvas>
<canvas id="dust"></canvas>
<div id="film"></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { createRoom3D } from "../room3d.js";

const ACCENT = "#647F98", INK = "#1a1a1a", BOARD = "#f4f4f1";               // 蓝莓（唯一的强调色）、墨、站名牌的白
const SERIF = '"Noto Serif SC", "Source Han Serif SC", "Songti SC", serif', SANS = '"Noto Sans SC", "PingFang SC", sans-serif';
await Promise.all([`700 80px ${SERIF}`, `500 30px ${SANS}`].map(f => document.fonts.load(f, "雪国线白川口雪见霜原站台号车往方向1234567890→←"))).catch(() => {});

const R = await createRoom3D({ canvas: document.getElementById("gl"), base: "../", dust: document.getElementById("dust"), film: document.getElementById("film"), beforeRender: hands });
const { objects, addRefl, YC } = R;
const OFF = 0.012;                                                         // 物件背面离墙 12 mm（同入口页）
const shade = o => o.traverse(m => { if (m.isMesh) { m.castShadow = m.receiveShadow = true; (Array.isArray(m.material) ? m.material : [m.material]).forEach(addRefl); } });
const tex = (w, h, draw, px = 1400) => {                                  // 画一张贴图：w × h（m），长边 px 像素；draw 里的单位是 mm（字号太小的话浏览器画不准，所以不用 m）
  const k = px / Math.max(w, h), c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  const g = c.getContext("2d"); g.scale(c.width / (w * 1000), c.height / (h * 1000)); draw(g, w * 1000, h * 1000); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
};

/* ── 站名牌：1.20 × 0.40 m，厚 2 cm，白色哑光；正面印字（单位 m） ── */
{
  const W = 1.2, H = 0.4, D = 0.02;
  const face = tex(W, H, (g, w, h) => {                                    // 单位 mm：1200 × 400
    g.fillStyle = BOARD; g.fillRect(0, 0, w, h);
    g.fillStyle = INK; g.textAlign = "center"; g.textBaseline = "alphabetic";
    g.font = `700 135px ${SERIF}`; g.fillText("白 川 口", w / 2, 200);              // 本站
    g.fillStyle = "#8a8a8a"; g.font = `500 30px ${SANS}`; g.letterSpacing = "6px"; g.fillText("BAICHUANKOU", w / 2, 250); g.letterSpacing = "0px";
    g.fillStyle = ACCENT; g.fillRect(0, 290, w, 12);                              // 一条蓝莓色的线（JR 的站名牌这里是线路色）
    g.fillStyle = INK; g.font = `500 42px ${SANS}`;
    g.textAlign = "left"; g.fillText("← 雪 见", 60, 357);                        // 上一站
    g.textAlign = "right"; g.fillText("霜 原 →", w - 60, 357);                   // 下一站
    g.textAlign = "left"; g.fillStyle = "#8a8a8a"; g.font = `500 28px ${SANS}`; g.fillText("雪 国 线", 60, 66);
    g.fillStyle = ACCENT; g.beginPath(); g.arc(w - 90, 70, 34, 0, Math.PI * 2); g.fill();   // 站号牌
    g.fillStyle = "#fff"; g.textAlign = "center"; g.font = `600 30px ${SANS}`; g.fillText("01", w - 90, 81);
  });
  const side = new THREE.MeshStandardMaterial({ color: "#dfe0dc", roughness: .8 });
  const front = new THREE.MeshStandardMaterial({ map: face, roughness: .85 });
  const sign = new THREE.Mesh(new THREE.BoxGeometry(W, H, D), [side, side, side, side, front, side]);
  sign.position.set(-0.12, YC + 0.42, OFF + D / 2); shade(sign); objects.add(sign);
}

/* ── 站钟：直径 0.34 m，白色表盘、黑色外圈；刻度 60 根（整点粗长）；三根针是薄片，离表盘几毫米，会在表盘上投影 ── */
const clock = new THREE.Group(); let hH, hM, hS;
{
  const Rd = 0.17, T = 0.045;
  const dial = tex(2 * Rd, 2 * Rd, (g, w) => {                            // 单位 mm
    const r = w / 2; g.translate(r, r); g.fillStyle = "#fbfbf9"; g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
    g.fillStyle = INK;
    for (let i = 0; i < 60; i++) { g.save(); g.rotate(i / 60 * Math.PI * 2); const big = i % 5 === 0; g.fillRect(-(big ? 5.5 : 2), -r * 0.94, big ? 11 : 4, big ? r * 0.25 : r * 0.07); g.restore(); }
  }, 1200);
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(Rd + 0.012, Rd + 0.012, T, 96), new THREE.MeshStandardMaterial({ color: "#2a2c2e", roughness: .35, metalness: .4 }));
  rim.rotation.x = Math.PI / 2; clock.add(rim);
  const face = new THREE.Mesh(new THREE.CircleGeometry(Rd, 96), new THREE.MeshStandardMaterial({ map: dial, roughness: .7 }));
  face.position.z = T / 2 + 0.0005; clock.add(face);
  const hand = (len, tail, w, color, z) => { const g = new THREE.Group(), m = new THREE.Mesh(new THREE.BoxGeometry(w, len + tail, 0.003), new THREE.MeshStandardMaterial({ color, roughness: .5 }));
    m.position.y = (len - tail) / 2; g.add(m); g.position.z = T / 2 + z; clock.add(g); return g; };
  hH = hand(Rd * 0.62, Rd * 0.2, 0.016, INK, 0.006);
  hM = hand(Rd * 0.88, Rd * 0.2, 0.012, INK, 0.010);
  hS = hand(Rd * 0.6, Rd * 0.3, 0.004, ACCENT, 0.014);
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(Rd * 0.1, Rd * 0.1, 0.003, 48), hS.children[0].material); disc.rotation.x = Math.PI / 2; disc.position.y = Rd * 0.6; hS.add(disc);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.006, 24), hS.children[0].material); cap.rotation.x = Math.PI / 2; cap.position.z = 0.002; hS.add(cap);
  clock.position.set(0.82, YC + 0.44, OFF + T / 2); shade(clock); objects.add(clock);
}
/* 瑞士站钟的走法：秒针 58.5 秒走完一圈，到 12 停住，整分钟时分针跳一格、秒针再走 */
function hands() {
  const d = new Date(), s = d.getSeconds() + d.getMilliseconds() / 1000, m = d.getMinutes(), h = d.getHours() % 12;
  const sa = Math.min(1, s / 58.5) * Math.PI * 2;
  hS.rotation.z = -sa; hM.rotation.z = -(m / 60) * Math.PI * 2; hH.rotation.z = -((h + m / 60) / 12) * Math.PI * 2;
}

/* ── 小站台：搁板 1.5 × 0.03 m、进深 0.16 m；两根钢轨、一排枕木；上面停着火车头，侧面朝外 ── */
{
  const y0 = YC - 0.36, Wl = 1.5, Dl = 0.16;
  const shelf = new THREE.Mesh(new THREE.BoxGeometry(Wl, 0.03, Dl), new THREE.MeshStandardMaterial({ color: "#eeeeeb", roughness: .85 }));
  shelf.position.set(0, y0 - 0.015, OFF + Dl / 2); shade(shelf); objects.add(shelf);
  const steel = new THREE.MeshStandardMaterial({ color: "#6d7276", roughness: .35, metalness: .8 }), wood = new THREE.MeshStandardMaterial({ color: "#5e5850", roughness: .9 });
  for (let i = 0; i < 26; i++) { const t = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.006, 0.075), wood); t.position.set(-Wl / 2 + 0.05 + i * (Wl - 0.1) / 25, y0 + 0.003, OFF + Dl / 2); shade(t); objects.add(t); }
  for (const dz of [-0.022, 0.022]) { const r = new THREE.Mesh(new THREE.BoxGeometry(Wl - 0.04, 0.007, 0.004), steel); r.position.set(0, y0 + 0.0095, OFF + Dl / 2 + dz); shade(r); objects.add(r); }
  const s = (await new GLTFLoader().loadAsync("../assets/objects/locomotive.glb")).scene;   // 模型里车头朝 +x：不转，侧面对着人
  const box = new THREE.Box3().setFromObject(s), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const k = 0.95 / Math.max(size.x, size.z);                                                   // 车身长 0.95 m（比搁板短一些）
  s.scale.multiplyScalar(k); s.position.set(-c.x * k + 0.05, y0 + 0.013 - box.min.y * k, OFF + Dl / 2 - c.z * k);
  shade(s); objects.add(s);
}

R.layout();
/* 秒针在走：每 1/12 秒画一次（只在页面看得见时）；停在 12 的 1.5 秒里不画 */
let last = 0;
(function tick(t) { requestAnimationFrame(tick); if (document.hidden || t - last < 83) return; last = t; const s = new Date().getSeconds() + new Date().getMilliseconds() / 1000; if (s < 58.6 || last % 1000 < 90) R.render(); })(0);
</script>
</body>
</html>

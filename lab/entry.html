<style>
  /* 字体：Sunghyun Sans（SIL OFL 1.1，作者仓库原文件，见 assets/fonts/）——参考站用的就是它 */
  @font-face { font-family: "Sunghyun Sans"; src: url("../assets/fonts/SunghyunSans-Medium.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "Sunghyun Sans"; src: url("../assets/fonts/SunghyunSans-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
  /* 纸桌入口（第四阶段实验）：切换条沿用 lab/strip.html 的复现，换成 6 个物件、一页一根刻度、不放文字；物件是同一束窗光下的 3D 模型。方向见 docs/ART-DIRECTION.md */
  html, body { margin: 0; height: 100%; background: #e6e9eb; overflow: hidden; user-select: none; -webkit-user-select: none; font-family: "Sunghyun Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  /* 参考站尺寸不随窗口缩放；竖直位置随窗口高度变化，由脚本 place() 按实测表设置 */
  #strip { position: absolute; left: 0; top: 0; height: 900px; will-change: transform; }
  .it { position: absolute; top: 0; width: 240px; text-align: center; }
  .it .when { position: absolute; top: 214px; left: 0; right: 0; color: #8a8a8a; font-weight: 500; font-size: 20px; line-height: 32px; }
  .it .art { position: absolute; left: 0; width: 240px; height: 240px; top: 285px; cursor: pointer; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 阳光调节面板（?tune=1 才显示） */
  #tune { position: fixed; right: 16px; top: 16px; z-index: 5; width: 280px; max-height: calc(100vh - 32px); overflow: auto; padding: 12px 14px; box-sizing: border-box;
    background: rgba(255,255,255,.92); border: 1px solid rgba(0,0,0,.08); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.08);
    font: 12px/1.4 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; color: #222; cursor: auto; }
  #tune h4 { margin: 10px 0 4px; font-size: 12px; font-weight: 600; color: #666; }
  #tune h4:first-child { margin-top: 0; }
  #tune label { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 6px; margin: 3px 0; }
  #tune input[type=range] { width: 100%; }
  #tune output { text-align: right; font-variant-numeric: tabular-nums; color: #555; }
  #tune .row { display: flex; gap: 6px; margin-top: 10px; }
  #tune button { flex: 1; padding: 5px 0; border: 1px solid rgba(0,0,0,.15); border-radius: 6px; background: #fff; font: inherit; cursor: pointer; }
  #tune .busy { margin-top: 6px; color: #999; min-height: 1.4em; }
  /* 胶片感：四角压暗 + 细颗粒，盖在最上面（面板之下），不挡鼠标 */
  #film { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  #film::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(20,22,24,.28) 100%); opacity: var(--vig, 0); }
  #film::after { content: ""; position: absolute; inset: -50%; background-image: var(--grain); background-size: 256px 256px; mix-blend-mode: overlay; opacity: var(--gr, 0); transform: translate(var(--gx, 0), var(--gy, 0)); }
  #dust { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }   /* 浮尘：叠在 3D 上面、切换条下面 */
  /* 模型署名（CC BY 4.0 要求在页面上署名），样式同 radio.html */
  .credit { position: fixed; z-index: 8; right: 18px; bottom: 18px; font-size: 10px; color: rgba(55,59,56,.42); }
  .credit a { color: inherit; text-decoration: none; } .credit a:hover { text-decoration: underline; }
  #strip, #zone { z-index: 1; }
  .it .place { position: absolute; top: 557px; left: 0; right: 0; color: #1a1a1a; font-weight: 500; font-size: 20px; line-height: 32px; letter-spacing: -.2px; }
  /* 鼠标在刻度区里时隐藏光标（用户 2026-11-02）：指针刻度本身就是光标 */
  #zone { position: absolute; left: 50%; width: 544px; margin-left: -272px; top: 714.5px; height: 104px; cursor: none; touch-action: none; outline: none; }
  .tk { position: absolute; left: 0; top: 0; width: 3px; height: 8px; border-radius: 999px; background: #1a1a1a; will-change: transform, height, opacity; }
  .sp { position: absolute; left: 0; top: 0; width: 3px; height: 14px; border-radius: 999px; background: #1a1a1a; opacity: .28; }
  .reel { display: inline-block; position: relative; height: 24px; vertical-align: top; overflow: visible; white-space: pre; transition: width .52s cubic-bezier(.4,0,.2,1); }
  .reel > span { position: absolute; left: 0; top: 0; height: 100%; backface-visibility: hidden; }
  .reel > .gh { width: 100%; pointer-events: none; transform: scaleY(2.33333); }
  .reel > .gh > span { position: absolute; left: 0; top: 0; height: 100%; }
  #lab { display: none; position: absolute; top: 0; left: 0; font-size: 20px; line-height: 24px; font-weight: 500; color: #1d1d1d; white-space: nowrap; pointer-events: none; transform: translate(-50%, 0); opacity: 0; }
  .num { position: absolute; top: 0; left: 0; font-size: 17px; line-height: 24px; font-weight: 600; white-space: nowrap; pointer-events: none; transform: translate(-50%, -50%); font-variant-numeric: tabular-nums; }
  .mk { position: absolute; left: 0; top: 0; width: 4px; height: 10px; border-radius: 999px; background: #7FC1EC; pointer-events: none; }
</style>

<body>
<span class="credit"><a href="https://sketchfab.com/3d-models/2-boxes-3f920e8fd10c4664b5bd1dea3cf7606e" target="_blank" rel="noreferrer">2 boxes</a> · Cozmoth ·
  <a href="https://sketchfab.com/3d-models/radio-t3-aad3d54384904cfc9b3df8791d254c5c" target="_blank" rel="noreferrer">T3</a> · ludwigangulodi ·
  <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noreferrer">CC BY 4.0</a></span>
<canvas id="gl"></canvas>
<canvas id="dust"></canvas>
<div id="tune" hidden></div>
<div id="film"></div>
<div id="strip"></div>
<div id="zone" tabindex="0" role="slider" aria-label="页面"></div>
<script src="../preload.js" defer></script>
<script type="module">
// 先等字体到位：细调轮里每格的宽度按文字实际宽度算
await Promise.all(["500 19px", "500 20px", "600 15px"].map(f => document.fonts.load(f + " 'Sunghyun Sans'", "0123456789 JanFebMarAprMayJunJulAugSepOctNovDec"))).catch(() => {});
/* ── 数据：日期序列照参考站（149 个地点，2025-12 → 2026-10），名字用占位 ── */
/* 六个物件 = 六页（"雪国来信"是 2026-11-03 加的：放信封的木头信插；雪国线那格的火车头 2026-11-03 拿掉了，雪国线从首页工具栏进）；一页一根刻度。month/day 结构沿用复现代码：都算同一个"月"，所以没有月界分隔 */
const PAGES = [
  { name: "项目", href: "../index.html#board", model: "silk" },
  { name: "便签", href: "../index.html#notes", model: "textile" },
  { name: "白噪音", href: "../radio.html", model: "t3" },
  { name: "明信片", href: "../receipt.html", model: "boxes" },
  { name: "手账", href: "../journal.html", model: "binders" },        // 一叠卡册（书架在手账页里，用户 2026-11-03）
  { name: "雪国来信", href: "../letter.html", model: "organizer" },        // 写信那页（照听雨来信写信页还原的信纸，letter.html）
];
const DATES = PAGES.map((p, i) => "P" + (i + 1) + " 1");                   // 每页算一个"月"：页与页之间有长分隔，跨页的咔声更重
window.PAGES_3D = PAGES;
/* 竖直位置照参考在 7 个窗口高度下的实测值插值（日期行顶、刻度区顶；宽度不影响），超出范围按两端斜率外推 */
const VH = [573, 688, 760, 860, 900, 1080, 1440], WHEN = [24, 88, 145, 195, 215, 305, 485], ZONE = [453, 567, 624, 685, 715, 850, 1120];
function interp(xs, ys, x) { let i = 0; while (i < xs.length - 2 && x > xs[i + 1]) i++; return ys[i] + (ys[i + 1] - ys[i]) * (x - xs[i]) / (xs[i + 1] - xs[i]); }
function place() { const h = innerHeight; document.getElementById("strip").style.top = (interp(VH, WHEN, h) - 214) + "px"; document.getElementById("zone").style.top = interp(VH, ZONE, h) + "px"; }
addEventListener("resize", place);
const N = DATES.length, ITEM = 240, PITCH = ITEM + 100; window.PITCH_3D = PITCH;    // 格距 340 px（用户 2026-11-02：照参考图收紧间距；物件宽约 290，物件之间空约 50 px）
/* 物件按真实尺寸缩小（用户 2026-11-03："按照实际真实尺寸比例缩小到 entry，不然一个尺寸有点像玩具"；选了"分两组，每组内部按真实比例"）：
   · 墙上一组（两块板）：每米 240 px。便签板 2.5 × 1.2 m → 600 × 288 px；项目板 2.0 × 1.0 m → 480 × 240 px。
   · 桌上一组（收音机、明信片盒、一叠卡册、信插）：每米 1100 px。一叠卡册（五本平放摞起来，按现在的卡数量）37.6 × 20.8 cm → 414 × 229 px，卡数变了厚度跟着变，3D 按实际量到的宽缩放；明信片盒（两只并排）26.4 × 11.4 cm → 290 × 125 px；收音机 T3 横放 15.2 × 8.2 cm → 167 × 90 px；
     信插 15.1 × 9.3 cm → 166 × 102 px。
   REAL 是每个物件真实的宽（米，单个物件），3D 部分按它缩放（模型自己的单位不一定是米，比如 T3 是毫米）。
   格子之间的距离跟着物件宽度变：相邻两个物件中心距 = 两个半宽 + 空隙 GAP 60 px，最少还是原来的格距 340 px。
   刻度尺不变（每页一段、等距）；切换条在尺子上的位置 s 换算成物件条上的位置时，在相邻两个物件之间按比例插值（stripX）。 */
const PPM = { wall: 240, desk: 1100 };
const REAL = { silk: [2.0, 1.0, "wall"], textile: [2.5, 1.2, "wall"], binders: [0.376, 0.208, "desk", 0.369], t3: [0.152, 0.082, "desk"], boxes: [0.264, 0.114, "desk"], organizer: [0.151, 0.093, "desk"] };
const GAP = 60;
const WPX = PAGES.map(p => REAL[p.model] ? REAL[p.model][0] * PPM[REAL[p.model][2]] : 290);   // 没有真实尺寸的（占位方块）按 290 px
// 很深的物件（第 4 个数是进深，米）转起来侧面露出来会变宽：算间距时加上转到最斜（35° × 这个物件的转动幅度 0.25）时多出的那段
const SIDE = PAGES.map(p => REAL[p.model] && REAL[p.model][3] ? REAL[p.model][3] * PPM[REAL[p.model][2]] * Math.sin(35 * 0.25 * Math.PI / 180) : 0);
const HPX = PAGES.map(p => REAL[p.model] ? REAL[p.model][1] * PPM[REAL[p.model][2]] : 160);
const XC = [0]; for (let i = 1; i < PAGES.length; i++) XC.push(XC[i - 1] + Math.max(PITCH, WPX[i - 1] / 2 + SIDE[i - 1] + GAP + WPX[i] / 2 + SIDE[i]));   // 每个物件中心在物件条上的位置
const stripX = sx => { const t = sx / PITCH, i = Math.max(0, Math.min(PAGES.length - 2, Math.floor(t))); return XC[i] + (t - i) * (XC[i + 1] - XC[i]); };   // 两头以外按两端那段的斜率外推
Object.assign(window, { REAL_3D: REAL, PPM_3D: PPM, XC_3D: XC, WPX_3D: WPX, HPX_3D: HPX });
const month = DATES.map(d => d.split(" ")[0]), day = DATES.map(d => +d.split(" ")[1]);

/* ── 物件条 ── */
const strip = document.getElementById("strip");
DATES.forEach((d, i) => {
  const el = document.createElement("div"); el.className = "it"; el.style.left = XC[i] + "px";
  el.innerHTML = `<a class="art" href="${PAGES[i].href}" aria-label="${PAGES[i].name}"></a>`;   // 物件上下不放文字（用户 2026-11-02 定）；名字只给读屏
  // 点的范围 = 物件在画面上占的那块（底边在格子中心下方 120 px，见 3D 部分 BOTTOM_PX）
  const a = el.firstChild, w = Math.max(WPX[i], 120), h = Math.max(HPX[i], 120);
  Object.assign(a.style, { left: (ITEM - w) / 2 + "px", width: w + "px", top: 285 + 120 + 120 - h + "px", height: h + "px" });
  strip.append(el);
});

/* ── 刻度布局：每个月的刻度数按地点数分配，刻度间距 7–9 px，月与月之间一根长分隔 ── */
const zone = document.getElementById("zone"), LINE = 58; let ZW = 544;     // 刻度中线离刻度区顶部 58 px（页面 y≈772）
const months = []; month.forEach((m, i) => { if (!months.length || months.at(-1).m !== m) months.push({ m, a: i, n: 0 }); months.at(-1).n++; });
const Lpos = new Float64Array(N), tickOf = new Int32Array(N); const ticks = [], seps = [];
/* 刻度条两头各多出 EXT 根刻度（用户 2026-11-02：再往左右延伸，让最右的木柜也能完全拖进左边的阳光里）：
   多出来的刻度图案照旧（从格子往外数，第 1、11、21… 根是长刻度，其余是小刻度），间距不变，所以刻度区变宽；
   它们和别的刻度一样能指、能点、能拖，属于最近的那一格（左边算第一格，右边算最后一格）。
   EXT 怎么定：当时墙上的阳光只照到 x≈260 以左（1440 宽的窗口实测），点到最右那根时，切换条停在
   最后一格再往右 (4 + EXT) × STEP = 17 × 34 = 578 px，木柜中心在 x≈140，左右边缘约 55–230，整个在阳光里，也没出画面。
   后来窗换成百叶窗（见 3D 部分），亮区是画面左边 1/3（到 x ≈ 480）；木柜拖到最右时中心在 x ≈ 140，照样整个在光里。 */
const EXT = 13;
const PER_PAGE = 9;                                                       // 每页一段 9 根小刻度，页与页之间一根长分隔；刻度区宽度同参考（用户 2026-11-02：别简化，要连续的咔声）
function layout() {
  const avail = ZW - 48;
  const plan = t => { const ks = months.map(() => PER_PAGE); const slots = ks.reduce((a, b) => a + b, 0) - 1 + (months.length - 1); return { ks, slots, s: avail / slots }; };
  let p = plan(N); for (let t = N - 1; p.s < 7 && t >= months.length; t--) p = plan(t);
  const c = Math.min(9, p.s);                                              // 间距按原来 544 px 宽算好；再加上两头各 EXT 根，刻度区跟着变宽
  ZW += 2 * EXT * c; zone.style.width = ZW + "px"; zone.style.marginLeft = -ZW / 2 + "px";
  const total = c * (p.slots + 2 * EXT); let u = (ZW - total) / 2 - c / 2, R = 0;
  // d = 这根离格子有几根（0 = 紧挨着格子）；d 是 10 的倍数时是长刻度
  const ext = (month, left) => { for (let e = 0; e < EXT; e++) { const d = left ? EXT - 1 - e : e, sep = d % (PER_PAGE + 1) === 0; ticks.push({ x: u + c / 2, month, sep, ext: true }); if (sep) seps.push(u + c / 2); u += c; } };
  ext(0, true);                                                           // 左头：紧挨第一格的那根是长刻度
  layout.left = ticks.length;
  months.forEach((mo, k) => {
    if (k > 0) { seps.push(u + c / 2); ticks.push({ x: u + c / 2, month: k, sep: true }); u += c; }   // 长刻度也是一根刻度：能指、能点（用户 2026-11-02）
    const r = p.ks[k];
    for (let e = 0; e < mo.n; e++) { Lpos[mo.a + e] = u + (e + .5) * r * c / mo.n; tickOf[mo.a + e] = R + Math.min(r - 1, Math.floor((e + .5) * r / mo.n)); }
    for (let e = 0; e < r; e++) ticks.push({ x: u + (e + .5) * c, month: k });
    R += r; u += r * c;
  });
  ext(months.length - 1, false);                                          // 右头：紧挨最后一格的那根是长刻度
  layout.c = c;
}
layout();
const C = layout.c;
/* 刻度轴是一条连续的尺子（用户 2026-11-02：每根刻度都能选，长刻度也能）：每根刻度对应切换条的一个位置 pos。
   相邻两根（长、短都算）差 STEP = 格距 / (每页小刻度数 + 1)，即 400 / 10 = 40 px；每页中间那根小刻度 = 物件正中，
   长刻度 = 两个物件正中间。例：第 2 格的第 5 根（中间那根）→ pos 800；第 2、3 格之间的长刻度 → pos 1000。 */
const STEP = PITCH / (PER_PAGE + 1), MID = (PER_PAGE - 1) / 2;
const LEFT = layout.left;                                                 // 左头多出来的刻度根数：第一格的第一根小刻度是 ticks[LEFT]
ticks.forEach((t, s) => t.pos = (s - LEFT - MID) * STEP);
const tickX = pos => ticks[LEFT].x + (pos / STEP + MID) * C;
// 切换条能停的范围：最左那根刻度到最右那根（每根都能选，包括第一格左边、最后一格右边那几根）
const XMIN = ticks[0].pos, XMAX = ticks.at(-1).pos;
const curOf = x => Math.max(0, Math.min(N - 1, Math.round(x / PITCH)));   // 离位置 x 最近的物件                 // 切换条位置 → 尺子上的 x（黑色当前位置画在这里）
const nearTick = b => { let k = 0, bd = 1e9; ticks.forEach((t, j) => { const d = Math.abs(t.x - b); if (d < bd) { bd = d; k = j; } }); return k; };
/* 同一天的几个地点在擦动时合成一格：U = 不重复的日期，位置取这几个地点的平均 */
const U = []; DATES.forEach((d, i) => { if (U.length && U.at(-1).d === d) { U.at(-1).items.push(i); } else U.push({ d, items: [i] }); });
U.forEach(u => u.x = u.items.reduce((a, i) => a + Lpos[i], 0) / u.items.length);
const uOf = new Int32Array(N); U.forEach((u, k) => u.items.forEach(i => uOf[i] = k));
const nearU = x => { let b = 0, bd = 1e9; U.forEach((u, k) => { const d = Math.abs(u.x - x); if (d < bd) { bd = d; b = k; } }); return b; };
const tickEls = ticks.map(() => { const d = document.createElement("div"); d.className = "tk"; zone.append(d); return d; });
// 长刻度和小刻度一样用 .tk 画（在刻度列表里），不再单独画
const lab = document.createElement("div"); lab.id = "lab"; zone.append(lab);
/* 日期标签换字时像滚轮一样翻过去（照参考逐帧实测）：
   · 跨月：整个日期作为一块一起翻；同月：只翻变了的那一位数字（13→16 只翻个位），多出或少掉的一位宽度从 0 长出 / 缩回
   · 每次翻动：新字从 -64° 转到 0°、旧字从 0° 转到 64°，曲线和透明度是实测的 25 个关键帧；外面再叠 5 层竖向拉长的模糊残影
   · 宽度变化 520 ms cubic-bezier(.4,0,.2,1)；翻动时长 520 ms 起，连续快速换字时逐次缩短到 260 ms，停久了再慢慢回到 520 ms */
const ROLL = [0,.0039,.0173,.043,.0852,.1486,.2366,.3445,.4572,.5597,.6463,.7173,.7756,.8233,.8623,.8945,.9208,.9422,.9594,.973,.9833,.9909,.9961,.9991,1];
const OP_IN = [0,0,.002,.006,.015,.024,.024,.01,0,.023,.078,.153,.237,.323,.406,.485,.559,.628,.691,.749,.802,.852,.898,.943,1];
const OP_OUT = [1,.904,.806,.68,.519,.327,.14,.025,0,.016,.032,.038,.037,.032,.026,.02,.014,.01,.006,.003,.002,.001,0,0,0];
const GH_IN = [0,0,0,.002,.01,.033,.091,.193,.309,.396,.442,.454,.446,.424,.394,.361,.324,.287,.249,.211,.173,.135,.096,.055,0];
const GH_OUT = [0,.09,.168,.256,.356,.459,.527,.506,.4,.276,.179,.112,.069,.042,.025,.015,.008,.004,.002,.001,0,0,0,0,0];
const GHOSTS = [[.03, 0], [.0375, .286], [.045, .714], [.0525, 0], [.06, 0]];          // 每层残影的模糊量和权重（实测）

/* 物件跟着切换条转（用户 2026-11-02：不要像贴纸）：像人走过一排实物，每个物件的转角 =
     基础角度 BASE + atan(物件离画面中心的距离 / 视距)，视距取"离开一格（PITCH_3D）时多转 PER 度"，总角度不超过 ±MAXYAW。
   只绕竖轴平着左右转，不俯视、不倾斜：竖线永远是竖的（用户 2026-11-02：斜着转，柜子看着要倒）。
   幅度不要夸张（用户 2026-11-02）：BASE 15°、PER 20°、MAXYAW 35°。
   例：停在明信片盒子上 → 盒子转 15°；右边的一叠卡册离开一格，转 15° + 20° = 35°，露出左侧面；左边的收音机转 15° − 20° = −5°。
   物件绕自己的中心转（pivot），不绕墙面转，免得转进墙里。两个数可在地址里试：?base=15&per=20 */
const Q = new URLSearchParams(location.search);
const BASE = +(Q.get("base") ?? 15) * deg, PER = +(Q.get("per") ?? 20) * deg;
const MAXYAW = 35 * deg;
const yawAt = dx => Math.max(-MAXYAW, Math.min(MAXYAW, BASE + Math.atan(dx / (PITCH_3D / Math.tan(PER)))));
/* 单个模型的转动幅度：转角 = 上面算出的角 × TURN（没列出的 × 1）。
   两块板（silk 蓝色玻璃板、textile 米色布板）转角 × 0.25（用户 2026-11-02：板子上的光很奇怪）：
   太阳方位 18° 时光几乎贴着墙扫过来，板子停在中间再转 15°，板面和光只剩约 3°，照得很暗、条纹也被拉斜，和墙上对不上；
   平的板子转起来本来也看不出多少立体感。× 0.25 后停在中间约 4°、最多约 9°。 */
/* 一叠卡册也 × 0.25（2026-11-03）：卡册 37 cm 深，转到 35° 时侧面露出约 21 cm，压到旁边的盒子，侧面还露出一摞白色的板边和卡页；× 0.25 后最多约 9°。 */
const TURN = { silk: 0.25, textile: 0.25, binders: 0.25 };
const turnOf = i => TURN[PAGES_3D[i].model] ?? 1;
/* 大小：2026-11-03 起物件都按真实尺寸（见切换条脚本里的 REAL、PPM）。下面这三条是之前"大小均匀"的缩法（用户 2026-11-02，照 pengzhe），
   现在只给还没有模型、也没有真实尺寸的占位方块用：
   1. 侧影宽 = |宽·cos θ| + |厚·sin θ|（θ 是转角）。停在中间时（θ = BASE）的侧影宽缩放到 WIDTH_PX；
   2. 太高的再缩小，高不超过 HEIGHT_PX；
   3. 长东西转到最斜（θ = ±MAXYAW）时会变宽：最宽不超过 WIDEST_PX，免得压到邻格太多；
   取三个里最小的缩放。
   所有物件的底边放在同一条线上：格子中心往下 BOTTOM_PX。 */
const WIDTH_PX = 290, HEIGHT_PX = 360, WIDEST_PX = 400, BOTTOM_PX = 120;   // 用户 2026-11-02：放大模型（参考图楼宽约占格距 3/4）
const sideWidth = (f, a) => Math.abs(f.size.x * Math.cos(a)) + Math.abs(f.size.z * Math.sin(a));
function fitInto(group, obj) {
  const pivot = new THREE.Group(); group.userData.obj = obj; group.userData.pivot = pivot;
  const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  obj.userData.fit = { size, c, zmin: box.min.z, s0: obj.scale.x };
  obj.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; (Array.isArray(o.material) ? o.material : [o.material]).forEach(addRefl); } });
  pivot.add(obj); group.add(pivot); sizeObjects(); render();
}
function sizeObjects() {                                                  // 窗口宽度变了，格子在世界里的大小也跟着变（R.PXM：每米多少 CSS 像素）
  slots.forEach((g, i) => { const o = g.userData.obj; if (!o) return; const f = o.userData.fit, t = turnOf(i);   // 按这个模型自己的转角算宽度
    const widest = Math.max(sideWidth(f, MAXYAW * t), sideWidth(f, -MAXYAW * t));
    const real = window.REAL_3D[PAGES_3D[i].model];                      // 有真实尺寸的：按所在那组的每米像素数缩放（见切换条脚本里的 REAL、PPM）
    const k = real ? (PAGES_3D[i].model === "binders" ? f.size.x : real[0]) * window.PPM_3D[real[2]] / (f.size.x * R.PXM)   // 卡册那叠本身就是米，按实际量到的宽
      : Math.min(WIDTH_PX / sideWidth(f, BASE * t), HEIGHT_PX / f.size.y, WIDEST_PX / widest) / R.PXM;
    // 物件的中心放在 pivot 上；pivot 离墙 = 半个厚度 + 12 mm（不转时背面离墙 12 mm），高度让底边落在格子中心下方 BOTTOM_PX
    o.scale.setScalar(f.s0 * k); o.position.set(-f.c.x * k, -f.c.y * k, -f.c.z * k);
    g.userData.pivot.position.set(0, -BOTTOM_PX / R.PXM + f.size.y * k / 2, (f.c.z - f.zmin) * k + (OFF_OF[PAGES_3D[i].model] ?? OFF_WALL)); });
}
/* 两块板上放上真东西（用户 2026-11-03）：项目板上是首页的项目卡，便签板上是首页的便签（../entry-boards.js，读这个浏览器里存的同一份数据） */
const DRESS = {
  silk: o => { dressSilk(R, o); render(); },
  textile: o => { dressTextile(R, o); render(); },
};
PAGES_3D.forEach((p, i) => {
  if (p.model && MODELS[p.model]) MODELS[p.model]().then(o => { fitInto(slots[i], o); return DRESS[p.model]?.(o); }).catch(e => console.error(p.name, e));
  else fitInto(slots[i], new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.02), new THREE.MeshStandardMaterial({ color: "#dcdfe1", roughness: .9 })));   // 还没有模型：占位方块
});

let off = window.__stripOff ? window.__stripOff() : innerWidth / 2 - 120;   // 物件条的位置：开始时问切换条（?at= 打开时不在第 0 格）
function placeSlots() {
  const top = parseFloat(getComputedStyle(document.getElementById("strip")).top) + 285 + 120;   // 物件区中心的页面 y
  slots.forEach((g, i) => {
    const dx = off + XC[i] + 120 - innerWidth / 2;                  // 这个物件离画面中心多远（CSS 像素，右边为正）
    g.position.set(dx / R.PXM, YC - (top - innerHeight / 2) / R.PXM, 0);
    // 转角 = 跟着切换条的角度 + 鼠标拿在手里的倾斜（hold）；"XYZ"：先左右转，再绕画面的横轴上下转，竖线保持竖直
    const pv = g.userData.pivot, h = hold[i]; if (pv) pv.rotation.set(h.x, yawAt(dx) * turnOf(i) + h.y, 0, "XYZ");
  });
}
window.__scene3d = o => { off = o; render(); aim(); };

/* ── 鼠标拿在手里（用户 2026-11-02，同 sasshi 拉链袋里的东西）：鼠标移到哪个模型上，它就跟着指针轻轻转；
   移走就慢慢回正。
   哪个模型算"被指着"：指针在它那一格里（左右各半个格距），上下在它的底边以上 HEIGHT_PX、以下 30 px 之间。
     指着：目标角度 = 指针离模型中心的距离（按半格、半高算成 −1 到 1）× 最大角度：左右最多 HOLD_YAW，上下最多 HOLD_PITCH；
           指针在右边 → 正面往右转；指针在下边 → 正面往下转。
     没指着：目标角度 = 0（回正）。
   角度用带一点回弹的弹簧跟上目标（HOLD_K 弹簧硬度、HOLD_DAMP 阻尼比，小于 1 就会稍稍冲过头再回来）。
   例：鼠标从左往右扫过一叠卡册 → 它先往左偏、再往右偏，最多 14°；鼠标移开 → 书架晃一下回到原来的角度。
   只有还在转的时候才逐帧重画，停稳了就停。 */
const HOLD_YAW = 14 * deg, HOLD_PITCH = 4 * deg, HOLD_K = 90, HOLD_DAMP = 0.62;
const hold = PAGES_3D.map(() => ({ x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0 }));
let mouse = null;
const clamp1 = v => Math.max(-1, Math.min(1, v));
function aim() {
  const top = parseFloat(getComputedStyle(document.getElementById("strip")).top) + 285 + 120, base = top + BOTTOM_PX;   // 底边那条线的页面 y
  hold.forEach((h, i) => {
    const cx = off + XC[i] + 120, hw = Math.max(PITCH_3D, WPX[i] + 60) / 2, ht = Math.max(HEIGHT_PX, HPX[i] + 20), cy = base - ht / 2;   // 指着的范围：至少原来一格，大的物件按它自己的宽高
    const on = mouse && Math.abs(mouse.x - cx) < hw && mouse.y > base - ht && mouse.y < base + 30;
    h.ty = on ? clamp1((mouse.x - cx) / hw) * HOLD_YAW : 0;
    h.tx = on ? clamp1((mouse.y - cy) / (ht / 2)) * HOLD_PITCH : 0;
  });
  if (!holdRaf) { holdLast = performance.now(); holdRaf = requestAnimationFrame(holdStep); }
}
let holdRaf = 0, holdLast = 0;
function holdStep(now) {
  const dt = Math.min(0.05, (now - holdLast) / 1000); holdLast = now;
  const c = 2 * Math.sqrt(HOLD_K) * HOLD_DAMP; let busy = false;
  for (const h of hold) {
    h.vx += (HOLD_K * (h.tx - h.x) - c * h.vx) * dt; h.x += h.vx * dt;
    h.vy += (HOLD_K * (h.ty - h.y) - c * h.vy) * dt; h.y += h.vy * dt;
    if (Math.abs(h.tx - h.x) > 1e-4 || Math.abs(h.ty - h.y) > 1e-4 || Math.abs(h.vx) > 1e-3 || Math.abs(h.vy) > 1e-3) busy = true;
    else { h.x = h.tx; h.y = h.ty; h.vx = h.vy = 0; }
  }
  render();
  holdRaf = busy ? requestAnimationFrame(holdStep) : 0;
}
addEventListener("pointermove", e => { mouse = { x: e.clientX, y: e.clientY }; aim(); });
document.documentElement.addEventListener("pointerleave", () => { mouse = null; aim(); });
R.layout();

/* ── 阳光调节面板（用户 2026-11-02：给我一个阳光调整的 UI，自己调面积、角度、窗户位置）──
   地址后加 ?tune=1 才显示。拖滑块：数值马上变，松手后（或停 0.3 秒后）重算墙上的光（约 1 秒）。
   调过的值写回地址栏；"保存"存进这个浏览器（刷新、从别的页面回来都还在）；"复制参数"复制这些值；
   "恢复默认"回到 LIGHT_DEFAULT，并清掉保存的值。
   色温不放进面板（用户：不要改色调）。 */
if (new URLSearchParams(location.search).get("tune") === "1") {
  const box = document.getElementById("tune"); box.hidden = false;
  const GROUPS = [
    ["亮区", [["area", "面积（占画面宽）", 0.1, 1, 0.01], ["topY", "斜边高度 m", 0.8, 3.2, 0.01]]],
    ["窗户和太阳", [["turn", "窗墙朝向 °", 0, 70, 1], ["az", "太阳方位 °", 15, 70, 1], ["el", "太阳仰角 °", 10, 70, 1],
                   ["pitch", "条纹间距 m", 0.06, 0.4, 0.005], ["tilt", "百叶角度 °（越大越透光）", -30, 60, 1], ["ang", "边缘软硬 °", 0, 0.6, 0.01]]],
    ["强度", [["sun", "阳光", 0, 20, 0.1], ["sky", "天光", 0, 4, 0.05], ["bounce", "反射光", 0, 6, 0.05], ["glow", "高光溢出", 0, 1, 0.01], ["refl", "反光", 0, 3, 0.05], ["ao", "闭塞阴影", 0, 1, 0.01], ["aoObj", "物体自身闭塞", 0, 1.5, 0.01], ["floor", "地面反光", 0, 2, 0.05], ["env", "环境映像", 0, 1.5, 0.05], ["tau", "百叶透光", 0, 0.3, 0.01], ["bleed", "环境色", 0, 0.3, 0.005], ["haze", "光柱", 0, 0.5, 0.01], ["hazeD", "光柱厚度 m（0 自动）", 0, 1.6, 0.01], ["dust", "浮尘", 0, 2, 0.05]]],
    ["树叶和胶片", [["leaves", "窗外树叶", 0, 1, 0.01], ["film", "胶片感", 0, 1, 0.01]]],
  ];
  const fmt = (v, st) => st >= 1 ? String(Math.round(v)) : v.toFixed(st < 0.01 ? 3 : 2);
  const inputs = {};
  box.innerHTML = GROUPS.map(([t, items]) => `<h4>${t}</h4>` + items.map(([k, name, lo, hi, st]) =>
    `<label>${name}<input type="range" data-k="${k}" min="${lo}" max="${hi}" step="${st}"><output data-o="${k}"></output></label>`).join("")).join("") +
    `<div class="row"><button data-act="save">保存</button><button data-act="copy">复制参数</button><button data-act="reset">恢复默认</button></div><div class="busy"></div>`;
  const busy = box.querySelector(".busy");
  const sync = () => { for (const [, items] of GROUPS) for (const [k, , , , st] of items) { const el = box.querySelector(`[data-k=${k}]`); el.value = L[k]; box.querySelector(`[data-o=${k}]`).textContent = fmt(L[k], st); } };
  const toUrl = () => {                                                   // 只把和默认值不同的写进地址栏
    const q = new URLSearchParams(location.search); for (const k in LIGHT_DEFAULT) { if (L[k] !== LIGHT_DEFAULT[k]) q.set(k, L[k]); else q.delete(k); }
    history.replaceState(null, "", location.pathname + "?" + q.toString());
  };
  let t = 0;
  const later = () => { clearTimeout(t); busy.textContent = "重算中…"; t = setTimeout(() => { applyLight(); toUrl(); busy.textContent = ""; }, 300); };
  box.addEventListener("input", e => { const k = e.target.dataset.k; if (!k) return; L[k] = +e.target.value; box.querySelector(`[data-o=${k}]`).textContent = fmt(L[k], +e.target.step); later(); });
  box.addEventListener("click", e => {
    const act = e.target.dataset.act; if (!act) return;
    if (act === "reset") { Object.assign(L, LIGHT_DEFAULT); try { localStorage.removeItem("paper-desk.light.v1"); } catch (e) {} sync(); later(); }
    if (act === "save") {                                                 // 存进这个浏览器：刷新、从别的页面回来都还在
      try { localStorage.setItem("paper-desk.light.v1", JSON.stringify(Object.fromEntries(Object.keys(LIGHT_DEFAULT).map(k => [k, L[k]])))); busy.textContent = "已保存（这个浏览器里）"; }
      catch (e) { busy.textContent = "这个浏览器不让保存，请用“复制参数”"; }
    }
    if (act === "copy") {
      const diff = Object.fromEntries(Object.keys(LIGHT_DEFAULT).map(k => [k, L[k]]));
      const text = JSON.stringify(diff);
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => busy.textContent = "已复制", () => { busy.textContent = text; });
    }
  });
  ["pointerdown", "pointermove", "wheel", "keydown"].forEach(ev => box.addEventListener(ev, e => e.stopPropagation()));   // 面板上的操作不传给切换条
  sync();
}

</script>

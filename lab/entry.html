<body>

<script type="module">
// 先等字体到位：细调轮里每格的宽度按文字实际宽度算
await Promise.all(["500 19px", "500 20px", "600 15px"].map(f => document.fonts.load(f + " 'Sunghyun Sans'", "0123456789 JanFebMarAprMayJunJulAugSepOctNovDec"))).catch(() => {});
/* ── 数据：日期序列照参考站（149 个地点，2025-12 → 2026-10），名字用占位 ── */
/* 六个物件 = 六页；一页一根刻度。month/day 结构沿用复现代码：都算同一个"月"，所以没有月界分隔 */
const PAGES = [
  { name: "项目", href: "../index.html", model: "silk" },
  { name: "便签", href: "../index.html", model: "textile" },
  { name: "雪国线", href: "../focus.html", model: "loco" },
  { name: "明信片", href: "../receipt.html", model: "boxes" },
  { name: "手账", href: "../journal.html", model: "shelf" },
  { name: "白噪音", href: "../radio.html", model: "t3" },
];
const DATES = PAGES.map((p, i) => "P" + (i + 1) + " 1");                   // 每页算一个"月"：页与页之间有长分隔，跨页的咔声更重
window.PAGES_3D = PAGES;
/* 竖直位置照参考在 7 个窗口高度下的实测值插值（日期行顶、刻度区顶；宽度不影响），超出范围按两端斜率外推 */
const VH = [573, 688, 760, 860, 900, 1080, 1440], WHEN = [24, 88, 145, 195, 215, 305, 485], ZONE = [453, 567, 624, 685, 715, 850, 1120];
function interp(xs, ys, x) { let i = 0; while (i < xs.length - 2 && x > xs[i + 1]) i++; return ys[i] + (ys[i + 1] - ys[i]) * (x - xs[i]) / (xs[i + 1] - xs[i]); }
function place() { const h = innerHeight; document.getElementById("strip").style.top = (interp(VH, WHEN, h) - 214) + "px"; document.getElementById("zone").style.top = interp(VH, ZONE, h) + "px"; }
addEventListener("resize", place);
const N = DATES.length, ITEM = 240, PITCH = ITEM + 160; window.PITCH_3D = PITCH;    // 物件间距加大（参考是 32），滑动时才看得出在动（用户 2026-11-02）
const month = DATES.map(d => d.split(" ")[0]), day = DATES.map(d => +d.split(" ")[1]);

/* ── 物件条 ── */
const strip = document.getElementById("strip");
DATES.forEach((d, i) => {
  const el = document.createElement("div"); el.className = "it"; el.style.left = i * PITCH + "px";
  el.innerHTML = `<a class="art" href="${PAGES[i].href}" aria-label="${PAGES[i].name}"></a>`;   // 物件上下不放文字（用户 2026-11-02 定）；名字只给读屏
  strip.append(el);
});

/* ── 刻度布局：每个月的刻度数按地点数分配，刻度间距 7–9 px，月与月之间一根长分隔 ── */
const zone = document.getElementById("zone"), ZW = 544, LINE = 58;     // 刻度中线离刻度区顶部 58 px（页面 y≈772）
const months = []; month.forEach((m, i) => { if (!months.length || months.at(-1).m !== m) months.push({ m, a: i, n: 0 }); months.at(-1).n++; });
const Lpos = new Float64Array(N), tickOf = new Int32Array(N); const ticks = [], seps = [];
const PER_PAGE = 9;                                                       // 每页一段 9 根小刻度，页与页之间一根长分隔；刻度区宽度同参考（用户 2026-11-02：别简化，要连续的咔声）
function layout() {
  const avail = ZW - 48;
  const plan = t => { const ks = months.map(() => PER_PAGE); const slots = ks.reduce((a, b) => a + b, 0) - 1 + (months.length - 1); return { ks, slots, s: avail / slots }; };
  let p = plan(N); for (let t = N - 1; p.s < 7 && t >= months.length; t--) p = plan(t);
  const c = Math.min(9, p.s), total = c * p.slots; let u = (ZW - total) / 2 - c / 2, R = 0;
  months.forEach((mo, k) => {
    if (k > 0) { seps.push(u + c / 2); u += c; }
    const r = p.ks[k];
    for (let e = 0; e < mo.n; e++) { Lpos[mo.a + e] = u + (e + .5) * r * c / mo.n; tickOf[mo.a + e] = R + Math.min(r - 1, Math.floor((e + .5) * r / mo.n)); }
    for (let e = 0; e < r; e++) ticks.push({ x: u + (e + .5) * c, month: k });
    R += r; u += r * c;
  });
  layout.c = c;
}
layout();
const C = layout.c;
/* 同一天的几个地点在擦动时合成一格：U = 不重复的日期，位置取这几个地点的平均 */
const U = []; DATES.forEach((d, i) => { if (U.length && U.at(-1).d === d) { U.at(-1).items.push(i); } else U.push({ d, items: [i] }); });
U.forEach(u => u.x = u.items.reduce((a, i) => a + Lpos[i], 0) / u.items.length);
const uOf = new Int32Array(N); U.forEach((u, k) => u.items.forEach(i => uOf[i] = k));
const nearU = x => { let b = 0, bd = 1e9; U.forEach((u, k) => { const d = Math.abs(u.x - x); if (d < bd) { bd = d; b = k; } }); return b; };
const tickEls = ticks.map(() => { const d = document.createElement("div"); d.className = "tk"; zone.append(d); return d; });
const sepEls = seps.map(x => { const d = document.createElement("div"); d.className = "sp"; zone.append(d); return d; });
const lab = document.createElement("div"); lab.id = "lab"; zone.append(lab);
/* 日期标签换字时像滚轮一样翻过去（照参考逐帧实测）：
   · 跨月：整个日期作为一块一起翻；同月：只翻变了的那一位数字（13→16 只翻个位），多出或少掉的一位宽度从 0 长出 / 缩回
   · 每次翻动：新字从 -64° 转到 0°、旧字从 0° 转到 64°，曲线和透明度是实测的 25 个关键帧；外面再叠 5 层竖向拉长的模糊残影
   · 宽度变化 520 ms cubic-bezier(.4,0,.2,1)；翻动时长 520 ms 起，连续快速换字时逐次缩短到 260 ms，停久了再慢慢回到 520 ms */
const ROLL = [0,.0039,.0173,.043,.0852,.1486,.2366,.3445,.4572,.5597,.6463,.7173,.7756,.8233,.8623,.8945,.9208,.9422,.9594,.973,.9833,.9909,.9961,.9991,1];
const OP_IN = [0,0,.002,.006,.015,.024,.024,.01,0,.023,.078,.153,.237,.323,.406,.485,.559,.628,.691,.749,.802,.852,.898,.943,1];
const OP_OUT = [1,.904,.806,.68,.519,.327,.14,.025,0,.016,.032,.038,.037,.032,.026,.02,.014,.01,.006,.003,.002,.001,0,0,0];
const GH_IN = [0,0,0,.002,.01,.033,.091,.193,.309,.396,.442,.454,.446,.424,.394,.361,.324,.287,.249,.211,.173,.135,.096,.055,0];
const GH_OUT = [0,.09,.168,.256,.356,.459,.527,.506,.4,.276,.179,.112,.069,.042,.025,.015,.008,.004,.002,.001,0,0,0,0,0];
const GHOSTS = [[.03, 0], [.0375, .286], [.045, .714], [.0525, 0], [.06, 0]];          // 每层残影的模糊量和权重（实测）
const tf = (deg, pre = "") => `${pre}perspective(3em) translateZ(-0.54em) rotateX(${deg}deg) translateZ(0.54em)`;
const kfs = (from, to, ops, pre) => ROLL.map((e, i) => ({ transform: tf(from + (to - from) * e, pre), opacity: ops[i] }));
const mkReel = () => { const r = document.createElement("span"); r.className = "reel"; return r; };
function face(m, d) {                                                     // 一个日期：[月份][十位][个位]，各是一个轮
  const f = document.createElement("span"); f.className = "face"; const ds = d.split("");
  [m + " ", ds[0] || "", ds[1] || ""].forEach(t => { const r = mkReel(), x = document.createElement("span"); x.className = "cur"; x.textContent = t; r.append(x); f.append(r); });
  return f;
}
const outer = mkReel(); lab.append(outer);
let labItem = -1, rollDur = 520, lastRoll = -1e9;
const widthOf = el => { const r = mkReel(); r.style.cssText = "position:absolute;visibility:hidden;transition:none"; r.append(el); lab.append(r); const w = el.getBoundingClientRect().width; r.remove(); return w; };
function sizeReels(f) { for (const r of f.children) r.style.width = widthOf(r.firstChild.cloneNode(true)) + "px"; }
function roll(reel, nu, dir) {                                            // 把 reel 里的内容翻成 nu
  const old = reel.querySelector(":scope > .cur"); nu.classList.add("cur");
  reel.querySelectorAll(":scope > .gone, :scope > .gh").forEach(e => e.remove());
  reel.append(nu); reel.style.width = widthOf(nu.cloneNode(true)) + "px";
  if (!old || !dir) { if (old) old.remove(); return; }
  old.classList.replace("cur", "gone");
  const o = { duration: rollDur, easing: "linear" }, s = dir > 0 ? 1 : -1;
  nu.animate(kfs(-64 * s, 0, OP_IN), o);
  old.animate(kfs(0, 64 * s, OP_OUT), { ...o, fill: "forwards" }).finished.then(() => old.remove(), () => {});
  for (const [blur, wt] of GHOSTS) {
    if (!wt) continue;
    const g = document.createElement("span"); g.className = "gh"; g.setAttribute("aria-hidden", "true"); g.style.filter = `blur(${blur}em)`; g.style.opacity = wt;
    const a = nu.cloneNode(true), b = old.cloneNode(true); a.className = b.className = ""; a.getAnimations?.();  g.append(a, b); reel.append(g);
    a.animate(kfs(-64 * s, 0, GH_IN, "scaleY(0.428571) "), { ...o, fill: "forwards" });
    b.animate(kfs(0, 64 * s, GH_OUT, "scaleY(0.428571) "), { ...o, fill: "forwards" }).finished.then(() => g.remove(), () => {});
  }
}
let monthAt = -1e9, freezeT = 0;
function setLabel(it) {
  if (it === labItem) return;
  if (labItem >= 0 && DATES[it] === DATES[labItem]) { labItem = it; return; }   // 同一天的另一个地点：字不变，不算一次翻动
  const now = performance.now();
  // 跨进新月份后，标签在这个月的第一个地点停 520 ms 再跟指针（指针一直在动也一样）；这期间再跨月则立刻换
  if (labItem >= 0 && DATES[it].split(" ")[0] === DATES[labItem].split(" ")[0] && now - monthAt < 520) {
    if (!freezeT) freezeT = setTimeout(() => { freezeT = 0; kick(); }, 520 - (now - monthAt) + 1); return; }
  if (labItem >= 0 && DATES[it].split(" ")[0] !== DATES[labItem].split(" ")[0]) monthAt = now;
  const gap = now - lastRoll; lastRoll = now;
  if (gap > 260) rollDur = Math.min(520, rollDur + (gap - 260) * .232);    // 隔得久：往回长，约 1.4 s 回到 520 ms
  else rollDur = 260 + (rollDur - 260) * .6;                                 // 连续换字：每次向 260 ms 收 40%（按参考逐帧时长拟合）
  const dir = labItem < 0 ? 0 : Math.sign(it - labItem), [m, d] = DATES[it].split(" "), [pm, pd] = labItem < 0 ? ["", ""] : DATES[labItem].split(" ");
  const cur = outer.querySelector(":scope > .cur");
  if (m !== pm || !cur) { const f = face(m, d); sizeReels(f); roll(outer, f, dir); }
  else { const ds = d.split(""), ps = pd.split("");
    [1, 2].forEach(k => { const t = ds[k - 1] || "", pt = ps[k - 1] || ""; if (t !== pt) { const x = document.createElement("span"); x.textContent = t; roll(cur.children[k], x, dir); } });
    outer.style.width = widthOf(cur.cloneNode(true)) + "px"; }
  labItem = it;
}
const hotEl = document.createElement("div"); hotEl.className = "mk"; hotEl.style.opacity = 0; zone.append(hotEl);
const marks = [0, 1].map(() => { const d = document.createElement("div"); d.className = "mk"; zone.append(d); return d; });

/* ── 声音：40 ms 的咔声样本（高通白噪声 + 5.2 kHz / 7.4 kHz 两个衰减正弦），五种音色 ── */
const KINDS = { line: [1, 1, 1], month: [.88, 1.2, 1.1], travel: [1.08, .8, .5], fine: [1.5, .7, .55], close: [1.2, .85, .4] };
let ac = null, bufs = {}, lastAt = -1, busyTill = 0;
function makeClick(sr, pitch, decay) {
  const n = Math.round(sr * .04 * Math.max(1, decay)), out = new Float32Array(n);
  const w = 2 * Math.PI * 4000 * pitch / sr, cw = Math.cos(w), al = Math.sin(w) / 1.414;                    // 4 kHz 二阶高通
  const b0 = (1 + cw) / 2, b1 = -(1 + cw), b2 = b0, a0 = 1 + al, a1 = -2 * cw, a2 = 1 - al;
  let x1 = 0, x2 = 0, y1 = 0, y2 = 0, peak = 0;
  for (let i = 0; i < n; i++) {
    const t = i / sr, x = Math.random() * 2 - 1, y = (b0 * x + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2) / a0;
    x2 = x1; x1 = x; y2 = y1; y1 = y;
    let v = .5 * y * Math.exp(-t / (.25 * decay / 1000)) * 3;
    v += .6 * Math.sin(2 * Math.PI * 5200 * pitch * t) * Math.exp(-t / (.8 * decay / 1000));
    v += .4 * Math.sin(2 * Math.PI * 7400 * pitch * t) * Math.exp(-t / (.5 * decay / 1000));
    out[i] = v * Math.min(1, t / 1e-4); peak = Math.max(peak, Math.abs(out[i]));
  }
  const fade = Math.round(sr * .005); for (let k = 0; k < fade; k++) out[n - 1 - k] *= k / fade;
  for (let i = 0; i < n; i++) out[i] /= peak || 1;
  return out;
}
function audio() {
  if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; ac = new A();
    ac.addEventListener("statechange", () => { if (ac.state === "running" && pend && !pendT) { const k = pend; pend = null; click(k); } }); }   // 解锁后补放等着的那一声
  if (ac.state !== "running") ac.resume();
  return ac;
}
let pend = null, pendT = 0;
function click(kind) {
  const a = audio(); if (!a) return;
  if (a.state !== "running") { pend = kind; return; }                    // 声音还没解锁：记下最后一声，解锁后补放
  if (!bufs[kind]) { const [p, d] = KINDS[kind], s = makeClick(a.sampleRate, p, d), b = a.createBuffer(1, s.length, a.sampleRate); b.getChannelData(0).set(s); bufs[kind] = b; }
  if (kind !== "travel" && a.currentTime < lastAt + .06) {               // 60 ms 内又来一声：只留最新的一声，等空档再放（不排队）
    pend = kind; if (!pendT) pendT = setTimeout(() => { pendT = 0; const k = pend; pend = null; if (k) click(k); }, (lastAt + .06 - a.currentTime) * 1000 + 1); return;
  }
  const at = Math.max(a.currentTime, lastAt + .06); if (at - a.currentTime > .25) return;
  lastAt = at;
  const src = a.createBufferSource(); src.buffer = bufs[kind]; src.playbackRate.value = 1 + (Math.random() - .5) * .04;
  const g = a.createGain(); g.gain.value = .2 * KINDS[kind][2]; src.connect(g).connect(a.destination); src.start(at);
  (window.__clicks ||= []).push({ t: performance.now(), kind });
}
addEventListener("pointerdown", audio, { capture: true });

/* ── 物件条的运动：三次 Hermite 滑行（起点带当前速度，终点速度 0）。
   时长照参考实测：擦动 280 ms，逐个（键盘）380 ms，跳转 460 ms + 距离×0.08，限制在 520–950 ms ── */
const S = { x: 0 * PITCH, v: 0, free: false, g: null };
function glideAt(g, t) {
  const p = Math.min(1, Math.max(0, (t - g.t0) / g.dur)), p2 = p * p, p3 = p2 * p, m = g.v0 * g.dur;
  return { p, x: (2 * p3 - 3 * p2 + 1) * g.from + (p3 - 2 * p2 + p) * m + (3 * p2 - 2 * p3) * g.to,
           v: ((6 * p2 - 6 * p) * g.from + (3 * p2 - 4 * p + 1) * m + (6 * p - 6 * p2) * g.to) / g.dur };
}
const settled = () => !S.g;
let cur = 0;                                                            // 当前地点
function goTo(i, sound, mode = "jump") {
  i = Math.max(0, Math.min(N - 1, i)); if (i === cur && !S.free) return;
  const prevMonth = month[cur]; cur = i; S.free = false;
  const now = performance.now(), at = S.g ? glideAt(S.g, now) : { x: S.x, v: 0, p: 1 }, to = i * PITCH;
  const dur = mode === "scrub" ? 280 : mode === "step" ? 380 : Math.min(950, Math.max(520, 460 + Math.abs(to - at.x) * .08));
  S.g = { from: at.x, to, v0: at.p < 1 ? at.v : 0, t0: now, dur, mode };
  if (sound) click(month[i] !== prevMonth ? "month" : "line");
  kick();
}

place();
/* ── 刻度区：悬停放大、按住擦动、点击跳转 ── */
const H = { month: -1, inside: false, amt: 0, px: 0, zoom: 1, scrub: false, scrubAmt: 0, down: null, item: -1 };

renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.05, 60); camera.position.set(0, YC, 10);
const scene = new THREE.Scene();

/* 反射光贴图（同窗光页） */
const WX0 = -2.2, WX1 = 2.2, WY0 = -0.2, WY1 = 3.6, RES = 200;
function bounceTexture() {
  const cw = Math.round((WX1 - WX0) * RES / 4), ch = Math.round((WY1 - WY0) * RES / 4);
  const c = document.createElement("canvas"); c.width = cw; c.height = ch; const g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, cw, ch);
  const ce = Math.cos(EL * deg), se = Math.sin(EL * deg), ca = Math.cos(AZ * deg), sa = Math.sin(AZ * deg);
  const toPx = (x, y) => [(x - WX0) / (WX1 - WX0) * cw, (1 - (y - WY0) / (WY1 - WY0)) * ch];
  g.fillStyle = "#fff";
  for (const h of [...GOBO.holes, ...(GOBO.islands || []).map(i => ({ island: i }))]) {
    if (h.island) g.fillStyle = "#000";
    g.beginPath();
    (h.island || h).forEach(([z, y], i) => { const t = z / (ce * sa), X = -W + t * ce * ca, Y = y - t * se; const [px, py] = toPx(X, Y); i ? g.lineTo(px, py) : g.moveTo(px, py); });
    g.closePath(); g.fill();
  }
  g.filter = `blur(${BSIG * RES / 4}px)`; g.drawImage(c, 0, 0); g.filter = "none";
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.NoColorSpace; return tex;
}
function stucco() {
  const c = document.createElement("canvas"); c.width = c.height = 512; const g = c.getContext("2d"), img = g.createImageData(512, 512);
  let sd = 7; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647; const a = new Float32Array(512 * 512).map(rnd);
  for (let p = 0; p < 2; p++) { const t = a.slice(); for (let y = 0; y < 512; y++) for (let x = 0; x < 512; x++) { let v = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) v += t[((y + dy + 512) % 512) * 512 + ((x + dx + 512) % 512)]; a[y * 512 + x] = v / 9; } }
  for (let i = 0; i < a.length; i++) { const v = Math.max(0, Math.min(255, (a[i] - .5) * 900 + 128)); img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255; }
  g.putImageData(img, 0, 0); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(10, 8); return t;
}
const bounce = bounceTexture();
const wallMat = new THREE.MeshStandardMaterial({ color: WALL, roughness: 0.95, bumpMap: stucco(), bumpScale: 0.35, lightMap: bounce, lightMapIntensity: BOUNCE });
const wall = new THREE.Mesh(new THREE.PlaneGeometry(WX1 - WX0, WY1 - WY0), wallMat);
wall.position.set((WX0 + WX1) / 2, (WY0 + WY1) / 2, 0); wall.receiveShadow = true; scene.add(wall);

/* 左墙的窗：只投影（同窗光页，不缩放、不挪动） */
const gobo = new THREE.Group(); scene.add(gobo);
{
  const sh = new THREE.Shape(); sh.moveTo(-3, -5); sh.lineTo(GOBO.Z1, -5); sh.lineTo(GOBO.Z1, GOBO.Y1); sh.lineTo(-3, GOBO.Y1); sh.lineTo(-3, -5);
  for (const h of GOBO.holes) { const q = new THREE.Path(); q.moveTo(h[0][0], h[0][1]); for (const t of h.slice(1)) q.lineTo(t[0], t[1]); q.closePath(); sh.holes.push(q); }
  const mat = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false });
  const add = shape => { const m = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.03, bevelEnabled: false }), mat); m.rotation.y = -Math.PI / 2; m.position.set(-W, 0, 0); m.castShadow = true; gobo.add(m); };
  add(sh);
  for (const h of GOBO.islands || []) { const q = new THREE.Shape(); q.moveTo(h[0][0], h[0][1]); for (const t of h.slice(1)) q.lineTo(t[0], t[1]); q.closePath(); add(q); }
}

/* 光（同窗光页） */
const hemi = new THREE.HemisphereLight(new THREE.Color(T.sky).multiply(tint), new THREE.Color(T.ground).multiply(tint), SKY); scene.add(hemi);
const sun = new THREE.DirectionalLight(T.sun, SUN);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -2.6, right: 2.6, top: 2.6, bottom: -2.6, near: 1, far: 40 });
sun.shadow.bias = -0.0001; sun.shadow.normalBias = 0.0015;
sun.target.position.set(0, 1.5, 0); scene.add(sun, sun.target);
const sunAt = (az, el) => sun.position.set(-Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az)).multiplyScalar(14).add(sun.target.position);

/* 物件：各自缩放进 240 px 的格子，背面离墙 12 mm */
const objects = new THREE.Group(); scene.add(objects);
const slots = PAGES_3D.map(() => { const g = new THREE.Group(); objects.add(g); return g; });
const loader = new GLTFLoader();
const normals = g => toCreasedNormals(mergeVertices(g.clone().deleteAttribute("normal"), 1e-5), 35 * deg);   // LINTEX 导出的模型没有法线：补上（同窗光页）
const MODELS = {
  async t3() {                                                            // 同 radio.html：烘进节点变换，竖着的转成横的，哑白材质加淡淡的棱线
    const src = (await loader.loadAsync("../assets/radio/t3.glb")).scene; src.updateMatrixWorld(true);
    const sz = new THREE.Box3().setFromObject(src).getSize(new THREE.Vector3()), rot = sz.y > sz.x ? Math.PI / 2 : 0;
    const cream = new THREE.MeshStandardMaterial({ color: 0xedece5, roughness: .62, metalness: .02 });
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x5f5e59, transparent: true, opacity: .18, depthWrite: false });
    const g = new THREE.Group();
    src.traverse(o => { if (!o.isMesh) return; const geo = o.geometry.clone(); geo.applyMatrix4(o.matrixWorld); if (rot) geo.rotateZ(rot);
      const m = new THREE.Mesh(geo, cream); const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 55), edgeMat); e.renderOrder = 2; m.add(e); g.add(m); });
    return g;
  },
  async silk() {                                                          // 浅蓝哑光玻璃（材质同窗光页）
    const s = (await loader.loadAsync("../assets/objects/silk-wall-2000x1000.glb")).scene;
    const glass = new THREE.MeshPhysicalMaterial({ color: "#b6d0d2", roughness: 0.8, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.75, ior: 1.5 });
    s.traverse(o => { if (o.isMesh) { o.material = glass; o.geometry = normals(o.geometry); } }); return s;
  },
  // 以下三个是用户选的 Sketchfab 模型（CC BY 4.0，右下角署名）：原样放，不改材质；贴图已压到 2K WebP（assets/objects/）
  async loco() { return (await loader.loadAsync("../assets/objects/locomotive.glb")).scene; },          // 火车头：yanix「Locomotive」
  async boxes() { return (await loader.loadAsync("../assets/objects/postcard-boxes.glb")).scene; },    // 放明信片的盒子：Cozmoth「2 boxes」
  async shelf() { return (await loader.loadAsync("../assets/objects/wooden-shelf.glb")).scene; },     // 书架：Vilson Pistori「Wooden Shelf」
  async textile() {
    const s = (await loader.loadAsync("../assets/objects/textile-noticeboard-2005x1205.glb")).scene;
    const fabric = new THREE.MeshStandardMaterial({ color: "#C4BDB1", roughness: 0.95 });   // 导出模型里是深灰占位色；米灰面料色号未定，暂用 Oyster Shell
    s.traverse(o => { if (o.isMesh) { o.geometry = normals(o.geometry); o.material = fabric; } }); return s;
  },
};
let PXM = 1;                                                              // 每米多少 CSS 像素（随窗口宽度变）
/* 物件跟着切换条转（用户 2026-11-02：不要像贴纸）：像人走过一排实物，每个物件的转角 =
     基础角度 BASE + atan(物件离画面中心的距离 / 视距)，视距取"离开一格（PITCH_3D）时多转 PER 度"；再整体俯视 TILT 度。
   例：停在明信片盒子上 → 盒子转 BASE 度，右边的书架多转约 PER 度、露出左侧面，左边的火车头往反方向转、露出右侧面。
   物件绕自己的中心转（pivot），不绕墙面转，免得转进墙里。三个数可在地址里试：?base=18&per=30&tilt=8 */
const Q = new URLSearchParams(location.search);
const BASE = +(Q.get("base") ?? 18) * deg, PER = +(Q.get("per") ?? 30) * deg, TILT = +(Q.get("tilt") ?? 8) * deg;
function fitInto(group, obj) {
  const pivot = new THREE.Group(); group.userData.obj = obj; group.userData.pivot = pivot;
  const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  obj.userData.fit = { size, c, zmin: box.min.z, s0: obj.scale.x };
  obj.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  pivot.add(obj); group.add(pivot); sizeObjects(); render();
}
function sizeObjects() {                                                  // 窗口宽度变了，格子在世界里的大小也跟着变
  const fit = FIT_FRAC * 240 / PXM;
  slots.forEach(g => { const o = g.userData.obj; if (!o) return; const f = o.userData.fit, k = fit / Math.max(f.size.x, f.size.y);
    // 物件的中心放在 pivot 上；pivot 离墙 = 半个厚度 + 12 mm（不转时背面离墙 12 mm，和原来一样）
    o.scale.setScalar(f.s0 * k); o.position.set(-f.c.x * k, -f.c.y * k, -f.c.z * k);
    g.userData.pivot.position.set(0, 0, (f.c.z - f.zmin) * k + OFF_WALL); });
}
PAGES_3D.forEach((p, i) => {
  if (p.model && MODELS[p.model]) MODELS[p.model]().then(o => fitInto(slots[i], o)).catch(e => console.error(p.name, e));
  else fitInto(slots[i], new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.02), new THREE.MeshStandardMaterial({ color: "#dcdfe1", roughness: .9 })));   // 还没有模型：占位方块
});

/* ── 墙：48 个太阳方向累积（线性），另存一份"只有阳光"的累积，用来让物件的影子只扣掉阳光 ── */
const quad = mat => { const q = new THREE.Scene(); q.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat)); return q; };
const cam2 = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const VS = "varying vec2 v; void main(){ v = uv; gl_Position = vec4(position.xy, 0., 1.); }";
let rtPass, rtAcc, rtSun, rtVis;
const addMat = new THREE.ShaderMaterial({ uniforms: { t: { value: null }, w: { value: 1 } }, transparent: true, blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, toneMapped: false, vertexShader: VS,
  fragmentShader: "uniform sampler2D t; uniform float w; varying vec2 v; void main(){ gl_FragColor = vec4(texture2D(t, v).rgb * w, 1.); }" });
const outMat = new THREE.ShaderMaterial({ uniforms: { acc: { value: null }, sun: { value: null }, vis: { value: null } }, depthTest: false, depthWrite: false, toneMapped: true, vertexShader: VS,
  fragmentShader: `uniform sampler2D acc, sun, vis; varying vec2 v; void main(){
    vec3 c = texture2D(acc, v).rgb - texture2D(sun, v).rgb * (1. - texture2D(vis, v).r);
    gl_FragColor = vec4(max(c, vec3(0.)), 1.);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }` });
const addScene = quad(addMat), outScene = quad(outMat);
const visMat = new THREE.ShadowMaterial({ color: 0x000000, opacity: 1 });
function bakeWall() {                                                     // 只有墙、窗和光：物件不在场
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  [rtPass, rtAcc, rtSun, rtVis].forEach(r => r && r.dispose());
  rtPass = new THREE.WebGLRenderTarget(size.x, size.y, { type: THREE.HalfFloatType, samples: 4 });
  rtAcc = new THREE.WebGLRenderTarget(size.x, size.y, { type: THREE.HalfFloatType });
  rtSun = new THREE.WebGLRenderTarget(size.x, size.y, { type: THREE.HalfFloatType });
  rtVis = new THREE.WebGLRenderTarget(size.x, size.y, { type: THREE.HalfFloatType });
  outMat.uniforms.acc.value = rtAcc.texture; outMat.uniforms.sun.value = rtSun.texture; outMat.uniforms.vis.value = rtVis.texture; addMat.uniforms.t.value = rtPass.texture;
  objects.visible = false; const tm = renderer.toneMapping; renderer.toneMapping = THREE.NoToneMapping;
  for (const [rt, sunOnly] of [[rtAcc, false], [rtSun, true]]) {
    renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 1); renderer.clear();
    hemi.visible = !sunOnly; wallMat.lightMapIntensity = sunOnly ? 0 : BOUNCE;
    for (let i = 0; i < NDIR; i++) {
      const a = i * 2.39996, r = ANG * deg * Math.sqrt((i + 0.5) / NDIR);
      sunAt(AZ * deg + Math.cos(a) * r, EL * deg + Math.sin(a) * r); sun.shadow.needsUpdate = true;
      renderer.setRenderTarget(rtPass); renderer.render(scene, camera);
      addMat.uniforms.w.value = 1 / NDIR; renderer.autoClear = false; renderer.setRenderTarget(rt); renderer.render(addScene, cam2); renderer.autoClear = true;
    }
  }
  hemi.visible = true; wallMat.lightMapIntensity = BOUNCE; renderer.toneMapping = tm; objects.visible = true;
  sunAt(AZ * deg, EL * deg); renderer.setRenderTarget(null); wallReady = true;
}

/* ── 每帧：① 物件投在墙上的影子（只有物件投影，窗不投）→ rtVis；② 墙 = 累积 − 阳光 ×（1 − 可见度）；③ 物件（窗影照在物件上） ── */
let off = innerWidth / 2 - 120;
function render() {
  if (!wallReady) return;
  const top = parseFloat(getComputedStyle(document.getElementById("strip")).top) + 285 + 120;   // 物件区中心的页面 y
  const D = PITCH_3D / Math.tan(PER);                                      // 视距（CSS 像素）
  slots.forEach((g, i) => {
    const dx = off + i * PITCH_3D + 120 - innerWidth / 2;                  // 这个物件离画面中心多远（CSS 像素，右边为正）
    g.position.set(dx / PXM, YC - (top - innerHeight / 2) / PXM, 0);
    const pv = g.userData.pivot; if (pv) pv.rotation.set(TILT, BASE + Math.atan(dx / D), 0, "YXZ");
  });
  sunAt(AZ * deg, EL * deg); sun.shadow.needsUpdate = true;
  // ①
  gobo.visible = false; hemi.visible = false; scene.overrideMaterial = visMat;
  renderer.setRenderTarget(rtVis); renderer.setClearColor(0xffffff, 1); renderer.clear(); renderer.render(scene, camera);
  scene.overrideMaterial = null; gobo.visible = true; hemi.visible = true;
  // ②
  renderer.setRenderTarget(null); renderer.render(outScene, cam2);
  // ③
  wall.visible = false; renderer.autoClear = false; sun.shadow.needsUpdate = true; renderer.render(scene, camera); renderer.autoClear = true; wall.visible = true;
}
window.__scene3d = o => { off = o; render(); };
function layout() {
  const w = innerWidth, h = innerHeight; PXM = w / VIEW_W;
  renderer.setSize(w, h, false);
  Object.assign(camera, { left: -VIEW_W / 2, right: VIEW_W / 2, top: h / 2 / PXM, bottom: -h / 2 / PXM }); camera.updateProjectionMatrix();
  sizeObjects(); bakeWall(); render(); document.body.dataset.ready = "1";
}
let rz = 0; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(layout, 150); });
layout();
</script>

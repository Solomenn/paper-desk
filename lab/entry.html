  ZW += 2 * EXT * c; zone.style.width = ZW + "px"; zone.style.marginLeft = -ZW / 2 + "px";
  const total = c * (p.slots + 2 * EXT); let u = (ZW - total) / 2 - c / 2, R = 0;

  const ext = (month, left) => { for (let e = 0; e < EXT; e++) { const d = left ? EXT - 1 - e : e, sep = d % (PER_PAGE + 1) === 0; ticks.push({ x: u + c / 2, month, sep, ext: true }); if (sep) seps.push(u + c / 2); u += c; } };

    const r = p.ks[k];
    for (let e = 0; e < mo.n; e++) { Lpos[mo.a + e] = u + (e + .5) * r * c / mo.n; tickOf[mo.a + e] = R + Math.min(r - 1, Math.floor((e + .5) * r / mo.n)); }
    for (let e = 0; e < r; e++) ticks.push({ x: u + (e + .5) * c, month: k });

  layout.c = c;
}
layout();
const C = layout.c;
/* 刻度轴是一条连续的尺子（用户 2026-11-02：每根刻度都能选，长刻度也能）：每根刻度对应切换条的一个位置 pos。
   相邻两根（长、短都算）差 STEP = 格距 / (每页小刻度数 + 1)，即 400 / 10 = 40 px；每页中间那根小刻度 = 物件正中，
   长刻度 = 两个物件正中间。例：第 2 格的第 5 根（中间那根）→ pos 800；第 2、3 格之间的长刻度 → pos 1000。 */
const STEP = PITCH / (PER_PAGE + 1), MID = (PER_PAGE - 1) / 2;
const LEFT = layout.left;                                                 // 左头多出来的刻度根数：第一格的第一根小刻度是 ticks[LEFT]
ticks.forEach((t, s) => t.pos = (s - LEFT - MID) * STEP);
const tickX = pos => ticks[LEFT].x + (pos / STEP + MID) * C;
// 切换条能停的范围：最左那根刻度到最右那根（每根都能选，包括第一格左边、最后一格右边那几根）
const XMIN = ticks[0].pos, XMAX = ticks.at(-1).pos;
const curOf = x => Math.max(0, Math.min(N - 1, Math.round(x / PITCH)));   // 离位置 x 最近的物件                 // 切换条位置 → 尺子上的 x（黑色当前位置画在这里）
const nearTick = b => { let k = 0, bd = 1e9; ticks.forEach((t, j) => { const d = Math.abs(t.x - b); if (d < bd) { bd = d; k = j; } }); return k; };
/* 同一天的几个地点在擦动时合成一格：U = 不重复的日期，位置取这几个地点的平均 */
const U = []; DATES.forEach((d, i) => { if (U.length && U.at(-1).d === d) { U.at(-1).items.push(i); } else U.push({ d, items: [i] }); });
U.forEach(u => u.x = u.items.reduce((a, i) => a + Lpos[i], 0) / u.items.length);
const uOf = new Int32Array(N); U.forEach((u, k) => u.items.forEach(i => uOf[i] = k));
const nearU = x => { let b = 0, bd = 1e9; U.forEach((u, k) => { const d = Math.abs(u.x - x); if (d < bd) { bd = d; b = k; } }); return b; };
const tickEls = ticks.map(() => { const d = document.createElement("div"); d.className = "tk"; zone.append(d); return d; });
// 长刻度和小刻度一样用 .tk 画（在刻度列表里），不再单独画
const lab = document.createElement("div"); lab.id = "lab"; zone.append(lab);
/* 日期标签换字时像滚轮一样翻过去（照参考逐帧实测）：
   · 跨月：整个日期作为一块一起翻；同月：只翻变了的那一位数字（13→16 只翻个位），多出或少掉的一位宽度从 0 长出 / 缩回
   · 每次翻动：新字从 -64° 转到 0°、旧字从 0° 转到 64°，曲线和透明度是实测的 25 个关键帧；外面再叠 5 层竖向拉长的模糊残影
   · 宽度变化 520 ms cubic-bezier(.4,0,.2,1)；翻动时长 520 ms 起，连续快速换字时逐次缩短到 260 ms，停久了再慢慢回到 520 ms */
const ROLL = [0,.0039,.0173,.043,.0852,.1486,.2366,.3445,.4572,.5597,.6463,.7173,.7756,.8233,.8623,.8945,.9208,.9422,.9594,.973,.9833,.9909,.9961,.9991,1];
const OP_IN = [0,0,.002,.006,.015,.024,.024,.01,0,.023,.078,.153,.237,.323,.406,.485,.559,.628,.691,.749,.802,.852,.898,.943,1];
const OP_OUT = [1,.904,.806,.68,.519,.327,.14,.025,0,.016,.032,.038,.037,.032,.026,.02,.014,.01,.006,.003,.002,.001,0,0,0];
const GH_IN = [0,0,0,.002,.01,.033,.091,.193,.309,.396,.442,.454,.446,.424,.394,.361,.324,.287,.249,.211,.173,.135,.096,.055,0];
const GH_OUT = [0,.09,.168,.256,.356,.459,.527,.506,.4,.276,.179,.112,.069,.042,.025,.015,.008,.004,.002,.001,0,0,0,0,0];
const GHOSTS = [[.03, 0], [.0375, .286], [.045, .714], [.0525, 0], [.06, 0]];          // 每层残影的模糊量和权重（实测）
const tf = (deg, pre = "") => `${pre}perspective(3em) translateZ(-0.54em) rotateX(${deg}deg) translateZ(0.54em)`;
const kfs = (from, to, ops, pre) => ROLL.map((e, i) => ({ transform: tf(from + (to - from) * e, pre), opacity: ops[i] }));
const mkReel = () => { const r = document.createElement("span"); r.className = "reel"; return r; };
function face(m, d) {                                                     // 一个日期：[月份][十位][个位]，各是一个轮
  const f = document.createElement("span"); f.className = "face"; const ds = d.split("");
  [m + " ", ds[0] || "", ds[1] || ""].forEach(t => { const r = mkReel(), x = document.createElement("span"); x.className = "cur"; x.textContent = t; r.append(x); f.append(r); });
  return f;
}
const outer = mkReel(); lab.append(outer);
let labItem = -1, rollDur = 520, lastRoll = -1e9;
const widthOf = el => { const r = mkReel(); r.style.cssText = "position:absolute;visibility:hidden;transition:none"; r.append(el); lab.append(r); const w = el.getBoundingClientRect().width; r.remove(); return w; };

  if (!old || !dir) { if (old) old.remove(); return; }

    const g = document.createElement("span"); g.className = "gh"; g.setAttribute("aria-hidden", "true"); g.style.filter = `blur(${blur}em)`; g.style.opacity = wt;
    const a = nu.cloneNode(true), b = old.cloneNode(true); a.className = b.className = ""; a.getAnimations?.();  g.append(a, b); reel.append(g);
    a.animate(kfs(-64 * s, 0, GH_IN, "scaleY(0.428571) "), { ...o, fill: "forwards" });

let monthAt = -1e9, freezeT = 0;

  if (it === labItem) return;
  if (labItem >= 0 && DATES[it] === DATES[labItem]) { labItem = it; return; }   // 同一天的另一个地点：字不变，不算一次翻动
  const now = performance.now();

  if (labItem >= 0 && DATES[it].split(" ")[0] === DATES[labItem].split(" ")[0] && now - monthAt < 520) {
    if (!freezeT) freezeT = setTimeout(() => { freezeT = 0; kick(); }, 520 - (now - monthAt) + 1); return; }

  const gap = now - lastRoll; lastRoll = now;

  const dir = labItem < 0 ? 0 : Math.sign(it - labItem), [m, d] = DATES[it].split(" "), [pm, pd] = labItem < 0 ? ["", ""] : DATES[labItem].split(" ");

    ["强度", [["sun", "阳光", 0, 20, 0.1], ["sky", "天光", 0, 4, 0.05], ["bounce", "反射光", 0, 6, 0.05], ["glow", "高光溢出", 0, 1, 0.01], ["refl", "反光", 0, 3, 0.05], ["ao", "闭塞阴影", 0, 1, 0.01], ["aoObj", "物体自身闭塞", 0, 1.5, 0.01], ["floor", "地面反光", 0, 2, 0.05], ["env", "环境映像", 0, 1.5, 0.05], ["tau", "百叶透光", 0, 0.3, 0.01], ["bleed", "环境色", 0, 0.3, 0.005], ["haze", "光柱", 0, 0.5, 0.01], ["hazeD", "光柱厚度 m（0 自动）", 0, 1.6, 0.01], ["dust", "浮尘", 0, 2, 0.05]]],
    ["动态和胶片", [["live", "光的缓慢变化（0/1）", 0, 1, 1], ["leaves", "窗外树叶", 0, 1, 0.01], ["film", "胶片感", 0, 1, 0.01]]],
  ];
  const fmt = (v, st) => st >= 1 ? String(Math.round(v)) : v.toFixed(st < 0.01 ? 3 : 2);
  const inputs = {};
  box.innerHTML = GROUPS.map(([t, items]) => `<h4>${t}</h4>` + items.map(([k, name, lo, hi, st]) =>
    `<label>${name}<input type="range" data-k="${k}" min="${lo}" max="${hi}" step="${st}"><output data-o="${k}"></output></label>`).join("")).join("") +
    `<div class="row"><button data-act="save">保存</button><button data-act="copy">复制参数</button><button data-act="reset">恢复默认</button></div><div class="busy"></div>`;
  const busy = box.querySelector(".busy");
  const sync = () => { for (const [, items] of GROUPS) for (const [k, , , , st] of items) { const el = box.querySelector(`[data-k=${k}]`); el.value = L[k]; box.querySelector(`[data-o=${k}]`).textContent = fmt(L[k], st); } };
  const toUrl = () => {                                                   // 只把和默认值不同的写进地址栏
    const q = new URLSearchParams(location.search); for (const k in LIGHT_DEFAULT) { if (L[k] !== LIGHT_DEFAULT[k]) q.set(k, L[k]); else q.delete(k); }
    history.replaceState(null, "", location.pathname + "?" + q.toString());
  };
  let t = 0;
  const later = () => { clearTimeout(t); busy.textContent = "重算中…"; t = setTimeout(() => { applyLight(); toUrl(); busy.textContent = ""; }, 300); };
  box.addEventListener("input", e => { const k = e.target.dataset.k; if (!k) return; L[k] = +e.target.value; box.querySelector(`[data-o=${k}]`).textContent = fmt(L[k], +e.target.step); later(); });
  box.addEventListener("click", e => {
    const act = e.target.dataset.act; if (!act) return;
    if (act === "reset") { Object.assign(L, LIGHT_DEFAULT); try { localStorage.removeItem("paper-desk.light.v1"); } catch (e) {} sync(); later(); }
    if (act === "save") {                                                 // 存进这个浏览器：刷新、从别的页面回来都还在
      try { localStorage.setItem("paper-desk.light.v1", JSON.stringify(Object.fromEntries(Object.keys(LIGHT_DEFAULT).map(k => [k, L[k]])))); busy.textContent = "已保存（这个浏览器里）"; }
      catch (e) { busy.textContent = "这个浏览器不让保存，请用“复制参数”"; }
    }
    if (act === "copy") {
      const diff = Object.fromEntries(Object.keys(LIGHT_DEFAULT).map(k => [k, L[k]]));
      const text = JSON.stringify(diff);
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => busy.textContent = "已复制", () => { busy.textContent = text; });
    }
  });
  ["pointerdown", "pointermove", "wheel", "keydown"].forEach(ev => box.addEventListener(ev, e => e.stopPropagation()));   // 面板上的操作不传给切换条
  sync();
}

/* ── 浮尘（用户 2026-11-02："光中的浮尘，很漂亮的灰尘粒子"）──
   照着摄影里光束中浮尘的样子：
   · 只在光里看得见：每粒灰尘有离墙的深度 z，按它所在那片光的真实位置判断亮不亮（和光柱同一套：光片离墙每往前 1 m，
     在画面上错开 shift，所以 z 深的灰尘去墙上错开后的位置查亮区图）；飘出光片就消失，飘进去又亮。窗外（窗所在那面墙以外）不算。
   · 大小差别大：远处 110 粒很小的亮点、中间 30 粒清楚的亮点、近处 10 粒失焦的大光斑（半透明、边缘略亮）。
   · 会闪：翻滚时迎着光的那一下突然一亮（glint）。
   · 动得慢：没有方向的布朗漂移 + 一点往上的热气流 + 轻微打旋；近的看起来动得快（视差）。
   · 叠加方式是"变亮"：落在暗条前面清楚，落在亮墙前面不明显——和真实一样。
   数量和亮度 × dust（0 关）。系统要求减少动态效果时不画；页面切到后台时停。约 30 帧/秒。 */
{
  const cv = document.getElementById("dust"), g = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const mk = (kind, n, r0, r1, z0, z1) => Array.from({ length: n }, () => ({ kind, x: rnd(), y: rnd(), z: z0 + rnd() * (z1 - z0), r: r0 + rnd() * (r1 - r0),
    vx: 0, vy: 0, ph: rnd() * 6.28, sp: 0.4 + rnd() * 1.2, gp: rnd() * 6.28, gs: 0.3 + rnd() * 0.9, b: 0.5 + rnd() * 0.5 }));
  // 第一版太小太淡（半径不到 1 px），黑底上都几乎看不见（实测）：放大、加光晕、加数量
  const motes = [...mk("far", 160, 0.6, 1.2, 0.0, 0.25), ...mk("mid", 40, 1.2, 2.2, 0.05, 0.4), ...mk("near", 12, 8, 18, 0.6, 1.4)];
  let last = 0, kz = 0, kAt = -1e9;
  const slabK = () => {                                                   // 光片离墙每往前 1 m，在墙上对应的点往上挪多少（m）
    const tr = L.turn * deg, s3 = new THREE.Vector3(Math.sin(tr), 0, Math.cos(tr));
    const d = new THREE.Vector3(Math.cos(sunEl()) * Math.cos(sunAz()), -Math.sin(sunEl()), -Math.cos(sunEl()) * Math.sin(sunAz()));
    const n = s3.cross(d); return Math.abs(n.y) > 1e-4 ? n.z / n.y : 0;
  };
  const litAt = (x, y, z) => {                                            // x、y：屏幕像素；z：离墙多远（m）
    if (!DUST.px) return 0;
    const wx = (x - innerWidth / 2) / PXM; if (Math.tan(L.turn * deg) > 1e-3 && z > (wx + W) / Math.tan(L.turn * deg)) return 0;   // 窗外
    const yw = y + kz * z * PXM;                                          // 去墙上对应的那一点查（屏幕 y 向下）
    const i = Math.floor(x / 8), j = DUST.h - 1 - Math.floor(yw / 8);
    if (i < 0 || j < 0 || i >= DUST.w || j >= DUST.h) return 0;
    return DUST.px[(j * DUST.w + i) * 4] / 255;
  };
  const glow = (() => {                                                   // 远处、中间的灰尘：一个亮核 + 一圈柔和的光晕（画成 6 倍半径）
    const c = document.createElement("canvas"); c.width = c.height = 64; const q = c.getContext("2d"), gr = q.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.16, "rgba(255,255,255,.9)"); gr.addColorStop(0.3, "rgba(255,255,255,.25)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    q.fillStyle = gr; q.fillRect(0, 0, 64, 64); return c;
  })();
  const sprite = (() => {                                                 // 近处大光斑的样子：半透明、边缘略亮
    const c = document.createElement("canvas"); c.width = c.height = 64; const q = c.getContext("2d"), gr = q.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(255,255,255,.55)"); gr.addColorStop(0.75, "rgba(255,255,255,.6)"); gr.addColorStop(0.88, "rgba(255,255,255,.85)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    q.fillStyle = gr; q.fillRect(0, 0, 64, 64); return c;
  })();
  function frame(t) {
    requestAnimationFrame(frame);
    if (document.hidden || t - last < 33) return;
    const dt = Math.min(0.1, (t - last) / 1000); last = t;
    const w = innerWidth, h = innerHeight, dpr = Math.min(2, devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    if (still || !(L.dust > 0)) return;
    if (t - kAt > 500) { kz = slabK(); kAt = t; }
    g.globalCompositeOperation = "lighter";
    const ts = t / 1000, count = Math.min(1, L.dust);
    motes.forEach((m, k) => {
      if (k / motes.length > count) return;                               // dust < 1：少画一些
      const par = 1 + m.z * 1.5;                                          // 视差：近的动得快
      m.vx += (rnd() - 0.5) * 0.010 * dt; m.vy += (rnd() - 0.5) * 0.010 * dt - 0.0012 * dt;   // 布朗漂移 + 往上的热气流
      m.vx *= 0.985; m.vy *= 0.985;
      m.x += (m.vx + 0.0015 * Math.sin(ts * 0.21 + m.ph)) * dt * par; m.y += (m.vy + 0.0012 * Math.cos(ts * 0.17 + m.ph)) * dt * par;   // 轻微打旋
      if (m.y < -0.05) { m.y = 1.05; m.x = rnd(); } if (m.y > 1.05) m.y = -0.05; if (m.x > 1.05) m.x = -0.05; if (m.x < -0.05) m.x = 1.05;
      const x = m.x * w, y = m.y * h, lit = Math.min(1, litAt(x, y, m.z) * 3); if (lit < 0.15) return;   // 在光里就足够亮
      const tw = 0.6 + 0.4 * Math.sin(ts * m.sp + m.ph), glint = Math.pow(Math.max(0, Math.sin(ts * m.gs + m.gp)), 40) * 1.6;   // 闪：偶尔突然一亮
      const a = Math.min(1, lit * m.b * (tw + glint) * Math.max(0.6, L.dust));
      if (m.kind === "near") { g.globalAlpha = a * 0.22; g.drawImage(sprite, x - m.r, y - m.r, m.r * 2, m.r * 2); }
      else { const R = m.r * 3; g.globalAlpha = a * (m.kind === "mid" ? 0.95 : 0.8); g.drawImage(glow, x - R, y - R, R * 2, R * 2); }
    });
    g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
  }
  requestAnimationFrame(frame);
}

/* ── 光的缓慢变化（用户 2026-11-02："可以试试"）：live = 1 时 ──
   · 太阳：方位 ±0.35°（41 秒一个来回）、高度 ±0.2°（57 秒）慢慢漂，条纹跟着缓缓挪；
   · 百叶片：随风轻轻摆，±0.8° 和 ±0.4° 两个快慢叠在一起；
   · 树叶：两层各自晃（贴图位置来回挪），漏下来的圆光斑跟着闪动。
   每 70 ms 重算一次墙（约 14 次/秒）；页面切到后台、系统要求减少动态效果、live = 0 时停，回到不动的样子。 */
{
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let lastLive = 0, wasLive = false;
  function liveFrame(t) {
    requestAnimationFrame(liveFrame);
    const on = L.live && !still && !document.hidden && wallReady;
    if (!on) { if (wasLive) { Object.assign(ANIM, { az: 0, el: 0, sway: 0 }); gobo.children.forEach(m => { if (m.userData.slat && !m.userData.cord) m.rotation.x = -L.tilt * deg; }); bakeWall(); render(); wasLive = false; } return; }
    if (t - lastLive < 70) return; lastLive = t; wasLive = true;
    const s = t / 1000, TAU = 6.2832;
    ANIM.az = 0.35 * Math.sin(s / 41 * TAU); ANIM.el = 0.2 * Math.sin(s / 57 * TAU);
    ANIM.sway = 0.8 * Math.sin(s / 3.1 * TAU) + 0.4 * Math.sin(s / 1.7 * TAU + 1.3);
    gobo.children.forEach(m => { if (m.userData.slat && !m.userData.cord) m.rotation.x = -(L.tilt + ANIM.sway) * deg; });
    leafTex.forEach((tx, k) => tx.offset.set(0.004 * Math.sin(s * (0.9 + k * 0.4) + k) + 0.002 * Math.sin(s * 2.3 + k * 2), 0.003 * Math.sin(s * (0.7 + k * 0.3) + k * 3)));
    bakeWall(true); render();
  }
  requestAnimationFrame(liveFrame);
}

/* ── 胶片感（用户 2026-11-02，参考胶片那张：细颗粒、四角稍暗）──
   四角压暗：一层径向渐变；颗粒：4 张预先生成的 256×256 噪点图，每 80 ms 换一张、随机挪一点位置。
   强度 film（0 关）。系统要求减少动态效果时颗粒不动。 */
{
  const el = document.getElementById("film"), still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const tiles = Array.from({ length: 4 }, (_, k) => {
    const c = document.createElement("canvas"); c.width = c.height = 256; const q = c.getContext("2d"), im = q.createImageData(256, 256);
    let sd = 101 + k * 977; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 256 * 256; i++) { const v = 128 + (rnd() + rnd() + rnd() - 1.5) * 120; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
    q.putImageData(im, 0, 0); return `url(${c.toDataURL()})`;
  });
  let k = 0, lastG = 0;
  function grain(t) {
    requestAnimationFrame(grain);
    el.style.setProperty("--vig", Math.min(1, L.film * 1.4)); el.style.setProperty("--gr", L.film * 0.22);
    if (!(L.film > 0) || t - lastG < 80 || (still && lastG)) return; lastG = t;
    k = (k + 1) % tiles.length; el.style.setProperty("--grain", tiles[k]);
    el.style.setProperty("--gx", Math.round(Math.random() * 100) + "px"); el.style.setProperty("--gy", Math.round(Math.random() * 100) + "px");
  }
  requestAnimationFrame(grain);
}
</script>

<!DOCTYPE html>
<html lang="zh-CN" data-hashira="今日小票">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>纸桌 · 今日小票</title>
<style>
  :root{
    --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    --mono:"SF Mono","Cascadia Mono",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;background:radial-gradient(120% 90% at 12% 0%,rgba(255,250,236,.95),rgba(255,250,236,0) 60%),#e3e8eb;color:#1c232b;
    font-family:var(--sans);
    display:flex;flex-direction:column;align-items:center;
    padding:28px 16px 40px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .stage{margin-block:auto;display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
  #scene{
    position:relative;width:min(92vw,560px);
    overflow:visible;background:transparent;
  }
  #poster{display:block;width:100%;height:auto;touch-action:manipulation}
  .hint{margin:0;font-size:12.5px;letter-spacing:.04em;color:#4f5d69;text-align:center}
  .hint b{color:#1c232b;font-weight:600;letter-spacing:.08em}
  .hint kbd{
    font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:4px;
    border:1px solid rgba(54,66,78,.25);color:#4f5d69;
  }

  .scrim{
    position:fixed;inset:0;background:rgba(227,232,235,.5);backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:opacity .28s ease;z-index:20;
  }
  .scrim.on{opacity:1;pointer-events:auto}

  .panel{
    position:fixed;right:0;top:0;bottom:0;width:min(430px,100%);
    background:#f8f9f7;border-left:1px solid rgba(54,66,78,.14);
    transform:translateX(103%);transition:transform .34s cubic-bezier(.22,.8,.28,1);
    z-index:30;display:flex;flex-direction:column;
    box-shadow:-30px 0 60px -30px rgba(21,35,58,.35);
  }
  .panel.on{transform:none}
  .panel-head{
    padding:20px 22px 14px;border-bottom:1px solid rgba(54,66,78,.12);
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  }
  .panel-head .sub{font:500 10.5px var(--mono);letter-spacing:.28em;color:#8e9aa4;margin:0 0 6px}
  .panel-head h2{margin:0;font-size:19px;font-weight:600;letter-spacing:.02em;color:#1c232b;font-family:"Source Han Serif SC","Noto Serif SC","Songti SC",serif}
  .panel-head p{margin:6px 0 0;font-size:12px;color:#4f5d69;line-height:1.5}
  .icon-btn{
    flex:0 0 auto;width:32px;height:32px;border-radius:50%;
    border:1px solid rgba(54,66,78,.2);background:transparent;color:#4f5d69;
    font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center;
    transition:background .2s,border-color .2s;
  }
  .icon-btn:hover{background:rgba(54,66,78,.06);border-color:rgba(54,66,78,.3)}
  .panel-body{padding:18px 22px 26px;overflow-y:auto;flex:1;overscroll-behavior:contain}
  .field{display:block;margin:0 0 16px}
  .field>span{display:block;font-size:11px;letter-spacing:.06em;color:#4f5d69;margin:0 0 7px}
  .field input{
    width:100%;padding:11px 13px;border-radius:10px;
    border:1px solid rgba(54,66,78,.18);background:#ffffff;color:#1c232b;
    font:400 14px var(--sans);outline:none;transition:border-color .18s,background .18s;
  }
  .field input:focus{border-color:#2f4f73;background:#fff}
  .field input::placeholder{color:#a9b4bc}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .dots{display:flex;gap:10px;flex-wrap:wrap;padding-top:2px}
  .dot{
    width:32px;height:32px;border-radius:50%;border:0;cursor:pointer;position:relative;
    box-shadow:inset 0 0 0 1px rgba(60,40,20,.18);transition:transform .18s;padding:0;
  }
  .dot:hover{transform:translateY(-1px)}
  .dot.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid #1c232b}
  .sheet-sec{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
  .sheet-sec h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;color:#4f5d69}
  .chips{display:flex;gap:6px}
  .chip{
    border:1px solid rgba(54,66,78,.2);background:transparent;color:#4f5d69;
    font:500 11.5px var(--sans);padding:5px 10px;border-radius:999px;cursor:pointer;
    transition:all .18s;
  }
  .chip:hover{color:#2f4f73;border-color:rgba(47,79,115,.5)}
  .rows{display:flex;flex-direction:column;gap:8px}
  .row{
    display:grid;grid-template-columns:26px 84px 1fr 24px;gap:8px;align-items:center;
    background:#ffffff;border:1px solid rgba(54,66,78,.14);border-radius:11px;padding:8px 10px;
  }
  .check{
    width:20px;height:20px;border-radius:50%;border:1.5px solid #c2cbd2;background:transparent;
    cursor:pointer;position:relative;transition:all .18s;padding:0;
  }
  .check.on{background:#2f4f73;border-color:#2f4f73}
  .check.on::after{
    content:"";position:absolute;left:5px;top:4px;width:7px;height:10px;
    border-right:2px solid #f8f9f7;border-bottom:2px solid #f8f9f7;transform:rotate(38deg);
  }
  .time{display:flex;align-items:center;gap:2px;font:500 13px var(--mono);color:#4f5d69}
  .time input{
    width:30px;padding:4px 0;text-align:center;border-radius:6px;
    border:1px solid rgba(54,66,78,.16);background:#eef2f4;color:#1c232b;
    font:500 13px var(--mono);outline:none;
  }
  .time input:focus{border-color:#2f4f73}
  .row .name{
    width:100%;padding:6px 8px;border-radius:7px;border:1px solid transparent;
    background:transparent;color:#1c232b;font:400 13px var(--sans);outline:none;
  }
  .row .name:focus{background:#eef2f4;border-color:rgba(54,66,78,.16)}
  .del{width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:#8e9aa4;font-size:15px;cursor:pointer;line-height:1}
  .del:hover{background:rgba(47,79,115,.1);color:#2f4f73}
  .add{
    width:100%;margin-top:10px;padding:11px;border-radius:10px;cursor:pointer;
    border:1px dashed rgba(54,66,78,.28);background:transparent;color:#4f5d69;
    font:500 12.5px var(--sans);letter-spacing:.04em;transition:all .18s;
  }
  .add:hover{border-color:#2f4f73;color:#2f4f73}
  .panel-foot{display:flex;gap:10px;padding:14px 22px 20px;border-top:1px solid rgba(54,66,78,.12);background:#f8f9f7}
  .btn{
    flex:1;padding:12px;border-radius:10px;border:1px solid transparent;cursor:pointer;
    font:600 13px var(--sans);letter-spacing:.04em;transition:all .2s;text-align:center;
  }
  .btn.ghost{background:transparent;border-color:rgba(54,66,78,.22);color:#4f5d69}
  .btn.ghost:hover{color:#1c232b;border-color:rgba(54,66,78,.4)}
  .btn.primary{background:#1c232b;color:#f8f9f7}
  .btn.primary:hover{background:#2f4f73}

  .result{
    position:fixed;inset:0;display:none;place-items:center;padding:24px;z-index:40;
    background:rgba(227,232,235,.6);backdrop-filter:blur(6px);
  }
  .result.on{display:grid}
  .result-card{
    width:min(420px,92vw);max-height:92vh;display:flex;flex-direction:column;gap:14px;
    background:#f8f9f7;border:1px solid rgba(54,66,78,.14);border-radius:18px;
    padding:20px;box-shadow:0 40px 80px -30px rgba(21,35,58,.45);
  }
  .result-card h3{margin:0;font-size:16px;font-weight:600;color:#1c232b}
  .result-card p{margin:0;font-size:11.5px;color:#4f5d69;line-height:1.6}
  .shot{border-radius:10px;overflow:hidden;background:#e3e8eb;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  .shot img{display:block;max-width:100%;max-height:52vh;height:auto}
  .result-actions{display:flex;gap:10px}
  .result-actions .btn{text-decoration:none;display:block}

  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);
    background:#1c232b;color:#f8f9f7;padding:9px 18px;border-radius:999px;
    font:600 12.5px var(--sans);letter-spacing:.03em;
    opacity:0;pointer-events:none;transition:all .26s ease;z-index:60;white-space:nowrap;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:640px){
    body{padding:16px 12px 26px}
    .stage{gap:14px}
    #scene{border-radius:14px}
    .panel{
      left:0;right:0;top:auto;width:100%;height:auto;max-height:88vh;
      border-left:0;border-top:1px solid rgba(54,66,78,.14);
      border-radius:18px 18px 0 0;transform:translateY(103%);
      box-shadow:0 -30px 60px -20px rgba(21,35,58,.35);
    }
    .panel.on{transform:none}
    .panel-head{padding:14px 18px 10px}
    .panel-body{padding:14px 18px 20px}
    .panel-foot{padding:12px 18px calc(14px + env(safe-area-inset-bottom))}
    .hint{font-size:11.5px}
    .hint kbd{display:none}
  }
  @media (prefers-reduced-motion:reduce){.panel{transition:none}}
  .back{position:fixed;left:24px;top:22px;z-index:10;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
    background:rgba(248,249,247,.9);color:#4f5d69;text-decoration:none;font-size:16px;box-shadow:0 2px 6px rgba(21,35,58,.16);transition:color .2s,transform .2s}
  .back:hover{color:#2f4f73;transform:translateY(-2px)}
</style>

<script src="room.js"></script>

<a class="back" href="./" title="回到桌子">←</a>
<a class="back" href="album.html?kind=receipt" title="小票卡册" style="left:auto;right:24px;font-size:13px;letter-spacing:.1em;width:auto;padding:0 14px;border-radius:999px">卡册</a>

<div class="stage">
  <div id="scene"><canvas id="poster" aria-label="日程进度打印机海报"></canvas></div>
  <p class="hint">事项跟着今日台历走 · 点 <b>PRINT</b> 打印并导出，<b>EDIT</b> 改样式 <kbd>P</kbd> <kbd>E</kbd></p>
</div>

<div class="scrim" id="scrim"></div>

<aside class="panel" id="panel" aria-label="小票样式">
  <div class="panel-head">
    <div>
      <p class="sub">RECEIPT STYLE</p>
      <h2>小票样式</h2>
      <p>事项、日期和寄语都跟着左边的今日台历走；这里只改小票的样子。</p>
    </div>
    <button class="icon-btn" id="close-panel" aria-label="关闭">×</button>
  </div>
  <div class="panel-body">
    <label class="field">
      <span>小票店名</span>
      <input id="f-store" maxlength="10" placeholder="今天便利店">
    </label>
    <label class="field">
      <span>心情贴纸</span>
      <input id="f-mood" maxlength="4" placeholder="专注">
    </label>
    <div class="field">
      <span>导出氛围</span>
      <div class="dots" id="palette"></div>
    </div>
  </div>
  <div class="panel-foot">
    <button class="btn ghost" id="reset">恢复默认</button>
    <button class="btn primary" id="done">完成</button>

</aside>

<div class="result" id="result">
  <div class="result-card">
    <h3>海报已生成</h3>
    <p>手机可长按图片保存，电脑点「保存图片」下载 PNG。</p>
    <div class="shot"><img id="shot" alt="日程小票海报"></div>
    <div class="result-actions">
      <button class="btn ghost" id="close-result">关闭</button>
      <a class="btn primary" id="save" download>保存图片</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  /* ============================================================
     画布常量
     ============================================================ */
  const W = 1206;
  // a thermal printer prints: Noto Sans SC for the words, a monospace for the figures
  const SANS = '"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif';
  const MONO = 'ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans SC",monospace';

  // sasshi's inks: 墨 sumi, 鉄鼠 tetsu, 藍鼠 ainezu, 白鼠 shironezu, 藍 ai, 薄墨 usuzumi
  const INK = '#1c232b';
  const INK2 = '#36424e';
  const MUTED = '#4f5d69';
  const RULE = '#c2cbd2';
  const GREEN = '#2f4f73';
  const RED = '#8e9aa4';

  const BODY = { x: 98, y: 318, w: 1010, h: 468, r: 58 };
  const GRILLE = { x: 162, y: 440, w: 882, h: 190, r: 26 };
  const BTN_EDIT = { x: 596, y: 676, w: 186, h: 84, r: 22 };
  const BTN_PRINT = { x: 802, y: 676, w: 196, h: 84, r: 22 };
  const CAVITY = { x: 118, y: 786, w: 970, h: 30, r: 9 };
  const LIP = { x: 110, y: 806, w: 986, h: 56, r: 16 };
  const PAPER_TOP = 812;
  const PAPER_W = 824;

  const LED_G = { x: 1006, y: 386, r: 11 };
  const LED_R = { x: 1060, y: 386, r: 11 };

  const MAX_ITEMS = 8;
  const TOOTH_W = 38;
  const TOOTH_H = 22;

  const canvas = document.getElementById('poster');
  const ctx = canvas.getContext('2d');

  /* ============================================================
     小工具
     ============================================================ */
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;

  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0);
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function roundRect(c, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }
  function hexRGB(hex) {
    const n = parseInt(hex.slice(1), 16);
    return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`;
  }

  /* 带字距的截断（小票标题用） */
  function fitTracked(c, text, font, maxW, sp) {
    c.font = font;
    const w = str => {
      let total = 0;
      for (const ch of str) total += c.measureText(ch).width + sp;
      return total - sp;
    };
    if (w(text) <= maxW) return text;
    let out = text;
    while (out.length > 1 && w(out + '…') > maxW) out = out.slice(0, -1);
    return out + '…';
  }
  function fitText(c, text, font, maxW) {
    c.font = font;
    if (c.measureText(text).width <= maxW) return text;
    let s = text;
    while (s.length > 1 && c.measureText(s + '…').width > maxW) s = s.slice(0, -1);
    return s + '…';
  }
  /* 带字距的文字（中文小票的灵魂） */
  function tracked(c, text, x, y, font, color, sp, align) {
    c.font = font;
    c.fillStyle = color;
    const chars = Array.from(text);
    let total = 0;
    const widths = chars.map(ch => {
      const w = c.measureText(ch).width;
      total += w + sp;
      return w;
    });
    total -= sp;
    let cx = x;
    if (align === 'center') cx = x - total / 2;
    else if (align === 'right') cx = x - total;
    c.textAlign = 'left';
    c.textBaseline = 'alphabetic';
    for (let i = 0; i < chars.length; i++) {
      c.fillText(chars[i], cx, y);
      cx += widths[i] + sp;
    }
    return total;
  }

  /* ============================================================
     数据
     ============================================================ */
  const STORAGE = 'schedule-receipt.v3';
  const PALETTE = ['#2f4f73', '#4f7a5a', '#b5523b', '#8e9aa4', '#c9a24a', '#7d6b9e', '#5f8fa8'];

  const PRESETS = {
    desk: { label: '今天的桌子', items: [] },
    work: { label: '工作日', items: ['08:30|打开电脑 · 清一下收件箱', '09:30|深度工作 90 分钟', '12:00|午饭离开工位', '14:00|开会 / 同步进度', '16:30|收尾可交付的一件事', '21:30|写下明天第一件事'] },
    study: { label: '学习日', items: ['08:00|晨读 30 分钟', '10:00|专业课复习', '13:30|刷题一组', '16:00|整理错题', '20:00|背 50 个单词', '22:00|复盘今天'] },
    rest: { label: '周末', items: ['09:00|睡到自然醒', '11:00|逛超市买菜', '14:00|洗衣服 · 收拾房间', '17:00|出门散步', '19:00|看一部电影', '22:00|早点睡'] },
    fit: { label: '健身', items: ['07:00|空腹有氧 30 分钟', '08:00|早餐 · 高蛋白', '12:30|午休 20 分钟', '18:30|力量训练 60 分钟', '20:00|拉伸放松', '22:30|睡前泡脚'] }
  };

  function todayISO() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }
  // today from the desk: the small things on today's card, plus project cards stamped today
  function deskItems() {
    const get = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
    const list = get('paper-desk.today.v1'), proj = get('paper-desk.desk-tasks.v1');
    const p = n => String(n).padStart(2, '0');
    const hm = ts => { const t = new Date(ts || Date.now()); return `${p(t.getHours())}:${p(t.getMinutes())}`; };
    const today = todayISO();
    const isToday = ts => { if (!ts) return false; const t = new Date(ts); return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}` === today; };
    const rows = [];
    (Array.isArray(list) ? list : []).forEach(i => {
      if (!i || !i.text || !i.text.trim()) return;
      if (i.done && !isToday(i.doneAt)) return;
      rows.push({ sort: i.done ? i.doneAt : Number.MAX_SAFE_INTEGER, time: hm(i.done ? i.doneAt : i.addedAt), name: i.text.slice(0, 40), done: !!i.done });
    });
    ((proj && proj.done) || []).filter(t => isToday(t.doneAt)).forEach(t =>
      rows.push({ sort: t.doneAt, time: hm(t.doneAt), name: ('项目 · ' + (t.title || '')).slice(0, 40), done: true }));
    return rows.sort((a, b) => a.sort - b.sort).slice(0, MAX_ITEMS).map(({ time, name, done }) => ({ time, name, done }));
  }
  function presetItems(key) {
    if (key === 'desk') { const it = deskItems(); return it.length ? it : [{ time: '09:00', name: '今日卡上还没有事项', done: false }]; }
    return PRESETS[key].items.map((s, i) => {
      const [time, name] = s.split('|');
      return { time, name, done: i === 0 };
    });
  }
  function defaultState() {
    return {
      store: '今天便利店',
      date: todayISO(),
      mood: '专注',
      quote: '慢慢来，也比较快。',
      accent: PALETTE[0],
      items: presetItems('work')
    };
  }
  function normalize(raw) {
    const base = defaultState();
    if (!raw || typeof raw !== 'object') return base;
    const items = Array.isArray(raw.items) ? raw.items.slice(0, MAX_ITEMS).map(it => ({
      time: /^\d{1,2}:\d{2}$/.test(it && it.time) ? it.time : '09:00',
      name: String((it && it.name) || '写点东西').slice(0, 40),
      done: !!(it && it.done)
    })) : base.items;
    return {
      store: String(raw.store || base.store).slice(0, 10),
      date: /^\d{4}-\d{2}-\d{2}$/.test(raw.date) ? raw.date : base.date,
      mood: String(raw.mood || base.mood).slice(0, 4),
      quote: String(raw.quote || base.quote).slice(0, 18),
      accent: PALETTE.indexOf(raw.accent) >= 0 ? raw.accent : base.accent,
      items: items.length ? items : base.items
    };
  }
  function loadState() {
    try { return normalize(JSON.parse(localStorage.getItem(STORAGE))); }
    catch (e) { return defaultState(); }
  }
  let state = loadState();
  // what goes on the receipt is today's calendar: its items, today's date, the first line on its back
  function fromDesk() {
    const it = deskItems();
    state.items = it.length ? it : [{ time: '--:--', name: '台历上还没有事项', done: false }];
    state.date = todayISO();
    let m = null; try { m = JSON.parse(localStorage.getItem('paper-desk.todaymemo.v1')); } catch (e) { /* ignore */ }
    const d = new Date(), line = m && (m[`${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`] || '').split('\n').map(x => x.trim()).find(Boolean);
    state.quote = line ? line.slice(0, 18) : '慢慢来，也比较快。';
  }
  fromDesk();
  // the desk changed in another tab: follow it
  addEventListener('storage', e => {
    if (!/^paper-desk\.(today|todaymemo|desk-tasks)/.test(e.key || '')) return;
    fromDesk(); layout(); drawFrame();
  });
  function persist() {
    try { localStorage.setItem(STORAGE, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  /* ============================================================
     小票内容模型
     ============================================================ */
  function receiptModel(d) {
    const [Y, M, D] = d.date.split('-');
    const dt = new Date(d.date + 'T00:00:00');
    const wd = '日一二三四五六'[dt.getDay()];
    const h = hashStr(d.date + d.store);
    const no = `#${M}${D}-${String(1000 + h % 9000)}`;
    const code = `${M}${D}  ${Y}  ${String(1000 + (h >>> 3) % 9000)}`;
    const total = d.items.length;
    const done = d.items.filter(i => i.done).length;
    const pct = total ? Math.round(done / total * 100) : 0;
    return { Y, M, D, wd, no, code, total, done, left: total - done, pct };
  }

  function buildReceipt(d) {
    const m = receiptModel(d);
    const ops = [];
    const PW = PAPER_W;
    const MG = 46;
    const CW = PW - MG - 30;
    const cx = PW / 2;
    const TITLE = '#1c232b';
    const line = yy => ops.push({ t: 'dash', x: MG, y: yy, w: CW });

    /* 三颗星 */
    [-150, 0, 150].forEach(dx => ops.push({
      t: 'text', x: cx + dx, y: 108, s: '★', font: `400 30px ${SANS}`, color: '#8e9aa4', align: 'center'
    }));

    /* 店名 + 副标题 */
    ops.push({
      t: 'text', x: cx, y: 219, s: fitTracked(ctx, d.store, `600 76px ${SANS}`, CW - 6, 1),
      font: `600 76px ${SANS}`, color: TITLE, align: 'center', sp: 1
    });
    ops.push({
      t: 'text', x: cx, y: 283, s: "TODAY'S PROGRESS RECEIPT",
      font: `500 26px ${MONO}`, color: MUTED, align: 'center', sp: 6.4
    });
    line(344);

    /* DATE / WEEK / NO. / MOOD */
    const kvs = [
      ['DATE', `${m.Y}.${m.M}.${m.D}`],
      ['WEEK', `周${m.wd}`],
      ['NO.', m.no],
      ['MOOD', fitText(ctx, d.mood, `700 38px ${MONO}`, CW * .46)]
    ];
    kvs.forEach(([k, v], i) => {
      const y = 423 + i * 54;
      ops.push({ t: 'text', x: MG + 3, y, s: k, font: `600 30px ${MONO}`, color: MUTED, sp: 2 });
      ops.push({ t: 'text', x: MG + CW, y, s: v, font: `700 38px ${MONO}`, color: INK, align: 'right' });
    });
    line(650);

    /* 表头 */
    ops.push({ t: 'text', x: MG + 3, y: 729, s: 'TIME  ITEM', font: `500 33px ${MONO}`, color: MUTED, sp: 2 });
    ops.push({ t: 'text', x: MG + CW, y: 729, s: 'STATUS', font: `500 33px ${MONO}`, color: MUTED, align: 'right', sp: 2 });
    line(795);

    /* 事项 */
    d.items.forEach((it, i) => {
      const y = 889 + i * 78;
      ops.push({ t: 'text', x: MG, y, s: it.time, font: `500 37px ${MONO}`, color: '#4f5d69' });
      ops.push({
        t: 'text', x: MG + 145, y,
        s: fitText(ctx, it.name, `400 37px ${SANS}`, CW - 145 - 40),
        font: `400 37px ${SANS}`, color: INK
      });
      if (it.done) ops.push({ t: 'text', x: MG + CW, y, s: 'OK', font: `700 35px ${MONO}`, color: GREEN, align: 'right', sp: 1 });
      else ops.push({ t: 'text', x: MG + CW, y, s: '··', font: `700 34px ${MONO}`, color: RED, align: 'right', sp: 6 });
    });

    const n = Math.max(d.items.length, 1);
    const itemsEnd = 889 + (n - 1) * 78 + 74;

    /* 双虚线 + 汇总 */
    ops.push({ t: 'dash', x: MG, y: itemsEnd, w: CW, double: true });
    const sumY = itemsEnd + 83;
    [['DONE', m.done], ['LEFT', m.left], ['ITEMS', m.total]].forEach(([k, v], i) => {
      const y = sumY + i * 54;
      ops.push({ t: 'text', x: MG + 3, y, s: k, font: `600 30px ${MONO}`, color: MUTED, sp: 2 });
      ops.push({ t: 'text', x: MG + CW, y, s: String(v), font: `700 38px ${MONO}`, color: INK, align: 'right' });
    });

    /* PROGRESS */
    const progY = sumY + 188;
    ops.push({ t: 'text', x: MG + 3, y: progY, s: 'PROGRESS', font: `600 30px ${MONO}`, color: MUTED, sp: 2 });
    ops.push({ t: 'text', x: MG + CW, y: progY + 26, s: `${m.pct}%`, font: `700 52px ${MONO}`, color: INK, align: 'right' });
    ops.push({ t: 'segs', x: MG, y: progY + 67, w: CW, h: 30, pct: m.pct });
    ops.push({ t: 'mini', x: cx, y: progY + 126, w: 323, h: 34, pct: m.pct });

    const footY = progY + 216;
    line(footY);

    /* 寄语 / 尾注 */
    ops.push({
      t: 'text', x: cx, y: footY + 89, s: fitTracked(ctx, d.quote, `400 33px ${SANS}`, CW - 8, 1.5),
      font: `400 33px ${SANS}`, color: INK, align: 'center', sp: 1.5
    });
    ops.push({ t: 'text', x: cx, y: footY + 152, s: '谢谢惠顾 · 明天见', font: `400 27px ${SANS}`, color: INK2, align: 'center', sp: 3 });
    ops.push({ t: 'text', x: cx, y: footY + 202, s: '*  CUSTOMER COPY  *', font: `500 26px ${MONO}`, color: MUTED, align: 'center', sp: 8 });

    /* 条码 + 序号 */
    ops.push({ t: 'barcode', x: cx, y: footY + 243, w: 413, h: 117, seed: d.date + m.no + m.pct });
    ops.push({ t: 'text', x: cx, y: footY + 400, s: m.code, font: `500 27px ${MONO}`, color: MUTED, align: 'center', sp: 12 });

    return { ops, height: footY + 514 };
  }

  function paintPaperTexture(c, w, h) {
    c.fillStyle = '#f8f9f7';
    c.fillRect(0, 0, w, h);

    /* 热敏纸的细网点 */
    c.save();
    c.fillStyle = 'rgba(54,66,78,.05)';
    for (let y = 4; y < h; y += 7) {
      for (let x = 4; x < w; x += 7) {
        c.beginPath();
        c.arc(x + ((y / 7) % 2 ? 3.5 : 0), y, .9, 0, Math.PI * 2);
        c.fill();
      }
    }
    c.restore();

    /* 纸纤维 */
    c.save();
    c.globalAlpha = .05;
    const rnd = mulberry32(7);
    for (let i = 0; i < 260; i++) {
      c.strokeStyle = i % 2 ? '#8e9aa4' : '#ffffff';
      c.lineWidth = .7;
      const x = rnd() * w, y = rnd() * h, len = 6 + rnd() * 22, a = (rnd() - .5) * .5;
      c.beginPath();
      c.moveTo(x, y);
      c.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
      c.stroke();
    }
    c.restore();

    /* 左右边缘的阴影（纸的卷曲感） */
    const lg = c.createLinearGradient(0, 0, 26, 0);
    lg.addColorStop(0, 'rgba(21,35,58,.12)');
    lg.addColorStop(1, 'rgba(21,35,58,0)');
    c.fillStyle = lg; c.fillRect(0, 0, 26, h);
    const rg = c.createLinearGradient(w, 0, w - 26, 0);
    rg.addColorStop(0, 'rgba(21,35,58,.12)');
    rg.addColorStop(1, 'rgba(21,35,58,0)');
    c.fillStyle = rg; c.fillRect(w - 26, 0, 26, h);

    const tg = c.createLinearGradient(0, 0, 0, 40);
    tg.addColorStop(0, 'rgba(21,35,58,.12)');
    tg.addColorStop(1, 'rgba(21,35,58,0)');
    c.fillStyle = tg; c.fillRect(0, 0, w, 40);
  }

  function paintBarcode(c, o) {
    const rnd = mulberry32(hashStr(o.seed));
    let x = o.x - o.w / 2;
    const end = o.x + o.w / 2;
    c.fillStyle = '#1c232b';
    while (x < end - 2) {
      const wBar = 1.2 + Math.floor(rnd() * 3) * 1.35;
      const gap = 1.1 + Math.floor(rnd() * 3) * 1.1;
      if (x + wBar > end) break;
      if (rnd() > .06) c.fillRect(x, o.y, wBar, o.h);
      x += wBar + gap;
    }
  }

  function paintSegs(c, o) {
    const n = 24;
    const gap = 4;
    const sw = (o.w - gap * (n - 1)) / n;
    const filled = Math.round(o.pct / 100 * n);
    for (let i = 0; i < n; i++) {
      c.fillStyle = i < filled ? '#36424e' : '#dde3e7';
      roundRect(c, o.x + i * (sw + gap), o.y, sw, o.h, 3);
      c.fill();
    }
  }

  function paintMini(c, o) {
    const x = o.x - o.w / 2;
    const y = o.y;
    const pad = 13;
    const inner = o.w - pad * 2;
    const filled = Math.max(0, o.pct / 100 * inner);

    /* 轨道 */
    c.fillStyle = '#e3e8eb';
    c.fillRect(x + pad, y + 5, inner, o.h - 10);

    /* 点阵纹理 */
    c.fillStyle = 'rgba(79,93,105,.18)';
    for (let i = 0; i < inner; i += 6) {
      for (let j = 0; j < o.h - 12; j += 6) c.fillRect(x + pad + i, y + 7 + j, 2, 2);
    }

    /* 已填充 */
    if (filled > 0) {
      c.fillStyle = '#36424e';
      c.fillRect(x + pad, y + 5, filled, o.h - 10);
    }

    /* 方括号 */
    c.strokeStyle = '#8e9aa4';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(x + 9, y); c.lineTo(x, y); c.lineTo(x, y + o.h); c.lineTo(x + 9, y + o.h);
    c.moveTo(x + o.w - 9, y); c.lineTo(x + o.w, y); c.lineTo(x + o.w, y + o.h); c.lineTo(x + o.w - 9, y + o.h);
    c.stroke();
  }

  function paintDash(c, o) {
    c.save();
    c.strokeStyle = RULE;
    c.lineWidth = 1.7;
    c.setLineDash([9, 7]);
    c.beginPath();
    c.moveTo(o.x, o.y); c.lineTo(o.x + o.w, o.y);
    c.stroke();
    if (o.double) {
      c.beginPath();
      c.moveTo(o.x, o.y + 9); c.lineTo(o.x + o.w, o.y + 9);
      c.stroke();
    }
    c.restore();
  }

  function renderPaper(rec) {
    const cv = document.createElement('canvas');
    cv.width = PAPER_W;
    cv.height = Math.ceil(rec.height);
    const c = cv.getContext('2d');
    paintPaperTexture(c, PAPER_W, cv.height);

    for (const o of rec.ops) {
      switch (o.t) {
        case 'text':
          if (o.sp) tracked(c, o.s, o.x, o.y, o.font, o.color, o.sp, o.align);
          else {
            c.font = o.font;
            c.fillStyle = o.color;
            c.textAlign = o.align || 'left';
            c.textBaseline = 'alphabetic';
            c.fillText(o.s, o.x, o.y);
          }
          break;
        case 'dash': paintDash(c, o); break;
        case 'segs': paintSegs(c, o); break;
        case 'mini': paintMini(c, o); break;
        case 'barcode': paintBarcode(c, o); break;
      }
    }
    return cv;
  }

  /* ============================================================
     绘制：页面头部
     ============================================================ */
  function drawHeader() {
    const x = 96;
    /* 小圆点（氛围色）+ 小字 */
    ctx.beginPath();
    ctx.arc(x + 8, 105, 8, 0, Math.PI * 2);
    ctx.fillStyle = state.accent;
    ctx.fill();
    tracked(ctx, 'DAILY RECEIPT', x + 30, 112, `500 19px ${MONO}`, '#8e9aa4', 8, 'left');

    /* 标题 */
    const night = document.documentElement.dataset.theme === 'night';
    ctx.font = `600 76px ${SANS}`;
    ctx.fillStyle = night ? '#e6dcc8' : '#1c232b';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('今日小票', x, 194);

    /* 副标题 */
    ctx.font = `400 26px ${SANS}`;
    ctx.fillStyle = night ? 'rgba(230,220,200,.6)' : '#4f5d69';
    ctx.fillText('把今天的事打成一张热敏小票', x + 2, 238);
  }

  /* ============================================================
     绘制：打印机
     ============================================================ */
  function paintPrinter(c) {
    const bodyG = c.createLinearGradient(0, BODY.y, 0, BODY.y + BODY.h);
    bodyG.addColorStop(0, '#f8fafb');
    bodyG.addColorStop(.55, '#eef2f4');
    bodyG.addColorStop(1, '#dde3e8');
    c.save();
    c.shadowColor = 'rgba(21,35,58,.26)';
    c.shadowBlur = 60;
    c.shadowOffsetY = 26;
    roundRect(c, BODY.x, BODY.y, BODY.w, BODY.h, BODY.r);
    c.fillStyle = bodyG;
    c.fill();
    c.restore();

    /* 机身噪点 */
    c.save();
    roundRect(c, BODY.x, BODY.y, BODY.w, BODY.h, BODY.r);
    c.clip();
    const rnd = mulberry32(3);
    c.globalAlpha = .05;
    for (let i = 0; i < 1600; i++) {
      c.fillStyle = i % 2 ? '#6b7884' : '#ffffff';
      c.fillRect(BODY.x + rnd() * BODY.w, BODY.y + rnd() * BODY.h, 1.5, 1.5);
    }
    c.restore();

    /* 顶部高光 + 底部内阴影 */
    c.save();
    roundRect(c, BODY.x, BODY.y, BODY.w, BODY.h, BODY.r);
    c.clip();
    const hl = c.createLinearGradient(0, BODY.y, 0, BODY.y + 26);
    hl.addColorStop(0, 'rgba(255,255,255,.5)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = hl;
    c.fillRect(BODY.x, BODY.y, BODY.w, 26);
    const sh = c.createLinearGradient(0, BODY.y + BODY.h - 70, 0, BODY.y + BODY.h);
    sh.addColorStop(0, 'rgba(54,66,78,0)');
    sh.addColorStop(1, 'rgba(54,66,78,.16)');
    c.fillStyle = sh;
    c.fillRect(BODY.x, BODY.y + BODY.h - 70, BODY.w, 70);
    c.restore();

    /* 进纸窗（栅格） */
    c.save();
    roundRect(c, GRILLE.x, GRILLE.y, GRILLE.w, GRILLE.h, GRILLE.r);
    c.fillStyle = '#e4e9ec';
    c.fill();
    c.clip();
    const gSh = c.createLinearGradient(0, GRILLE.y, 0, GRILLE.y + GRILLE.h);
    gSh.addColorStop(0, 'rgba(54,66,78,.16)');
    gSh.addColorStop(.25, 'rgba(255,255,255,.20)');
    gSh.addColorStop(1, 'rgba(54,66,78,.08)');
    c.fillStyle = gSh;
    c.fillRect(GRILLE.x, GRILLE.y, GRILLE.w, GRILLE.h);
    for (let x = GRILLE.x + 8; x < GRILLE.x + GRILLE.w - 4; x += 9) {
      c.fillStyle = 'rgba(54,66,78,.20)';
      c.fillRect(x, GRILLE.y + 10, 1.6, GRILLE.h - 20);
      c.fillStyle = 'rgba(255,255,255,.35)';
      c.fillRect(x + 1.6, GRILLE.y + 10, 1.2, GRILLE.h - 20);
    }
    /* 两端斜纹 */
    c.save();
    c.beginPath();
    c.rect(GRILLE.x, GRILLE.y, 54, GRILLE.h);
    c.rect(GRILLE.x + GRILLE.w - 54, GRILLE.y, 54, GRILLE.h);
    c.clip();
    c.strokeStyle = 'rgba(54,66,78,.16)';
    c.lineWidth = 2;
    for (let i = -GRILLE.h; i < GRILLE.w; i += 8) {
      c.beginPath();
      c.moveTo(GRILLE.x + i, GRILLE.y + GRILLE.h);
      c.lineTo(GRILLE.x + i + GRILLE.h, GRILLE.y);
      c.stroke();
    }
    c.restore();
    /* 窗口内阴影 */
    c.strokeStyle = 'rgba(54,66,78,.22)';
    c.lineWidth = 3;
    roundRect(c, GRILLE.x + 1.5, GRILLE.y + 1.5, GRILLE.w - 3, GRILLE.h - 3, GRILLE.r - 1);
    c.stroke();
    c.restore();

    /* LIFE POS */
    tracked(c, 'LIFE POS', 160, 396, `600 30px ${MONO}`, '#36424e', 10, 'left');
    tracked(c, 'THERMAL 58mm', 162, 428, `400 16px ${MONO}`, '#8e9aa4', 3.4, 'left');

    /* 按钮 */
    paintButton(c, BTN_EDIT, '#36424e', '#4f5d69', 'EDIT');
    paintButton(c, BTN_PRINT, '#2f4f73', '#41648f', 'PRINT');

    /* 出纸口：暗腔 */
    c.save();
    roundRect(c, CAVITY.x, CAVITY.y, CAVITY.w, CAVITY.h, CAVITY.r);
    const cav = c.createLinearGradient(0, CAVITY.y, 0, CAVITY.y + CAVITY.h);
    cav.addColorStop(0, '#060505');
    cav.addColorStop(1, '#1a1714');
    c.fillStyle = cav;
    c.fill();
    c.clip();
    const cavHi = c.createLinearGradient(0, CAVITY.y + CAVITY.h - 8, 0, CAVITY.y + CAVITY.h);
    cavHi.addColorStop(0, 'rgba(230,236,240,0)');
    cavHi.addColorStop(1, 'rgba(230,236,240,.22)');
    c.fillStyle = cavHi;
    c.fillRect(CAVITY.x, CAVITY.y + CAVITY.h - 8, CAVITY.w, 8);
    c.restore();

    /* 金属压条 */
    c.save();
    c.shadowColor = 'rgba(21,35,58,.22)';
    c.shadowBlur = 26;
    c.shadowOffsetY = 10;
    const lipG = c.createLinearGradient(0, LIP.y, 0, LIP.y + LIP.h);
    lipG.addColorStop(0, '#f6f8f9');
    lipG.addColorStop(.35, '#e3e8eb');
    lipG.addColorStop(1, '#c2cbd2');
    roundRect(c, LIP.x, LIP.y, LIP.w, LIP.h, LIP.r);
    c.fillStyle = lipG;
    c.fill();
    c.restore();

    /* 压条两侧的小凸耳 */
    [[LIP.x - 4, LIP.y + 10], [LIP.x + LIP.w - 56, LIP.y + 10]].forEach(([x, y]) => {
      roundRect(c, x, y, 60, LIP.h - 22, 10);
      c.fillStyle = '#d8dfe4';
      c.fill();
      c.strokeStyle = 'rgba(54,66,78,.18)';
      c.lineWidth = 1;
      c.stroke();
    });

    /* 压条高光 */
    c.save();
    roundRect(c, LIP.x + 20, LIP.y + 3, LIP.w - 40, 8, 4);
    c.fillStyle = 'rgba(255,255,255,.55)';
    c.fill();
    c.restore();

    /* 压条下方投影（压在小票上） */
    const drop = c.createLinearGradient(0, LIP.y + LIP.h, 0, LIP.y + LIP.h + 26);
    drop.addColorStop(0, 'rgba(21,35,58,.24)');
    drop.addColorStop(1, 'rgba(21,35,58,0)');
    c.fillStyle = drop;
    c.fillRect(LIP.x + 30, LIP.y + LIP.h, LIP.w - 60, 26);
  }

  function paintButton(c, b, top, bottom, label) {
    c.save();
    c.shadowColor = 'rgba(21,35,58,.38)';
    c.shadowBlur = 18;
    c.shadowOffsetY = 7;
    const g = c.createLinearGradient(0, b.y, 0, b.y + b.h);
    g.addColorStop(0, bottom);
    g.addColorStop(.5, top);
    g.addColorStop(1, bottom);
    roundRect(c, b.x, b.y, b.w, b.h, b.r);
    c.fillStyle = g;
    c.fill();
    c.restore();

    roundRect(c, b.x + 2, b.y + 2, b.w - 4, b.h - 4, b.r - 2);
    const inner = c.createLinearGradient(0, b.y, 0, b.y + b.h);
    inner.addColorStop(0, 'rgba(255,255,255,.18)');
    inner.addColorStop(.4, 'rgba(255,255,255,0)');
    inner.addColorStop(1, 'rgba(0,0,0,.12)');
    c.fillStyle = inner;
    c.fill();

    tracked(c, label, b.x + b.w / 2, b.y + b.h / 2 + 9, `600 26px ${MONO}`, '#f8f9f7', 6, 'center');
  }

  function paintLED(c, x, y, r, color, on) {
    if (on) {
      const glow = c.createRadialGradient(x, y, 0, x, y, r * 4.5);
      glow.addColorStop(0, color.replace('1)', '.55)'));
      glow.addColorStop(.45, color.replace('1)', '.16)'));
      glow.addColorStop(1, color.replace('1)', '0)'));
      c.fillStyle = glow;
      c.beginPath(); c.arc(x, y, r * 4.5, 0, Math.PI * 2); c.fill();
    }
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    c.fillStyle = on ? color : 'rgba(54,66,78,.4)';
    c.fill();
    if (on) {
      const hl = c.createRadialGradient(x - r * .3, y - r * .35, 0, x, y, r);
      hl.addColorStop(0, 'rgba(255,255,255,.85)');
      hl.addColorStop(.5, 'rgba(255,255,255,.15)');
      hl.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = hl;
      c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    }
  }

  /* ============================================================
     绘制：背景
     ============================================================ */
  function renderBG(H) {
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const c = cv.getContext('2d');

    /* 朝霧：和桌面同一种颜色 */
    c.fillStyle = '#e3e8eb';
    c.fillRect(0, 0, W, H);

    /* 右上角斜照进来的一块光 */
    c.save();
    const lit = c.createLinearGradient(W * .25, 0, W, H * .55);
    lit.addColorStop(0, 'rgba(255,255,255,0)');
    lit.addColorStop(.35, 'rgba(255,255,255,.55)');
    lit.addColorStop(1, 'rgba(255,255,255,.2)');
    c.fillStyle = lit;
    c.beginPath();
    c.moveTo(W * .38, 0); c.lineTo(W, 0); c.lineTo(W, H * .7); c.lineTo(W * .1, H);
    c.lineTo(0, H); c.lineTo(0, H * .92);
    c.closePath();
    c.filter = 'blur(28px)';
    c.fill();
    c.restore();

    /* 氛围色光晕（跟着色点变） */
    const ac = hexRGB(state.accent);
    c.save();
    c.globalAlpha = .22;
    c.translate(W / 2, 520);
    c.scale(1, 1.1);
    const ag = c.createRadialGradient(0, 0, 60, 0, 0, 780);
    ag.addColorStop(0, `rgba(${ac},.30)`);
    ag.addColorStop(.5, `rgba(${ac},.10)`);
    ag.addColorStop(1, `rgba(${ac},0)`);
    c.fillStyle = ag;
    c.fillRect(-1200, -1700, W + 2400, H + 3400);
    c.restore();

    /* 离窗远的一角落进阴影 */
    const fall = c.createRadialGradient(W * .96, 0, 0, W * .96, 0, Math.max(W, H) * 1.3);
    fall.addColorStop(.42, 'rgba(196,207,217,0)');
    fall.addColorStop(1, 'rgba(196,207,217,.4)');
    c.fillStyle = fall;
    c.fillRect(0, 0, W, H);

    /* 纸面颗粒 */
    const rnd = mulberry32(11);
    c.globalAlpha = .03;
    for (let i = 0; i < 9000; i++) {
      c.fillStyle = rnd() > .5 ? '#fff' : '#1c232b';
      c.fillRect(rnd() * W, rnd() * H, 1.4, 1.4);
    }
    c.globalAlpha = 1;

    return cv;
  }

  /* ============================================================
     纸的形状（顶部圆角 + 底部锯齿撕边）
     ============================================================ */
  function paperPath(c, top, height) {
    const x = (W - PAPER_W) / 2;
    const bottom = top + height;
    const r = 5;
    c.beginPath();
    c.moveTo(x + r, top);
    c.lineTo(x + PAPER_W - r, top);
    c.quadraticCurveTo(x + PAPER_W, top, x + PAPER_W, top + r);
    c.lineTo(x + PAPER_W, bottom - TOOTH_H);
    const n = Math.floor(PAPER_W / TOOTH_W);
    const step = PAPER_W / n;
    for (let i = n; i > 0; i--) {
      const x0 = x + i * step;
      c.lineTo(x0 - step / 2, bottom);
      c.lineTo(x0 - step, bottom - TOOTH_H);
    }
    c.lineTo(x, top + r);
    c.quadraticCurveTo(x, top, x + r, top);
    c.closePath();
  }

  /* ============================================================
     场景
     ============================================================ */
  let rec = null;
  let layers = { bg: null, paper: null, printer: null };
  let H = 0;
  let printerBox = { x: 0, y: 0 };

  function layout() {
    rec = buildReceipt(state);
    H = Math.ceil(PAPER_TOP + rec.height + 148);
    canvas.width = W;
    canvas.height = H;

    layers.bg = renderBG(H);
    layers.paper = renderPaper(rec);

    const box = { x: 30, y: 240, w: W - 60, h: 700 };
    const pc = document.createElement('canvas');
    pc.width = box.w; pc.height = box.h;
    const pctx = pc.getContext('2d');
    pctx.translate(-box.x, -box.y);
    paintPrinter(pctx);
    layers.printer = pc;
    printerBox = box;
  }

  /* 打印机震动（步进感，不是平滑正弦） */
  const shake = { x: 0, y: 0, r: 0, next: 0 };

  function currentShake(now, intensity) {
    if (now > shake.next) {
      shake.next = now + 52 + Math.random() * 34;
      shake.x = (Math.random() - .5) * 3.4 * intensity;
      shake.y = (Math.random() - .5) * 2.4 * intensity;
      shake.r = (Math.random() - .5) * .0022 * intensity;
    }
    return shake;
  }

  /* 热气 */
  const puffs = [];
  let lastSpawn = 0;
  function spawnPuff() {
    const left = (W - PAPER_W) / 2;
    const right = left + PAPER_W;
    const zone = Math.random();
    let x;
    if (zone < .34) x = left - 26 - Math.random() * 46;
    else if (zone < .68) x = right + 26 + Math.random() * 46;
    else x = left + 30 + Math.random() * (PAPER_W - 60);
    puffs.push({
      x,
      y: PAPER_TOP + 54 + Math.random() * 70,
      r: 26 + Math.random() * 34,
      vy: -52 - Math.random() * 46,
      vx: (Math.random() - .5) * 26,
      life: 0,
      max: 900 + Math.random() * 600
    });
  }
  function paintPuffs(c) {
    for (const p of puffs) {
      const k = p.life / p.max;
      const a = Math.sin(Math.PI * clamp(k, 0, 1)) * .18;
      if (a <= 0) continue;
      const g = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, `rgba(255,250,240,${a})`);
      g.addColorStop(1, 'rgba(255,250,240,0)');
      c.fillStyle = g;
      c.beginPath();
      c.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      c.fill();
    }
  }

  /* 动画状态 */
  const DUR = 4600;
  const print = { t0: 0, active: false, last: 0, timer: 0 };

  function drawFrame() {
    const t = performance.now();
    const dt = print.last ? Math.min(t - print.last, 60) : 16;
    print.last = t;

    let prog = print.printed ? 1 : 0;
    if (print.active) {
      prog = clamp((t - print.t0) / DUR, 0, 1);
      prog = easeInOutSine(prog);
    }
    const printing = print.active;
    const ph = rec.height * prog;

    for (let i = puffs.length - 1; i >= 0; i--) {
      const p = puffs[i];
      p.life += dt;
      p.y += p.vy * dt / 1000;
      p.x += p.vx * dt / 1000;
      p.r += 8 * dt / 1000;
      if (p.life > p.max) puffs.splice(i, 1);
    }
    if (printing) {
      lastSpawn += dt;
      if (lastSpawn > 90) { lastSpawn = 0; spawnPuff(); }
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (exporting) ctx.drawImage(layers.bg, 0, 0);
    drawHeader();

    const settle = printing ? 1 : (prog > .92 ? (1 - prog) / .08 : 0);
    const sh = currentShake(t, settle);

    ctx.save();
    ctx.translate(W / 2, 640);
    ctx.rotate(sh.r);
    ctx.translate(-W / 2, -640);
    ctx.translate(sh.x, sh.y);

    /* 小票 */
    if (ph > 2) {
      ctx.save();
      paperPath(ctx, PAPER_TOP, ph);
      ctx.clip();
      const py = PAPER_TOP + ph - rec.height;
      ctx.drawImage(layers.paper, (W - PAPER_W) / 2, py);
      /* 撕边内侧阴影 */
      const inner = ctx.createLinearGradient(0, PAPER_TOP + ph - 34, 0, PAPER_TOP + ph);
      inner.addColorStop(0, 'rgba(21,35,58,0)');
      inner.addColorStop(1, 'rgba(21,35,58,.10)');
      ctx.fillStyle = inner;
      ctx.fillRect((W - PAPER_W) / 2, PAPER_TOP + ph - 34, PAPER_W, 34);
      ctx.restore();
    }

    /* 打印机 */
    ctx.drawImage(layers.printer, printerBox.x, printerBox.y);

    /* 指示灯 */
    const blinkOn = printing ? ((Math.floor(t / 210) % 2) === 0) : false;
    paintLED(ctx, LED_G.x, LED_G.y, LED_G.r, 'rgba(90,190,120,1)', true);
    paintLED(ctx, LED_R.x, LED_R.y, LED_R.r, 'rgba(226,96,78,1)', blinkOn);

    /* 热气 */
    paintPuffs(ctx);

    ctx.restore();
  }

  function loop() {
    drawFrame();
    requestAnimationFrame(loop);
  }

  /* ============================================================
     打印 / 导出
     ============================================================ */
  function startPrint(onDone) {
    if (print.active) return false;
    window.Sound && Sound.play("zip", { vol: .5, rate: .8 });
    fromDesk(); layout();
    puffs.length = 0;
    lastSpawn = 0;
    print.active = true;
    print.t0 = performance.now();
    clearTimeout(print.timer);
    print.timer = setTimeout(() => {
      print.active = false;
      print.printed = true;
      window.Sound && Sound.play("paperRustle", { vol: .6 });
      drawFrame();
      if (onDone) setTimeout(onDone, 420);
    }, DUR + 40);
    return true;
  }

  function printAndSave() {
    if (print.active) {
      toast('正在打印…');
      return;
    }
    startPrint(openResult);
    toast('正在打印今天的小票…', 1400);
  }

  let exporting = false;
  function exportDataURL() {
    const prev = print.active;
    print.active = false;
    puffs.length = 0;
    exporting = true;
    const was = print.printed; print.printed = true;
    drawFrame();
    print.printed = was;
    const url = canvas.toDataURL('image/png');
    exporting = false;
    print.active = prev;
    drawFrame();
    return url;
  }

  // keep a copy in the receipt album: one per day, the latest print wins
  function keepReceipt() {
    try {
      // just the paper: from under the printer's lip to its torn edge
      const src = canvas, sx = (W - PAPER_W) / 2 - 16, sy = PAPER_TOP + 50, sw = PAPER_W + 32, sh = Math.min(src.height - sy, rec.height - 40);
      const k = 380 / sw, c = document.createElement('canvas');
      c.width = 380; c.height = Math.round(sh * k);
      const g = c.getContext('2d'); g.fillStyle = '#e3e8eb'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
      const m = receiptModel(state), RK = 'paper-desk.receipts.v1';
      let list = []; try { list = JSON.parse(localStorage.getItem(RK)) || []; } catch (e) { /* ignore */ }
      list = list.filter(r => r.date !== state.date);
      list.push({ date: state.date, at: Date.now(), img: c.toDataURL('image/jpeg', .82), store: state.store, done: m.done, total: m.total, pct: m.pct });
      while (list.length) { try { localStorage.setItem(RK, JSON.stringify(list)); break; } catch (e) { list.shift(); } }   // full: drop the oldest
      return true;
    } catch (e) { return false; }
  }
  function openResult() {
    const url = exportDataURL();
    exporting = true; { const was = print.printed; print.printed = true; drawFrame(); print.printed = was; }
    if (keepReceipt()) toast('已收进小票卡册');
    exporting = false; drawFrame();
    shot.src = url;
    const m = receiptModel(state);
    save.download = `schedule-receipt-${state.date}-${m.pct}.png`;
    save.href = url;
    result.classList.add('on');
  }
  function hideResult() { result.classList.remove('on'); }

  /* ============================================================
     面板
     ============================================================ */
  const panel = document.getElementById('panel');
  const scrim = document.getElementById('scrim');
  const paletteEl = document.getElementById('palette');
  const fStore = document.getElementById('f-store');
  const fMood = document.getElementById('f-mood');

  function renderPalette() {
    paletteEl.innerHTML = '';
    PALETTE.forEach(color => {
      const b = document.createElement('button');
      b.className = 'dot' + (state.accent === color ? ' on' : '');
      b.type = 'button';
      b.style.background = color;
      b.setAttribute('aria-label', '氛围色 ' + color);
      b.addEventListener('click', () => {
        state.accent = color;
        renderPalette();
        scheduleSheetUpdate();
      });
      paletteEl.appendChild(b);
    });
  }

  function syncForm() {
    fStore.value = state.store;
    fMood.value = state.mood;
    renderPalette();
  }

  let sheetTimer = 0;
  function scheduleSheetUpdate() {
    clearTimeout(sheetTimer);
    sheetTimer = setTimeout(() => {
      layout();
      drawFrame();
      persist();
    }, 160);
  }

  function bindText(el, key, fallback) {
    el.addEventListener('input', () => {
      if (!el.value.trim()) return;
      state[key] = el.value;
      scheduleSheetUpdate();
    });
    el.addEventListener('blur', () => {
      if (!el.value.trim()) {
        el.value = fallback;
        state[key] = fallback;
        scheduleSheetUpdate();
      }
    });
  }
  bindText(fStore, 'store', '今天便利店');
  bindText(fMood, 'mood', '专注');

  document.getElementById('reset').addEventListener('click', () => {
    state = defaultState();
    fromDesk();
    syncForm();
    layout();
    drawFrame();
    persist();
    toast('已恢复默认');
  });

  document.getElementById('done').addEventListener('click', () => {
    closePanel();
    layout(); drawFrame(); persist();
  });

  function openPanel() {
    panel.classList.add('on');
    scrim.classList.add('on');
    syncForm();
    if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
      setTimeout(() => fStore.focus(), 360);
    }
  }
  function closePanel() {
    panel.classList.remove('on');
    scrim.classList.remove('on');
  }

  /* ============================================================
     画布交互
     ============================================================ */
  function toCanvas(ev) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left) / r.width * canvas.width,
      y: (ev.clientY - r.top) / r.height * canvas.height
    };
  }
  function hit(p, b) {
    return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
  }
  let hoverBtn = null;

  canvas.addEventListener('pointermove', ev => {
    const p = toCanvas(ev);
    const h = hit(p, BTN_EDIT) ? 'edit' : hit(p, BTN_PRINT) ? 'print' : null;
    if (h !== hoverBtn) {
      hoverBtn = h;
      canvas.style.cursor = h ? 'pointer' : 'default';
    }
  });
  canvas.addEventListener('pointerleave', () => {
    hoverBtn = null;
    canvas.style.cursor = 'default';
  });
  canvas.addEventListener('click', ev => {
    const p = toCanvas(ev);
    if (hit(p, BTN_EDIT)) openPanel();
    else if (hit(p, BTN_PRINT)) printAndSave();
  });

  /* ============================================================
     toast / 弹窗
     ============================================================ */
  const toastEl = document.getElementById('toast');
  let toastTimer = 0;
  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('on'), ms || 1600);
  }

  const result = document.getElementById('result');
  const shot = document.getElementById('shot');
  const save = document.getElementById('save');
  document.getElementById('close-panel').addEventListener('click', closePanel);
  save.addEventListener('click', () => toast('已开始下载 PNG'));
  document.getElementById('close-result').addEventListener('click', hideResult);
  result.addEventListener('click', ev => { if (ev.target === result) hideResult(); });
  scrim.addEventListener('click', closePanel);

  /* ============================================================
     启动
     ============================================================ */
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { hideResult(); closePanel(); }
    const tag = (ev.target && ev.target.tagName) || '';
    if (/INPUT|TEXTAREA/.test(tag)) return;
    if (result.classList.contains('on')) return;
    if (ev.key === 'e' || ev.key === 'E') openPanel();
    if (ev.key === 'p' || ev.key === 'P') printAndSave();
  });

  // the receipt is drawn on a canvas: wait (a little) for the handwriting face before printing
  const fontsIn = Promise.race([
    Promise.all(['400 26px "Noto Sans SC"', '500 38px "Noto Sans SC"'].map(f => document.fonts.load(f))),
    new Promise(r => setTimeout(r, 2500)),
  ]).catch(() => {});
  fontsIn.then(() => {
    layout();
    drawFrame();
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>

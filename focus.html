<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雪国线 · 纸桌</title>
<link rel="stylesheet" href="fonts-slices.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="fonts.css">
<noscript><link rel="stylesheet" href="fonts-slices.css"></noscript>
<link rel="preload" as="image" href="assets/snow-day.webp" fetchpriority="high">
<style>
  :root { /* the same type as every other page (room.css): print for labels, handwriting only for what you write */
    --hand: "LXGW WenKai", "霞鹜文楷", "LXGW WenKai Screen", "Klee One", "KaiTi", "STKaiti", serif;
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", serif;
    --sans: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; --ai: #2f4f73; --ease: cubic-bezier(.22, 1, .36, 1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070d18; font-family: var(--sans); color: #e8eef5; user-select: none; -webkit-user-select: none; }
  body { line-break: strict; }

  /* ═════════ 上车：打开这一页就上车（2026-11-03 起；上车前那张信纸拆去了 letter.html）：雪景照片上车票升起来、打孔，然后进车厢 ═════════ */
  #board { position: fixed; inset: 0; z-index: 5; overflow: hidden; transition: opacity .9s, transform 1.2s var(--ease); background: #191c19; }
  #board.gone { opacity: 0; transform: scale(1.03); pointer-events: none; }
  #board .scenery { position: fixed; inset: 0; z-index: 0; }
  #board .scene { position: absolute; inset: -1px; background: url(assets/tyl/snow-background.webp) center / cover no-repeat; }   /* 黑夜：雪夜山湖（暂借听雨来信的） */
  html[data-theme="day"] #board .scene { background-image: url(assets/snow-day.webp); }                                          /* 白天：白天的雪林 */
  #board .scene-shade { position: absolute; inset: 0; background: linear-gradient(#0c131930, #10171442 60%, #0a110f77); }
  html[data-theme="day"] #board .scene-shade { background: linear-gradient(#ffffff10, #dfe8f020 60%, #33404a40); }
  /* 大小照听雨来信在浏览器 75% 时的样子（同 letter.html）：车票、到站框、角上的按钮按 0.75 画；窗口窄于 700 px 不缩 */
  @media (min-width: 700px) { .home, #dayBtn, #car #off, #car #sndT, #car #radioT, #tkSlot, #arrive .box { zoom: .75; } }
  #tkStage { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; pointer-events: none; opacity: 0; transform: translateY(26px); transition: opacity .7s, transform .9s var(--ease); }
  #board.sent #tkStage { opacity: 1; transform: none; }
  /* 返回箭头：左上角 */
  .home { position: fixed; left: 22px; top: 20px; z-index: 30; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #d7d9c6; text-decoration: none; font-size: 20px; transition: background .2s; }
  .home:hover { background: #bfc8b315; }
  /* ═════════ the ticket: ticket.js (after sasshi's admission ticket) ═════════ */
  #tkSlot .tkt { --tw: min(560px, 88vw); }

  /* ═════════ the carriage: photographic fallback while the 3D scene loads ═════════ */
  #car { position: fixed; inset: 0; opacity: 0; transition: opacity 1.6s;
    background: linear-gradient(180deg, rgba(6, 11, 20, .22), rgba(6, 11, 20, .32)), url(assets/snow-day.webp) center / cover no-repeat; }
  #car.on { opacity: 1; }
  html[data-theme="day"] #car {
    background-image: linear-gradient(180deg, rgba(255,255,255,.04), rgba(15,30,45,.14)), url(assets/snow-day.webp);
  }

  /* the line along the bottom of the carriage */
  #line { position: absolute; left: 12vw; right: 12vw; bottom: 4.6vh; height: 40px; }
  #line .track { position: absolute; left: 0; right: 0; top: 13px; height: 2px; background: rgba(232, 217, 168, .25); }
  #line .done { position: absolute; left: 0; top: 13px; height: 2px; background: #e8d9a8; }
  #line .st { position: absolute; top: 9px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #1d1611; box-shadow: inset 0 0 0 2px rgba(232,217,168,.45); }
  #line .st.past { box-shadow: inset 0 0 0 2px #e8d9a8; background: #e8d9a8; }
  #line .st i { text-shadow: 0 1px 4px rgba(0,0,0,.9); position: absolute; left: 50%; top: 16px; transform: translateX(-50%); font-style: normal; font-size: 12px; color: rgba(232,217,168,.55); white-space: nowrap; letter-spacing: .15em; }
  #line .st.past i { color: #e8d9a8; }
  #line .tr { position: absolute; top: 4px; width: 22px; height: 10px; margin-left: -11px; border-radius: 5px 7px 3px 3px; background: #f1e6c4; box-shadow: 0 0 12px rgba(255, 230, 170, .6); transition: left 1s linear; }
  #line .tr::after { content: ""; position: absolute; right: -3px; top: 3px; width: 3px; height: 3px; border-radius: 50%; background: #fff6d8; }
  /* the time: only when you look for it */
  #hud { position: absolute; left: 50%; top: 2.6vh; transform: translateX(-50%); font-size: 13px; letter-spacing: .4em; color: rgba(232, 217, 168, .0); transition: color .4s; white-space: nowrap; }
  #car:hover #hud, #hud.show { color: rgba(232, 217, 168, .8); }
  #off { position: absolute; right: 2.4vw; top: 2.2vh; border: 0; background: none; font: 13px var(--hand); letter-spacing: .3em; color: rgba(232, 217, 168, .0); cursor: pointer; transition: color .4s; }
  #car:hover #off { color: rgba(232, 217, 168, .55); }
  #off:hover { color: #e8d9a8 !important; }
  #sndT { position: absolute; left: 76px; top: 2.2vh; border: 0; background: none; font: 13px var(--hand); letter-spacing: .3em; color: rgba(232, 217, 168, .0); cursor: pointer; transition: color .4s; }
  #car:hover #sndT { color: rgba(232, 217, 168, .55); }

  #line .st i em { display: block; margin-top: 2px; font-style: normal; font-size: 10px; letter-spacing: .05em; opacity: .7; text-align: center; }
  #line .st, #line .done { transition: left .8s var(--ease), width .3s linear; }
  #line .tr b { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); font-weight: 400; font-size: 12px; letter-spacing: .1em; color: #f1e6c4; white-space: nowrap; }
  #hudName { outline: none; cursor: text; border-bottom: 1px dashed transparent; }
  #hudName:hover, #hudName:focus { border-bottom-color: rgba(232,217,168,.4); }
  #hudName:empty::before { content: "这一程在做什么？"; color: rgba(232,217,168,.45); }
  #car:has(#hudName:empty) #hud, #car:has(#hudName:focus) #hud { color: rgba(232, 217, 168, .8); }
  #line .st i.hid { visibility: hidden; }

  /* the ride's controls: white frosted glass over the picture, quiet type (after sasshi.zezn.dev's folio nav and tips):
     blur 12 + saturate, a hairline ring, a soft drop; ink #1c232b, one accent #2f4f73 */
  #car { --glass: rgba(246, 248, 249, .74); --ink2: #1c232b; --mute2: #5d6873; --acc: #2f4f73;
    --ring: 0 0 0 .5px rgba(21, 35, 58, .16), inset 0 1px 0 rgba(255, 255, 255, .9), inset 0 -1px 0 rgba(21, 35, 58, .05), 0 10px 26px -14px rgba(21, 35, 58, .45); }
  #car #hud, #car #off, #car #sndT, #car #radioT, #car #line::before { background: var(--glass); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: var(--ring); }
  #car #hudName { display: none; }
  body:has(#car.on) .home { opacity: 0; transition: opacity .3s; }
  body:has(#car.on:hover) .home, body:has(#car.on) .home:hover { opacity: .92; }
  body:has(#car.on) .home { top: 2.2vh; width: 36px; height: 36px; color: #5d6873; background: rgba(246, 248, 249, .74) !important;
    -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4);
    box-shadow: 0 0 0 .5px rgba(21, 35, 58, .16), inset 0 1px 0 rgba(255, 255, 255, .9), 0 10px 26px -14px rgba(21, 35, 58, .45); }
  #car #hud { top: calc(2.2vh + 12px); padding: 0; border-radius: 0; background: none !important; box-shadow: none !important; -webkit-backdrop-filter: none; backdrop-filter: none; z-index: 2; font: 400 12.5px/1 var(--sans); letter-spacing: .06em; color: var(--mute2) !important;
    font-variant-numeric: tabular-nums; opacity: .92; transition: opacity .3s; }
  #car #hud:hover { opacity: 1; }
  #car #hudName { font: 500 13.5px/1 var(--serif); letter-spacing: .04em; color: var(--ink2); border-bottom: 0; margin-right: 4px; }
  #car #hudName:empty::before { color: var(--mute2); font-weight: 400; }
  #car #off, #car #sndT, #car #radioT { top: 2.2vh; width: 36px; height: 36px; padding: 0; display: grid; place-items: center; border-radius: 50%; color: var(--mute2) !important; opacity: .0; transition: opacity .3s, color .2s; }
  #car #radioT { position: absolute; left: 130px; border: 0; cursor: pointer; }   /* 收音机：排在声音按钮右边（原来没定位，叠在返回箭头上） */
  #car:hover #off, #car:hover #sndT, #car:hover #radioT { opacity: .92; }
  #car #off:hover, #car #sndT:hover, #car #radioT:hover { color: var(--ink2) !important; opacity: 1; }
  /* the line: a long glass slip along the bottom, a hairline track, small dots, names in quiet type */
  /* the line sits at the top, in one glass slip with the words above it */
  #car #line { top: calc(2.2vh + 38px); bottom: auto; left: 18vw; right: 18vw; }
  #car #line::before { content: ""; position: absolute; inset: -38px -24px -14px; border-radius: 14px; }
  #car #line .tr b { display: none; }
  #car #line .track { top: 13px; height: 1px; background: rgba(28, 35, 43, .16); }
  #car #line .done { top: 13px; height: 1px; background: var(--acc); }
  #car #line .track::after { content: ""; position: absolute; left: 0; right: 0; top: -3px; height: 7px;   /* a fine tick every km */
    background: repeating-linear-gradient(90deg, rgba(28, 35, 43, .26) 0 1px, transparent 1px calc(100% / var(--km, 10))); }
  #car #line .st { top: 10px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: #f6f8f9; box-shadow: inset 0 0 0 1px rgba(28, 35, 43, .35); }
  #car #line .st.past { background: var(--acc); box-shadow: none; }
  #car #line .st i { top: 18px; font: 400 12px/1.4 var(--sans); letter-spacing: .1em; color: var(--mute2); text-shadow: none; }
  #car #line .st.past i { color: var(--ink2); }
  #car #line .tr { top: 8.5px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 2.5px #fff, 0 2px 6px rgba(21, 35, 58, .35); }
  #car #line .tr::after { display: none; }
  #car #line .tr b { bottom: 14px; font: 500 11.5px/1 var(--sans); letter-spacing: .04em; color: var(--acc); font-variant-numeric: tabular-nums; text-shadow: none; }

  /* ═════════ arriving: the ticket comes back with the station's stamp ═════════ */
  #arrive { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(5, 9, 16, .72); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .8s; }
  #arrive.on { opacity: 1; pointer-events: auto; }
  #arrive .box { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  #arrive p { margin: 0; font-size: 15px; letter-spacing: .3em; color: #c9d5e3; }
  #arrive .btns { display: flex; gap: 14px; }
  #arrive a, #arrive button { border: 0; border-radius: 999px; padding: 9px 22px; font: 14px var(--hand); letter-spacing: .3em; text-decoration: none; cursor: pointer;
    color: #13213a; background: #e8d9a8; }
  #arrive .ghost { color: #c9d5e3; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  @media (prefers-reduced-motion: reduce) { #board, #car { transition: none; } }

  #dayBtn { position: fixed; right: 18px; bottom: 18px; z-index: 50; width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
    background: #1d221ecc; color: #e6e2c8; box-shadow: 0 0 0 1px #d8d2a838, 0 6px 18px #0006; backdrop-filter: blur(6px); }
  #dayBtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
  #dayBtn .moon, html[data-theme="day"] #dayBtn .sun { display: none; } html[data-theme="day"] #dayBtn .moon { display: block; }
  html[data-theme="day"] #dayBtn { background: #eef2f6dd; color: #2f3a48; box-shadow: 0 0 0 1px #2f3a4822, 0 6px 18px #0002; }
</style>
<script src="preload.js" defer></script>
<script src="radio-shell.js" defer></script>

<body>
<a class="home" href="index.html#board" title="回到首页">←</a>
<!-- 上车：车票升起来、打孔 -->
<section id="board">
  <div class="scenery" aria-hidden="true"><div class="scene"></div><div class="scene-shade"></div></div>
  <div id="tkStage"><div id="tkSlot"></div></div>
</section>

<!-- the carriage -->
<section id="car">
  <div id="line"><i class="track"></i><i class="done"></i></div>
  <div id="hud"><span id="hudName" contenteditable="plaintext-only" spellcheck="false"></span><span id="hudRest"></span></div>
  <button id="sndT" title="车轮声"></button>
  <button id="radioT" data-radio-open title="白噪音收音机" aria-label="白噪音收音机"><svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="8" width="23" height="16" rx="2.4"/><g fill="currentColor" stroke="none"><circle cx="8.5" cy="12" r=".75"/><circle cx="11.5" cy="12" r=".75"/><circle cx="8.5" cy="15" r=".75"/><circle cx="11.5" cy="15" r=".75"/><circle cx="8.5" cy="18" r=".75"/><circle cx="11.5" cy="18" r=".75"/><circle cx="8.5" cy="21" r=".75"/><circle cx="11.5" cy="21" r=".75"/></g><circle cx="21" cy="16" r="4.4"/><circle cx="21" cy="16" r="1.05"/></svg></button>
  <button id="off" title="中途下车"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4H6.5A1.5 1.5 0 0 0 5 5.5v13A1.5 1.5 0 0 0 6.5 20H13"/><path d="M10 12h10M16.5 8.5 20 12l-3.5 3.5"/></svg></button>
</section>

<!-- arriving -->
<section id="arrive"><div class="box"><div id="slot"></div><p id="arrMsg"></p><div class="btns"><a href="index.html#board">回到首页</a><button class="ghost" id="again">再坐一程</button><a class="ghost" href="binder/?kind=ticket">车票卡册</a></div></div></section>

<script src="sound.js?v=2"></script>
<script src="ticket.js"></script>
<script>
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  const get = (k, fb) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch { return fb; } };
  const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const pad = n => String(n).padStart(2, "0");
  const hm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const TRIP = "paper-desk.trip.v1", TICKETS = "paper-desk.tickets.v1";
  // day or night, as on the desk (D switches it here too): a snowy day ride, or the night train
  // 白天 / 黑夜的切换只在这一页（用户 2026-11-03："把黑夜页面的车票加回来，可以切换黑夜白天的 UI 加回来——仅仅车票页面"）；
  // 其他页面仍然只有白天。记在这一页自己的键里，不影响别的页面
  const THEME = "paper-desk.focus.theme.v1";
  let DAY = get(THEME, "day") !== "night";
  document.documentElement.dataset.theme = DAY ? "day" : "night";
  addEventListener("keydown", e => { if ((e.key === "d" || e.key === "D") && !e.metaKey && !e.ctrlKey && !e.altKey && !e.target.closest("input, textarea, [contenteditable]")) toggleDay(); });
  function toggleDay() {
    DAY = !DAY; put(THEME, DAY ? "day" : "night"); document.documentElement.dataset.theme = DAY ? "day" : "night";
    dispatchEvent(new Event("deskTheme"));
  }
  const dayBtn = document.createElement("button"); dayBtn.id = "dayBtn"; dayBtn.title = "白天 / 夜晚（D）";
  dayBtn.innerHTML = `<svg viewBox="0 0 24 24" class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg viewBox="0 0 24 24" class="moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>`;
  dayBtn.onclick = toggleDay; document.body.appendChild(dayBtn);
  // the 雪国线: made-up stations through snow country, one every 5 km; the train runs at 60 km/h, so one every 5 minutes
  const STATIONS = ["白川口", "雪见", "霜原", "静川", "松风", "月岭", "冬木", "鹿鸣", "灯台寺", "银山", "汤泽", "风花", "星野", "寒川", "北原", "青柳", "苇原", "雾桥", "白桦", "新雪", "长冬", "野泽", "石打", "雪国"];
  const KM = 5;
  const LINE = "雪国线";

  /* ───────── 这一程叫什么：现在没有地方写（信纸拆走了），名字空着；坐车时也不显示。和"在做"的项目同名时坐的分钟记到项目上（以后有地方写名字时再用） ───────── */
  const tasks = [];
  ((get("paper-desk.desk-tasks.v1", {}) || {}).projects || []).filter(p => p.col === "doing" && (p.title || "").trim()).forEach(p => tasks.push({ name: p.title, proj: p.id }));
  const RIDES = [5, 15, 25, 45, 60, 90];
  // 行程长短：还原期间没有刻度尺，用上次选的（没选过：先坐一站，坐到自己下车为止）
  let minutes = RIDES.includes(get("paper-desk.trip.min", 5)) ? get("paper-desk.trip.min", 5) : 5;
  const tripName = () => "";
  const pickOf = name => tasks.find(t => t.name === name) || null;
  // where today's trains start, and the stations of a trip: 先坐一站 shows just the next one (the ride goes on as long as you like)
  const OFF = (new Date().getDate() * 5) % STATIONS.length;
  const nameAt = (off, k) => STATIONS[(off + k) % STATIONS.length];
  const stopsFor = m => Array.from({ length: (m === 5 ? 1 : m / KM) + 1 }, (_, k) => nameAt(OFF, k));
  const seatFor = () => { const r = Math.floor(Math.random() * 1e9); return `${1 + r % 8} 号车 ${1 + (r >> 3) % 16}${"ABCD"[(r >> 7) % 4]}`; };
  let seat = seatFor(), no = String(1000 + Math.floor(Math.random() * 9000));
  $("#tkSlot").innerHTML = Ticket.html({ minutes, stops: stopsFor(minutes), seat, no });
  const TK = $("#tkSlot .tkt"); Ticket.physics(TK);
  const fillTicket = (tk, t) => Ticket.fill(tk, Object.assign({ no, seat }, t));
  function draw() { fillTicket(TK, { name: tripName(), minutes, open: minutes === 5, stops: stopsFor(minutes), seat, no }); }
  const BD = $("#board");
  let ac2 = null;
  // 站过站时"咔"一声（坐车时用）
  function tickSound(heavy) {
    try {
      ac2 = ac2 || new (window.AudioContext || window.webkitAudioContext)(); if (!wheelsOn) return;
      const t0 = ac2.currentTime, n = Math.floor(ac2.sampleRate * .012), b = ac2.createBuffer(1, n, ac2.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (n * .18));
      const o = ac2.createBufferSource(), f = ac2.createBiquadFilter(), g = ac2.createGain(); o.buffer = b; f.type = "highpass"; f.frequency.value = heavy ? 1800 : 3200;
      g.gain.value = heavy ? .16 : .07; o.connect(f).connect(g).connect(ac2.destination); o.start(t0);
      if (heavy) { const s = ac2.createOscillator(), sg2 = ac2.createGain(); s.frequency.setValueAtTime(190, t0); s.frequency.exponentialRampToValueAtTime(90, t0 + .06);
        sg2.gain.setValueAtTime(.12, t0); sg2.gain.exponentialRampToValueAtTime(.001, t0 + .08); s.connect(sg2).connect(ac2.destination); s.start(t0); s.stop(t0 + .09); }
    } catch {}
  }

  /* 上车前那张信纸（照听雨来信做的）2026-11-03 拆出去单独成页（letter.html，入口页"来信"那一格）；这一页打开就上车（用户选的："火车那格直接进坐车，以后再做候车画面"）。 */

  /* Train motion state; the visible carriage is rendered exclusively by carriage.js. */
  let world = 0, speed = 0, target = 0;

  /* ───────── the sound of the wheels: rumble (filtered noise) and the joints of the rails ───────── */
  let ac = null, rumble = null, wheelsOn = get("paper-desk.trip.wheels", true), clackT = 0;
  function audio() {
    if (ac || !wheelsOn) return;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const n = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate), d = n.getChannelData(0); let last = 0;
      for (let i = 0; i < d.length; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
      const src = ac.createBufferSource(); src.buffer = n; src.loop = true;
      const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 260;
      const g = ac.createGain(); g.gain.value = 0;
      src.connect(lp).connect(g).connect(ac.destination); src.start();
      rumble = { g, lp };
    } catch { ac = null; }
  }
  function clack(strength) {
    if (!ac || !wheelsOn) return;
    [0, .09].forEach((dl, k) => {
      const o = ac.createBufferSource(), b = ac.createBuffer(1, ac.sampleRate * .08, ac.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * .012));
      o.buffer = b; const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 900 - k * 300; f.Q.value = 1.4;
      const g = ac.createGain(); g.gain.value = .22 * strength; o.connect(f).connect(g).connect(ac.destination); o.start(ac.currentTime + dl);
    });
  }
  function chime() {
    if (!ac) return;
    [659, 523, 587, 392].forEach((fq, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + i * .42;
      o.type = "sine"; o.frequency.value = fq; g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.12, t0 + .03); g.gain.exponentialRampToValueAtTime(.0001, t0 + 1.4);
      o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + 1.5);
    });
  }
  $("#sndT").onclick = () => { wheelsOn = !wheelsOn; put("paper-desk.trip.wheels", wheelsOn); wheelsIcon(); if (wheelsOn) audio(); if (rumble) rumble.g.gain.value = 0; };
  const wheelsIcon = () => { const b = $("#sndT"); b.innerHTML = wheelsOn ? '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>' : '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>'; b.title = wheelsOn ? "车轮声" : "车轮声 · 关"; };
  wheelsIcon();

  /* ═════════ the trip ═════════
     The clock is the distance: 1 km a minute. A station every 5 km goes by without stopping and inks a stamp into the book on the
     sill. A timed trip brakes into its last station; 先坐一站 rides on until you get off (the train then stops at the next station). */
  const CRUISE = 240, ACCEL = 7, BRAKE = 11;      // px/s of the nearest layer; seconds to speed up; seconds of braking
  let trip = get(TRIP, null);
  if (trip && trip.v !== 2) { localStorage.removeItem(TRIP); trip = null; }
  const unitOf = m => { const dur = +new URLSearchParams(location.search).get("dur"); return dur > 0 ? dur * 1000 / m : 60000; };   // ?dur= seconds for 5 km/min, for trying it out
  const kmNow = () => { const ms = Date.now() - trip.start; return Math.max(0, (trip.open ? ms : Math.min(ms, trip.minutes * trip.unit)) / trip.unit); };
  const lastK = () => trip.open ? Infinity : trip.minutes / KM;
  const nm = k => nameAt(trip.off, k);
  function board() {
    if (trip) return;
    const name = tripName(), pick = pickOf(name);
    trip = { v: 2, id: Math.random().toString(36).slice(2, 9), name, proj: pick ? pick.proj || null : null, open: minutes === 5, minutes,
      off: OFF, seat, no, start: Date.now(), unit: unitOf(minutes === 5 ? 5 : minutes), passed: 0, stamps: [], line: LINE };
    trip.stops = stopsFor(minutes);
    put(TRIP, trip);
    audio();
    window.Sound && Sound.play("tab", { vol: .9 });
    fillTicket(TK, trip);
    // the engine lets off a cloud of steam and pulls away; the ticket comes up and is punched; then you're on board
    // 车票升起来、打孔；然后上车
    setTimeout(() => BD.classList.add("sent"), 700);
    setTimeout(() => Ticket.punch(TK), 1700);
    setTimeout(() => { BD.classList.add("gone"); ride(); }, 3000);
  }

  let riding = false, arrived = false, lastClack = 0, lineTotal = 0, stopping = null;
  function ride() {
    riding = true; arrived = false;
    $("#car").classList.add("on");
    dispatchEvent(new Event("carriageStart"));
    lineUI(); bookUI();
    $("#hudName").textContent = trip.name || "";
    $("#off").innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4H6.5A1.5 1.5 0 0 0 5 5.5v13A1.5 1.5 0 0 0 6.5 20H13"/><path d="M10 12h10M16.5 8.5 20 12l-3.5 3.5"/></svg>'; $("#off").title = trip.open ? "下车" : "中途下车";
    const elapsed = (Date.now() - trip.start) / 1000;
    speed = elapsed > ACCEL ? CRUISE : 0; target = CRUISE;
  }
  /* the line along the bottom: the stations so far and what lies ahead, each with its km; the train carries the distance run */
  function lineUI() {
    const k = Math.floor(kmNow() / KM);
    lineTotal = trip.open ? (k + 2) * KM : trip.minutes;
    const L = $("#line"), n = lineTotal / KM, wide = L.clientWidth, every = Math.max(1, Math.ceil(64 / (wide / n))); L.style.setProperty("--km", lineTotal);
    L.querySelectorAll(".st").forEach(e => e.remove());
    for (let i = 0; i <= n; i++) {
      const e = document.createElement("i"); e.className = "st"; e.style.left = (i / n * 100) + "%";
      const lab = document.createElement("i"); lab.textContent = nm(i);
      if (i % every && i !== n) lab.className = "hid";
      e.appendChild(lab); L.insertBefore(e, $("#line .tr"));
    }
    if (!$("#line .tr")) { const tr = document.createElement("i"); tr.className = "tr"; tr.innerHTML = "<b></b>"; L.appendChild(tr); }
  }
  function updateLine() {
    const km = kmNow(), p = Math.min(1, km / lineTotal), k = Math.floor(km / KM);
    if (trip.open && (k + 2) * KM !== lineTotal) lineUI();
    $("#line .done").style.width = (p * 100) + "%";
    $("#line .tr").style.left = (p * 100) + "%";
    $("#line .tr b").textContent = `${km.toFixed(1)} km`;
    document.querySelectorAll("#line .st").forEach((e, i) => e.classList.toggle("past", i * KM <= km + 1e-6));
    const nk = Math.min(lastK(), k + 1), toNext = Math.max(0, nk * KM - km);
    const min = d => Math.max(0, Math.ceil(d * trip.unit / 60000)), last = lastK();   // only what's ahead: minutes to the next station and to the end
    $("#hudRest").textContent = stopping ? `列车正驶入 ${stopping.name}`
      : trip.open || nk === last ? `${nm(nk)} 还有 ${min(toNext)} 分钟`
      : `${nm(nk)} 还有 ${min(toNext)} 分钟 · 终点 ${nm(last)} 还有 ${min(trip.minutes - km)} 分钟`;
  }
  $("#hudName").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } e.stopPropagation(); });
  $("#hudName").addEventListener("blur", () => { if (!trip) return; trip.name = $("#hudName").textContent.trim().slice(0, 40); $("#hudName").textContent = trip.name; put(TRIP, trip); });

  /* the stamp book is gone (the line below already shows every station passed); stamps are still kept on the trip */
  function bookUI(fresh) {
    const B = $("#book"); if (!B) return; const st = trip.stamps, show = st.slice(-5), md = ts => { const d = new Date(ts); return `${d.getMonth() + 1}.${d.getDate()}`; };
    B.innerHTML = `<span class="ttl">站 章</span>` + (st.length > 5 ? `<span class="more">… ${st.length - 5}</span>` : "") +
      show.map((x, i) => `<span class="stp${fresh && i === show.length - 1 ? " new" : ""}" style="--r:${((x.k * 37) % 17) - 8}deg;transform:rotate(${((x.k * 37) % 17) - 8}deg)"><b>${x.name}</b><small>${md(x.at)}</small></span>`).join("") +
      (trip.passed < lastK() - 1 || trip.open ? `<span class="stp next"><b>${nm(trip.passed + 1)}</b><small>${(trip.passed + 1) * KM} km</small></span>` : "");
  }
  function stampChime() {
    if (!ac) return;
    [784, 988].forEach((fq, i) => { const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + i * .16;
      o.type = "sine"; o.frequency.value = fq; g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.06, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .9);
      o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + 1); });
  }
  // a station goes by: its stamp
  function pass(k) {
    trip.passed = k; trip.stamps.push({ k, name: nm(k), at: Date.now() }); put(TRIP, trip);
    bookUI(true); tickSound(true);   // a station goes by: one firm click, like the dial's notch window.Sound && setTimeout(() => Sound.impact("card", .45), 120);
  }

  function finish(early) {
    if (arrived) return;
    arrived = true;
    const km = kmNow(), k = stopping ? stopping.k : lastK();
    if (!trip.stamps.some(x => x.k === k)) trip.stamps.push({ k, name: nm(k), at: Date.now() });
    const stops = Array.from({ length: k + 1 }, (_, i) => nm(i)), focused = Math.round(km * trip.unit / 60000);
    const rec = Object.assign({}, trip, { stops, done: !early, endAt: Date.now(), reached: k, at: nm(k), focused, km: +km.toFixed(1), planned: trip.minutes, minutes: focused });   // the ticket shows the minutes actually ridden
    const all = get(TICKETS, []) || []; all.push(rec); put(TICKETS, all);
    localStorage.removeItem(TRIP);
    if (rec.proj) {
      const S = get("paper-desk.desk-tasks.v1", null);
      const p2 = S && (S.projects || []).find(x => x.id === rec.proj);
      if (p2) { p2.sessions = (p2.sessions || 0) + 1; p2.focus = (p2.focus || 0) + rec.focused; put("paper-desk.desk-tasks.v1", S); }
    }
    $("#slot").innerHTML = Ticket.html(rec, { punched: true });
    const tk = $("#slot .tkt"); tk.style.setProperty("--tw", "min(520px, 86vw)"); Ticket.physics(tk);
    $("#arrMsg").textContent = "";   // the ticket says it all
    $("#arrive").classList.add("on");
    chime();
    setTimeout(() => { tk.classList.add("stamped"); window.Sound && Sound.impact("card", .8); }, 700);
  }
  // getting off: the train brakes into the next station and stops there
  $("#off").onclick = () => {
    if (arrived || stopping) return;
    if (!trip.open && !confirm("在下一站下车？")) return;
    const k = Math.min(lastK(), trip.passed + 1), T = Math.max(1.5, Math.min(8, speed / CRUISE * 8));
    stopping = { k, name: nm(k), t0: performance.now(), T, v0: speed, w0: world, early: !trip.open };
  };
  $("#again").onclick = () => { location.reload(); };

  /* ───────── the loop ───────── */
  let last = performance.now(), lastLinePaint = 0;
  function frame(now) {
    if (arrived) return;
    if (document.hidden) { last = now; requestAnimationFrame(frame); return; }
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (riding) {
      const km = kmNow(), k = Math.floor(km / KM);
      if (!arrived && !stopping) {
        // stations on the way go by at speed, each one stamped
        while (trip.passed < k && trip.passed + 1 < lastK()) pass(trip.passed + 1);
        // A timed trip brakes into its final station.
        const leftS = trip.open ? Infinity : (trip.start + trip.minutes * trip.unit - Date.now()) / 1000;
        if (leftS <= BRAKE) { const T = Math.max(.5, leftS); stopping = { k: lastK(), name: nm(lastK()), t0: now, T, v0: speed, w0: world, early: false }; }
      }
      if (stopping) {
        // even braking, worked out from the time (not summed frame by frame), so it comes to rest exactly at the platform
        const S = stopping, tau = Math.min(S.T, (now - S.t0) / 1000);
        speed = S.v0 * (1 - tau / S.T); world = S.w0 + S.v0 * (tau - tau * tau / (2 * S.T));
        if (tau >= S.T && !arrived) { if (!S.done) S.done = now; else if (now - S.done > 1200) finish(S.early); }
      } else { speed += (target - speed) * (1 - Math.exp(-dt / (target > speed ? ACCEL / 3 : 1))); world += speed * dt; }
      window.trainSpeed = speed / CRUISE;   // carriage.js: how fast the forest goes by
      if (rumble) { rumble.g.gain.value = wheelsOn ? Math.min(.5, speed / CRUISE * .5) : 0; rumble.lp.frequency.value = 160 + speed * .6; }
      if (speed > 20 && world - lastClack > 520) { lastClack = world; clack(Math.min(1, speed / CRUISE)); }
      // The station labels and progress HUD are DOM-heavy; 4 updates/sec are
      // visually indistinguishable from 60 while leaving the render loop free.
      if (!lastLinePaint || now - lastLinePaint >= 250) {
        updateLine();
        lastLinePaint = now;
      }
    }
    requestAnimationFrame(frame);
  }
  addEventListener("resize", () => { if (riding) lineUI(); });
  // back on the train if the page was closed mid-trip
  if (!trip) setTimeout(board, 600);                                    // 打开就上车（行程长短用上次选的；没选过是先坐一站）
  if (trip) { $("#board").classList.add("gone"); seat = trip.seat; no = trip.no; fillTicket(TK, trip); TK.classList.add("punched"); ride();
    addEventListener("pointerdown", () => audio(), { once: true }); }
  requestAnimationFrame(frame);
})();
</script>
